<div class="body-text"><div class="bt-ar">من ابتداء الكسوف أو الخسوف إلى التجلِّي - أي زوال الخسوف أو الكسوف -، ولا تُعاد الصلاة، فإذا صلَّوها ولم يحصل التجلِّي بعدها فلا تُعاد، بل يستمرُّون في الدعاء والاستغفار.</div><div class="bt-translit">Min ibtidāʾi l-kusūfi awi l-khusūfi ilā t-tajallī — ay zawāli l-khusūfi awi l-kusūf —, wa lā tuʿādu ṣ-ṣalāh; fa-idhā ṣallawhā wa lam yaḥṣuli t-tajallī baʿdahā fa-lā tuʿād, bal yastamirrūna fī d-duʿāʾi wa l-istighfār.</div><div class="bt-en">From the <strong>start</strong> of the eclipse until <strong>at-tajallī</strong> — meaning the eclipse has cleared. The prayer is <strong>not repeated</strong>: if they have prayed it and the eclipse has not cleared yet, they do not pray it again. Instead, they <strong>keep making duʿāʾ and istighfār</strong>.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Don’t pray it twice</span><div class="study-note-body">If the prayer ends and the eclipse is still there, do <strong>not</strong> start a second eclipse prayer. Keep going with duʿāʾ and asking forgiveness until it clears.</div></div>

<div class="sec"><div class="sec-ar">صفتها</div><div class="sec-translit">Ṣifatuhā</div><div class="sec-en">How It Is Performed</div></div>

<div class="body-text"><div class="bt-ar">عدد ركعاتها ركعتان، يُجهر فيهما بالقراءة، وتوضيحها كما يلي:</div><div class="bt-translit">ʿAdadu rakaʿātihā rakʿatān, yujharu fīhimā bi-l-qirāʾah, wa tawḍīḥuhā kamā yalī:</div><div class="bt-en">It has <strong>two rakʿahs</strong>, with the recitation <strong>aloud</strong>. Here is how (the book shows 15 photos):</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 The big difference: two rukūʿs in each rakʿah</span><div class="study-note-body">In a normal prayer, each rakʿah has one recitation and one rukūʿ. In the eclipse prayer, each rakʿah has <strong>two recitations and two rukūʿs</strong>, then the sujūd. And everything gets a little <strong>shorter</strong> each time. Watch for the words <em>"shorter than…"</em> (أقصر من) in the steps.</div></div>

<p style="margin:10px 0 4px"><strong>The first rakʿah</strong></p>
<ol class="num-list">
<li data-n="1"><div class="li-ar">يكبِّر للإحرام، ويستفتح ويستعيذ ويبسمل، ويقرأ الفاتحة، ثم يقرأ قراءة طويلة.</div><div class="li-translit">Yukabbiru li-l-iḥrām, wa yastaftiḥu wa yastaʿīdhu wa yubasmil, wa yaqraʾu l-Fātiḥah, thumma yaqraʾu qirāʾatan ṭawīlah.</div><div class="li-en">He says the <strong>opening takbīr</strong>, reads the opening duʿāʾ, seeks refuge, says bismillāh, recites al-Fātiḥah, then a <strong>long recitation</strong>.</div></li>
<li data-n="2"><div class="li-ar">يركع ركوعًا طويلاً (الركوع الأول).</div><div class="li-translit">Yarkaʿu rukūʿan ṭawīlan (ar-rukūʿu l-awwal).</div><div class="li-en">He bows in a <strong>long rukūʿ</strong> (<strong>the first rukūʿ</strong>).</div></li>
<li data-n="3"><div class="li-ar">يرفع من الركوع ويقول: سمع الله لمن حمده... إلخ.</div><div class="li-translit">Yarfaʿu mina r-rukūʿi wa yaqūl: samiʿa llāhu liman ḥamidah… ilakh.</div><div class="li-en">He rises from rukūʿ saying: <em>"Samiʿa llāhu liman ḥamidah"</em> (Allah hears whoever praises Him)… etc.</div></li>
<li data-n="4"><div class="li-ar">ثم يقرأ الفاتحة، ثم يقرأ قراءة طويلة أقصر من الأولى.</div><div class="li-translit">Thumma yaqraʾu l-Fātiḥah, thumma yaqraʾu qirāʾatan ṭawīlatan aqṣara mina l-ūlā.</div><div class="li-en">Then (still standing) he recites al-Fātiḥah again, then a long recitation <strong>shorter than the first</strong>.</div></li>
<li data-n="5"><div class="li-ar">ثم يركع ركوعًا طويلاً أقصر من الركوع الأول (الركوع الثاني).</div><div class="li-translit">Thumma yarkaʿu rukūʿan ṭawīlan aqṣara mina r-rukūʿi l-awwal (ar-rukūʿu th-thānī).</div><div class="li-en">Then he bows in a long rukūʿ, <strong>shorter than the first rukūʿ</strong> (<strong>the second rukūʿ</strong>).</div></li>
<li data-n="6"><div class="li-ar">يرفع من الركوع ويقول: سمع الله لمن حمده... إلخ.</div><div class="li-translit">Yarfaʿu mina r-rukūʿi wa yaqūl: samiʿa llāhu liman ḥamidah… ilakh.</div><div class="li-en">He rises from rukūʿ saying: <em>"Samiʿa llāhu liman ḥamidah"</em>… etc.</div></li>
<li data-n="7"><div class="li-ar">يسجد سجدتين طويلتين، ثم يرفع للركعة الثانية.</div><div class="li-translit">Yasjudu sajdatayni ṭawīlatayn, thumma yarfaʿu li-r-rakʿati th-thāniyah.</div><div class="li-en">He makes <strong>two long prostrations</strong>, then rises for the <strong>second rakʿah</strong>.</div></li>
</ol>

<p style="margin:10px 0 4px"><strong>The second rakʿah</strong></p>
<ol class="num-list">
<li data-n="8"><div class="li-ar">يقرأ الفاتحة، ثم يقرأ قراءة طويلة أقصر من الثانية.</div><div class="li-translit">Yaqraʾu l-Fātiḥah, thumma yaqraʾu qirāʾatan ṭawīlatan aqṣara mina th-thāniyah.</div><div class="li-en">He recites al-Fātiḥah, then a long recitation <strong>shorter than the second</strong>.</div></li>
<li data-n="9"><div class="li-ar">يركع ركوعًا طويلاً أقصر من الثاني (الركوع الثالث).</div><div class="li-translit">Yarkaʿu rukūʿan ṭawīlan aqṣara mina th-thānī (ar-rukūʿu th-thālith).</div><div class="li-en">He bows in a long rukūʿ, <strong>shorter than the second</strong> (<strong>the third rukūʿ</strong>).</div></li>
<li data-n="10"><div class="li-ar">يرفع من الركوع ويقول: سمع الله لمن حمده... إلخ.</div><div class="li-translit">Yarfaʿu mina r-rukūʿi wa yaqūl: samiʿa llāhu liman ḥamidah… ilakh.</div><div class="li-en">He rises from rukūʿ saying: <em>"Samiʿa llāhu liman ḥamidah"</em>… etc.</div></li>
<li data-n="11"><div class="li-ar">ثم يقرأ الفاتحة، ثم يقرأ قراءة طويلة أقصر من الثالثة.</div><div class="li-translit">Thumma yaqraʾu l-Fātiḥah, thumma yaqraʾu qirāʾatan ṭawīlatan aqṣara mina th-thālithah.</div><div class="li-en">Then he recites al-Fātiḥah, then a long recitation <strong>shorter than the third</strong>.</div></li>
<li data-n="12"><div class="li-ar">ثم يركع ركوعًا طويلاً أقصر من الركوع الثالث (الركوع الرابع).</div><div class="li-translit">Thumma yarkaʿu rukūʿan ṭawīlan aqṣara mina r-rukūʿi th-thālith (ar-rukūʿu r-rābiʿ).</div><div class="li-en">Then he bows in a long rukūʿ, <strong>shorter than the third rukūʿ</strong> (<strong>the fourth rukūʿ</strong>).</div></li>
<li data-n="13"><div class="li-ar">يرفع من الركوع ويقول: سمع الله لمن حمده... إلخ.</div><div class="li-translit">Yarfaʿu mina r-rukūʿi wa yaqūl: samiʿa llāhu liman ḥamidah… ilakh.</div><div class="li-en">He rises from rukūʿ saying: <em>"Samiʿa llāhu liman ḥamidah"</em>… etc.</div></li>
<li data-n="14"><div class="li-ar">يسجد سجدتين طويلتين، أقصر من السجدتين في الركعة الأولى.</div><div class="li-translit">Yasjudu sajdatayni ṭawīlatayn, aqṣara mina s-sajdatayni fī r-rakʿati l-ūlā.</div><div class="li-en">He makes two long prostrations, <strong>shorter than the two prostrations of the first rakʿah</strong>.</div></li>
<li data-n="15"><div class="li-ar">ثم يجلس للتشهُّد، ثم يسلِّم.</div><div class="li-translit">Thumma yajlisu li-t-tashahhud, thumma yusallim.</div><div class="li-en">Then he sits for the <strong>tashahhud</strong>, then says the <strong>taslīm</strong>.</div></li>
</ol>

<div class="study-note remember"><span class="study-note-label">⭐ The shape of the prayer</span><div class="study-note-body"><strong>2 rakʿahs × (2 recitations + 2 rukūʿs) + sujūd</strong> = <strong>4 rukūʿs and 4 sajdahs</strong> in total.<br>Rakʿah 1: recite (longest) → rukūʿ 1 → stand, recite → rukūʿ 2 → stand → 2 sajdahs.<br>Rakʿah 2: recite → rukūʿ 3 → stand, recite → rukūʿ 4 → stand → 2 sajdahs → tashahhud → salām.<br>Rule: <strong>each part is a bit shorter than the one before it</strong>.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Where the rakʿah really "counts"</span><div class="study-note-body">Beginners often get lost after the first rukūʿ and go straight to sujūd. Remember: after the <strong>first</strong> rukūʿ you stand up and <strong>recite again</strong>, al-Fātiḥah included (steps 4 and 11). Sujūd only comes after the <strong>second</strong> rukūʿ of each rakʿah.</div></div>
`;}

</ul></div></div>
</div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — "until Allah removes it"</span><div class="study-note-body">Look at the last sunnah: keep making duʿāʾ, istighfār and charity <em>"until Allah removes what has come upon the people."</em> In both prayers of this unit, the answer to a frightening event is the same: <strong>humility, forgiveness, giving</strong>. Allah could have simply given rain and kept the sun shining forever. Instead He sometimes gives us these moments so our hearts wake up. That is His mercy too.<br><br>A small practice: the next time you read about an eclipse coming, plan your duʿāʾ list and a small ṣadaqah in advance.</div></div>

<div class="sec"><div class="sec-ar">الدرس السابع: صلاة الجماعة (فضلها - حكمها - أحكامها)</div><div class="sec-translit">Ad-darsu s-sābiʿ: Ṣalātu l-jamāʿah (faḍluhā – ḥukmuhā – aḥkāmuhā)</div><div class="sec-en">Lesson 7: Congregational Prayer (its virtue, its ruling, its rules)</div></div>

<div class="body-text"><div class="bt-label">تمهيد · Introduction</div><div class="bt-ar">قال سعيد بن المسيّب رحمه الله: ما فاتتني الصلاة في جماعة منذ أربعين سنة.</div><div class="bt-translit">Qāla Saʿīdu bnu l-Musayyabi raḥimahu-llāh: mā fātatni ṣ-ṣalātu fī jamāʿatin mundhu arbaʿīna sanah.</div><div class="bt-en">Saʿīd ibn al-Musayyab (may Allah have mercy on him) said: <strong>"I have not missed the prayer in congregation for forty years."</strong></div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Who was Saʿīd ibn al-Musayyab?</span><div class="study-note-body">He was one of the greatest scholars of the generation after the Companions (the <em>Tābiʿūn</em>), living in Madīnah. Forty years without missing the congregation! The book opens with his words to show you how much the early Muslims loved praying together in the masjid.</div></div>

<div class="sec"><div class="sec-ar">فضل صلاة الجماعة</div><div class="sec-translit">Faḍlu ṣalāti l-jamāʿah</div><div class="sec-en">The Virtue of Congregational Prayer</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 1 — 27 degrees</div><div class="h-ar">عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: «صلاة الجماعة تفضل صلاة الفرد بسبع وعشرين درجة» وفي رواية «بخمس وعشرين».</div><div class="h-translit">ʿAn Abī Hurayrata qāl: qāla rasūlu-llāhi ﷺ: «Ṣalātu l-jamāʿati tafḍulu ṣalāta l-fardi bi-sabʿin wa ʿishrīna darajah», wa fī riwāyah: «bi-khamsin wa ʿishrīn».</div><div class="h-en">Abū Hurayrah said: The Messenger of Allah ﷺ said: <strong>"Prayer in congregation surpasses the prayer of one alone by twenty-seven degrees."</strong> In another narration: "by twenty-five."</div><div class="h-source">أخرجه البخاري برقم (٦٤٧)، ومسلم برقم (٦٤٩) · Narrated by al-Bukhārī, no. 647, and Muslim, no. 649</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Simple maths, huge reward</span><div class="study-note-body">Same four rakʿahs. Same time. But in congregation the reward is <strong>27 times</strong> more. <em>Darajah</em> (دَرَجَة) means a "degree" or "level", like a step on a ladder.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 2 — Protection from Shayṭān</div><div class="h-ar">وعن أبي الدرداء ﵁ قال: قال رسول الله ﷺ: «ما من ثلاثة في قرية ولا بَدْوٍ لا تقام فيهم الصلاة إلا قد استحوذ عليهم الشيطان، فعليكم بالجماعة فإنما يأكل الذئب من الغنم القاصية».</div><div class="h-translit">Wa ʿan Abi d-Dardāʾi qāl: qāla rasūlu-llāhi ﷺ: «Mā min thalāthatin fī qaryatin wa lā badwin lā tuqāmu fīhimu ṣ-ṣalātu illā qadi s-taḥwadha ʿalayhimu sh-shayṭān, fa-ʿalaykum bi-l-jamāʿati fa-innamā yaʾkulu dh-dhiʾbu mina l-ghanami l-qāṣiyah».</div><div class="h-en">Abu d-Dardāʾ said: The Messenger of Allah ﷺ said: <strong>"There are no three people in a village or in the desert among whom the prayer is not established (in congregation), except that Shayṭān has taken control of them. So hold on to the congregation, for the wolf only eats the sheep that strays far away."</strong></div><div class="h-source">أخرجه أبو داود برقم (٥٤٧)، والنسائي برقم (٨٤٧) · Narrated by Abū Dāwūd, no. 547, and an-Nasāʾī, no. 847</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What does the wolf picture mean?</span><div class="study-note-body">A sheep that stays with the flock is safe. The one that wanders off alone is the easy target. The Prophet ﷺ is saying: Shayṭān is the wolf. When Muslims pray together, they protect each other. <em>Al-qāṣiyah</em> (الْقَاصِيَة) = the far-off, straying one.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 3 — A whole night of prayer</div><div class="h-ar">عن عثمان بن عفان ﵁ قال: قال رسول الله ﷺ: «من صلَّى العشاء في جماعة فكأنما قام نصف الليل، ومن صلَّى الصبح في جماعة فكأنما صلَّى الليل كله».</div><div class="h-translit">ʿAn ʿUthmāna bni ʿAffāna qāl: qāla rasūlu-llāhi ﷺ: «Man ṣallā l-ʿishāʾa fī jamāʿatin fa-ka-annamā qāma niṣfa l-layl, wa man ṣalla ṣ-ṣubḥa fī jamāʿatin fa-ka-annamā ṣalla l-layla kullah».</div><div class="h-en">ʿUthmān ibn ʿAffān said: The Messenger of Allah ﷺ said: <strong>"Whoever prays ʿIshāʾ in congregation, it is as if he stood (in prayer) half the night. And whoever prays Ṣubḥ (Fajr) in congregation, it is as if he prayed the whole night."</strong></div><div class="h-source">أخرجه مسلم برقم (٦٥٦) · Narrated by Muslim, no. 656</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">جَمَاعَة · jamāʿah</div><div class="study-note-body">Root ج-م-ع (j-m-ʿ) = <strong>to gather, to bring together</strong>. From the same root: <em>jāmiʿ</em> (a big masjid where people gather), <em>al-jumuʿah</em> (Friday, the day of gathering), and <em>al-jamʿ</em> (combining two prayers, which you will meet in Lesson 8). One root, one idea: togetherness.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Allah could have made the reward the same whether you pray alone or together. Instead He multiplied it 27 times for gathering. That tells you something: He loves to see His servants standing side by side, shoulder to shoulder. Ask yourself: which prayer of my day could I bring closer to the congregation, even once a week? (For sisters, the next lessons explain who the obligation is on. The love of togetherness is for all of us.)</div></div>
`;}

<div class="activity" id="act7p2a">

<div class="act-item"><div class="act-prompt"><div class="act-ar">من خلال هذه الأحاديث أستخرج أربع فضائل لصلاة الجماعة:</div><div class="act-translit">Min khilāli hādhihi l-aḥādīthi astakhriju arbaʿa faḍāʾila li-ṣalāti l-jamāʿah.</div>From these ḥadīths, I draw out four virtues of congregational prayer.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">1. It is better than praying alone by <strong>27 degrees</strong> (25 in another narration).<br>2. It <strong>protects from Shayṭān</strong> taking control of people.<br>3. Praying <strong>ʿIshāʾ</strong> in congregation is like standing in prayer for <strong>half the night</strong>.<br>4. Praying <strong>Fajr</strong> in congregation is like praying <strong>the whole night</strong>.</div></div>
</div>

<div class="sec"><div class="sec-ar">حكم صلاة الجماعة</div><div class="sec-translit">Ḥukmu ṣalāti l-jamāʿah</div><div class="sec-en">The Ruling on Congregational Prayer</div></div>

<div class="defbox"><div class="defbox-tag">📌 Ruling</div><div class="defbox-body"><div class="defbox-ar">صلاة الجماعة واجبة في المسجد للصلوات الخمس على الرجال المقيمين القادرين.</div><div class="defbox-translit">Ṣalātu l-jamāʿati wājibatun fi l-masjidi li-ṣ-ṣalawāti l-khamsi ʿala r-rijāli l-muqīmīna l-qādirīn.</div><div class="defbox-en">Congregational prayer in the masjid is <strong>obligatory (wājib)</strong> for the five daily prayers upon <strong>men</strong> who are <strong>residents</strong> (not travelling) and <strong>able</strong>.</div></div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Three conditions, one word each</span><div class="study-note-body">Who must attend? <strong>Rijāl</strong> (men) + <strong>muqīmīn</strong> (residents) + <strong>qādirīn</strong> (able).<br>So it is not obligatory on women, on travellers, or on someone who is truly unable (like the sick).</div></div>

<div class="sec"><div class="sec-ar">الدليل على وجوب صلاة الجماعة</div><div class="sec-translit">Ad-dalīlu ʿalā wujūbi ṣalāti l-jamāʿah</div><div class="sec-en">The Evidence That Congregational Prayer Is Obligatory</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — The blind man who asked for permission</div><div class="h-ar">وعن ابن أم مكتوم ﵁ أنه سأل النبي ﷺ فقال: يا رسول الله، إني رجل ضرير البصر، شاسع الدار، ولِي قائدٌ لا يلائمني، فهل لي رخصة أن أصلي في بيتي؟ قال: «هل تسمع النداء؟» قال: نعم، قال: «لا أجد لك رخصة».</div><div class="h-translit">Wa ʿani bni Ummi Maktūmin annahu saʾala n-nabiyya ﷺ fa-qāl: yā rasūla-llāh, innī rajulun ḍarīru l-baṣar, shāsiʿu d-dār, wa lī qāʾidun lā yulāʾimunī, fa-hal lī rukhṣatun an uṣalliya fī baytī? Qāl: «Hal tasmaʿu n-nidāʾ?» Qāl: naʿam. Qāl: «Lā ajidu laka rukhṣah».</div><div class="h-en">Ibn Umm Maktūm asked the Prophet ﷺ: "O Messenger of Allah, I am a blind man, my house is far away, and I have a guide who does not suit me. Do I have permission to pray in my house?" He said: <strong>"Do you hear the call (adhān)?"</strong> He said: "Yes." He said: <strong>"I do not find any permission for you."</strong></div><div class="h-source">أخرجه مسلم برقم (٦٥٣)، وأبو داود برقم (٥٥٣) واللفظ له · Narrated by Muslim, no. 653, and Abū Dāwūd, no. 553 (this wording is his)</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why is this strong evidence?</span><div class="study-note-body">This man had <strong>three</strong> difficulties: he was blind, he lived far, and his guide was not helpful. Still, the Prophet ﷺ did not excuse him because he could hear the adhān. If a blind man with no good guide was told to come, then a sighted, healthy man has even less excuse. If the jamāʿah were only recommended, he would have simply said "pray at home."</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Don't mix up the words</span><div class="study-note-body"><strong>Rukhṣah</strong> (رُخْصَة) = a permission / concession (an easing).<br><strong>Nidāʾ</strong> (نِدَاء) = the call, here meaning the adhān.<br>"Lā ajidu laka rukhṣah" = "I find no concession for you."</div></div>

<div class="activity" id="act7p2b">
<div class="section-badge">نَشَاط · Activity 2</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act7p2b'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act7p2b'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt"><div class="act-ar">بالتعاون مع زملائي: أذكر أوجه الدلالة على وجوب صلاة الجماعة من هذه الأحاديث.</div><div class="act-translit">Bi-t-taʿāwuni maʿa zumalāʾī: adhkuru awjuha d-dalālati ʿalā wujūbi ṣalāti l-jamāʿati min hādhihi l-aḥādīth.</div>With my classmates: I mention the points in these ḥadīths that show congregational prayer is obligatory.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">1. <strong>Ibn Umm Maktūm:</strong> the Prophet ﷺ refused to excuse a blind man with a far house and no good guide, because he heard the adhān: "I do not find any permission for you." Only something obligatory is treated like that.<br>2. The obligation is linked to <strong>hearing the call</strong>: "Do you hear the call?"<br>3. <strong>Abu d-Dardāʾ:</strong> people who do not establish the prayer in congregation are ones whom <strong>Shayṭān has taken control of</strong>. That is a warning, and warnings come with leaving an obligation.<br>4. "<strong>Fa-ʿalaykum bi-l-jamāʿah</strong>" (so hold on to the congregation) is a <strong>command</strong>.</div></div>
</div>

<div class="sec"><div class="sec-ar">فوائد صلاة الجماعة</div><div class="sec-translit">Fawāʾidu ṣalāti l-jamāʿah</div><div class="sec-en">The Benefits of Congregational Prayer</div></div>

<div class="body-text"><div class="bt-ar">لاجتماع المسلمين في صلاة الجماعة كل يوم خمس مرات فوائد وحكم عظيمة يدركها كل من يحافظ على صلاة الجماعة في المسجد، أناقش مع معلّمي هذه الحِكَم وأكتبها.</div><div class="bt-translit">Li-jtimāʿi l-muslimīna fī ṣalāti l-jamāʿati kulla yawmin khamsa marrātin fawāʾidu wa ḥikamun ʿaẓīmah, yudrikuhā kullu man yuḥāfiẓu ʿalā ṣalāti l-jamāʿati fi l-masjid. Unāqishu maʿa muʿallimī hādhihi l-ḥikama wa aktubuhā.</div><div class="bt-en">The gathering of Muslims for congregational prayer five times every day has great benefits and wisdoms, which everyone who keeps up congregational prayer in the masjid comes to notice. I discuss these wisdoms with my teacher and write them down.</div></div>

<div class="activity" id="act7p3a">
<div class="section-badge">نَشَاط · Activity</div>
<div class="act-item"><div class="act-prompt">Write three benefits (١ - ٢ - ٣).</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">1. <strong>Love and brotherhood:</strong> Muslims meet, greet each other, and get to know one another.<br>2. <strong>Caring for each other:</strong> people notice who is absent, so they can visit the sick and help the one in need.<br>3. <strong>Equality and order:</strong> rich and poor stand in one line behind one imam, following him together.<br>(Also: the huge multiplied reward, and showing the strength and unity of the Muslims.)</div></div>
</div>

<div class="sec"><div class="sec-ar">ما تُدرك به الجماعة</div><div class="sec-translit">Mā tudraku bihi l-jamāʿah</div><div class="sec-en">How the Congregation Is "Caught"</div></div>

<div class="body-text"><div class="bt-ar">تُدرك صلاة الجماعة بإدراك ركعة من الصلاة مع الإمام، ودليل ذلك حديث أبي هريرة ﵁ أن رسول الله ﷺ قال: «من أدرك ركعة من الصلاة فقد أدرك الصلاة».</div><div class="bt-translit">Tudraku ṣalātu l-jamāʿati bi-idrāki rakʿatin mina ṣ-ṣalāti maʿa l-imām, wa dalīlu dhālika ḥadīthu Abī Hurayrata anna rasūla-llāhi ﷺ qāl: «Man adraka rakʿatan mina ṣ-ṣalāti fa-qad adraka ṣ-ṣalāh».</div><div class="bt-en">The congregational prayer is <strong>caught by catching one rakʿah</strong> of the prayer with the imam. The evidence is the ḥadīth of Abū Hurayrah that the Messenger of Allah ﷺ said: <strong>"Whoever catches one rakʿah of the prayer has caught the prayer."</strong></div></div>
<div class="h-source">أخرجه البخاري برقم (٥٨٠)، ومسلم برقم (٦٠٧) · Narrated by al-Bukhārī, no. 580, and Muslim, no. 607</div>

<div class="body-text"><div class="bt-ar">فإن أدرك أقل من ركعة فلا يُعدّ مدركًا للجماعة، ولكن يشرع له أن يدخل مع الإمام فيما بقي من الصلاة؛ لقول النبي ﷺ: «فما أدركتم فصلُّوا وما فاتكم فأتمّوا». ولا يُعدّ هذا الرجل مدركًا للجماعة، لكن له ثواب ما أدرك مع الإمام من الصلاة، وإن كان معذورًا بتأخره أدرك فضل الجماعة.</div><div class="bt-translit">Fa-in adraka aqalla min rakʿatin fa-lā yuʿaddu mudrikan li-l-jamāʿah, wa lākin yushraʿu lahu an yadkhula maʿa l-imāmi fīmā baqiya mina ṣ-ṣalāh; li-qawli n-nabiyyi ﷺ: «Fa-mā adraktum fa-ṣallū wa mā fātakum fa-atimmū». Wa lā yuʿaddu hādha r-rajulu mudrikan li-l-jamāʿah, lākin lahu thawābu mā adraka maʿa l-imāmi mina ṣ-ṣalāh, wa in kāna maʿdhūran bi-taʾakhkhurihi adraka faḍla l-jamāʿah.</div><div class="bt-en">If he catches <strong>less than a rakʿah</strong>, he is not counted as having caught the congregation. But it is still prescribed for him to join the imam in whatever is left of the prayer, because the Prophet ﷺ said: <strong>"Whatever you catch, pray it, and whatever you missed, complete it."</strong> This person is not counted as having caught the congregation, but he gets the reward of what he caught with the imam. And if he had a valid excuse for being late, he gets the virtue of the congregation.</div></div>
<div class="h-source">أخرجه البخاري برقم (٦٣٥)، ومسلم برقم (٦٠٢) · Narrated by al-Bukhārī, no. 635, and Muslim, no. 602</div>
<div class="h-source">انظر: مجموع فتاوى الشيخ ابن باز رحمه الله ١٢/ ١٦٤ · See: Majmūʿ Fatāwā of Shaykh Ibn Bāz (may Allah have mercy on him), 12/164</div>

<div class="study-note beginner"><span class="study-note-label">💡 So what if I arrive late?</span><div class="study-note-body">Never wait at the door! <strong>Join straight away</strong>, whatever position the imam is in. If you caught at least one full rakʿah, you caught the congregation. If you only caught the last sitting, you still get reward for what you joined. And if you were late for a real reason (not laziness), Allah may give you the full virtue anyway. That is His generosity.</div></div>

<div class="act-item"><div class="act-prompt"><div class="act-ar">دخل صالح المسجد والإمام في التشهد الأخير فماذا يفعل؟</div><div class="act-translit">Dakhala Ṣāliḥun al-masjida wa l-imāmu fi t-tashahhudi l-akhīr, fa-mādhā yafʿal?</div>Ṣāliḥ entered the masjid while the imam was in the final tashahhud. What should he do?</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">He says <strong>takbīrat al-iḥrām</strong> standing, then <strong>joins the imam straight away</strong> and sits with him in the tashahhud (he does not wait for the next prayer or a new group). When the imam says salām, Ṣāliḥ stands and <strong>prays the whole prayer</strong>, because what you missed you complete. He has not caught the congregation (less than one rakʿah), but he gets the reward of what he joined. If he was late for a valid excuse, he gets the virtue of the congregation.</div></div>
</div>
`;}

function L7P4(){return `
<div class="sec"><div class="sec-ar">ما تُدرك به الركعة</div><div class="sec-translit">Mā tudraku bihi r-rakʿah</div><div class="sec-en">How a Rakʿah Is Caught</div></div>

<div class="body-text"><div class="bt-ar">تُدرك الركعة بإدراك الركوع، فإذا أدرك المسبوق إمامه راكعًا: فيجب أن يكبّر تكبيرة الإحرام وهو واقف، ثم يركع مكبرًا مرة أخرى للركوع، وإن اقتصر على تكبيرة الإحرام حال قيامه أجزأته عن تكبيرة الركوع.</div><div class="bt-translit">Tudraku r-rakʿatu bi-idrāki r-rukūʿ, fa-idhā adraka l-masbūqu imāmahu rākiʿan: fa-yajibu an yukabbira takbīrata l-iḥrāmi wa huwa wāqif, thumma yarkaʿa mukabbiran marratan ukhrā li-r-rukūʿ, wa ini qtaṣara ʿalā takbīrati l-iḥrāmi ḥāla qiyāmihi ajzaʾathu ʿan takbīrati r-rukūʿ.</div><div class="bt-en">A rakʿah is caught by <strong>catching the rukūʿ (bowing)</strong>. If the latecomer (<em>masbūq</em>) finds his imam bowing, he <strong>must say takbīrat al-iḥrām while standing</strong>, then bow, saying the takbīr again for the rukūʿ. If he only says takbīrat al-iḥrām while standing, it is enough instead of the takbīr for bowing.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ A very common mistake</span><div class="study-note-body">Some people rush in and say "Allāhu akbar" while already going down into rukūʿ. The <strong>opening takbīr must be said standing upright</strong>. Stand, say Allāhu akbar, then bow. And remember: if you reach the rukūʿ before the imam rises, you caught that rakʿah. If he already rose, that rakʿah is missed.</div></div>

<div class="sec"><div class="sec-ar">حكم النّافلة إذا أُقيمت الصلاة</div><div class="sec-translit">Ḥukmu n-nāfilati idhā uqīmati ṣ-ṣalāh</div><div class="sec-en">The Ruling on Voluntary Prayer Once the Iqāmah Is Called</div></div>

<div class="num-list"><ol>
<li data-n="1"><div class="li-ar">إذا أُقيمت الصلاة فلا يجوز الابتداء بالنافلة حتى ولو كانت تحية المسجد.</div><div class="li-translit">Idhā uqīmati ṣ-ṣalātu fa-lā yajūzu l-ibtidāʾu bi-n-nāfilati ḥattā wa law kānat taḥiyyata l-masjid.</div><div class="li-en">Once the iqāmah is called, it is <strong>not allowed to start</strong> a voluntary prayer, even if it is taḥiyyat al-masjid (the prayer of greeting the masjid).</div></li>
<li data-n="2"><div class="li-ar">ومن كان قد بدأ بالنافلة قبل الإقامة فإذا أقيمت الصلاة قطع النافلة، ليدرك تكبيرة الإحرام مع الإمام.</div><div class="li-translit">Wa man kāna qad badaʾa bi-n-nāfilati qabla l-iqāmati fa-idhā uqīmati ṣ-ṣalātu qaṭaʿa n-nāfilah, li-yudrika takbīrata l-iḥrāmi maʿa l-imām.</div><div class="li-en">Whoever had already started a voluntary prayer before the iqāmah, then the iqāmah is called, <strong>stops the voluntary prayer</strong> so that he can catch takbīrat al-iḥrām with the imam.</div></li>
</ol></div>

<div class="study-note remember"><span class="study-note-label">⭐ Memory hook</span><div class="study-note-body"><strong>Iqāmah = the obligatory prayer comes first.</strong> When you hear it, everything voluntary stops. The farḍ with the imam is the priority.</div></div>

<div class="sec"><div class="sec-ar">الأعذار التي تبيح للإنسان ترك صلاة الجماعة</div><div class="sec-translit">Al-aʿdhāru llatī tubīḥu li-l-insāni tarka ṣalāti l-jamāʿah</div><div class="sec-en">Excuses That Allow a Person to Miss the Congregation</div></div>

<div class="body-text"><div class="bt-ar">من يُسْرِ الشريعة الإسلامية وسماحتها، ونفي الحرج عن أهلها أنها جاءت بالتخفيف عند حصول المشقة في حالات ومواضع متعددة، منها ما سبق في المسح على الخفين، والتيمم والقصر والجمع وصلاة الخوف، وعلى هذه القاعدة جاءت النصوص الكثيرة بجواز التخلّف عن الجمعة والجماعة - مع وجوبهما وأهميتهما - عند حصول بعض الأعذار، ومن أهمّها ما يلي:</div><div class="bt-translit">Min yusri sh-sharīʿati l-islāmiyyati wa samāḥatihā, wa nafyi l-ḥaraji ʿan ahlihā annahā jāʾat bi-t-takhfīfi ʿinda ḥuṣūli l-mashaqqati fī ḥālātin wa mawāḍiʿa mutaʿaddidah, minhā mā sabaqa fi l-masḥi ʿala l-khuffayn, wa t-tayammumi wa l-qaṣri wa l-jamʿi wa ṣalāti l-khawf. Wa ʿalā hādhihi l-qāʿidati jāʾati n-nuṣūṣu l-kathīratu bi-jawāzi t-takhallufi ʿani l-jumuʿati wa l-jamāʿah – maʿa wujūbihimā wa ahammiyyatihimā – ʿinda ḥuṣūli baʿḍi l-aʿdhār, wa min ahammihā mā yalī:</div><div class="bt-en">Part of the <strong>ease and generosity</strong> of the Islamic Sharīʿah, and its removing hardship from its people, is that it brings lightening whenever hardship happens, in many situations. Some we have already studied: wiping over the khuffs, tayammum, shortening and combining prayers, and the prayer of fear. On this same principle, many texts allow staying away from Jumuʿah and the congregation (even though both are obligatory and important) when certain excuses happen. The most important are:</div></div>

<div class="num-list"><ol>
<li data-n="1"><div class="li-ar">المرض إذا كان يشق معه الحضور إلى الجمعة والجماعة، ومثله خوف انتشار العدوى بالاجتماع.</div><div class="li-translit">Al-maraḍu idhā kāna yashuqqu maʿahu l-ḥuḍūru ila l-jumuʿati wa l-jamāʿah, wa mithluhu khawfu ntishāri l-ʿadwā bi-l-ijtimāʿ.</div><div class="li-en"><strong>Illness</strong>, if it makes attending Jumuʿah and the congregation hard. Similar to it is <strong>fear of spreading infection</strong> by gathering.</div></li>
<li data-n="2"><div class="li-ar">مدافعة البول أو الغائط؛ لما يترتّب على مدافعتهما من ذهاب الخشوع في الصلاة، ولما فيه من الضرر على البدن.</div><div class="li-translit">Mudāfaʿatu l-bawli awi l-ghāʾiṭ; li-mā yatarattabu ʿalā mudāfaʿatihimā min dhahābi l-khushūʿi fi ṣ-ṣalāh, wa li-mā fīhi mina ḍ-ḍarari ʿala l-badan.</div><div class="li-en"><strong>Holding back urine or stool</strong>, because holding them in takes away khushūʿ (focus) in prayer, and harms the body.</div></li>
<li data-n="3"><div class="li-ar">حضور الطعام والإنسان جائع جوعًا يمنعه من الخشوع في الصلاة أو كانت نفسه تتوق إلى الطعام، على ألا يُتَّخَذَ عادة أو حيلة للتخلّف عن صلاة الجماعة.</div><div class="li-translit">Ḥuḍūru ṭ-ṭaʿāmi wa l-insānu jāʾiʿun jūʿan yamnaʿuhu mina l-khushūʿi fi ṣ-ṣalāh, aw kānat nafsuhu tatūqu ila ṭ-ṭaʿām, ʿalā allā yuttakhadha ʿādatan aw ḥīlatan li-t-takhallufi ʿan ṣalāti l-jamāʿah.</div><div class="li-en"><strong>Food being served</strong> while the person is so hungry it would stop his khushūʿ, or he strongly longs for the food, on condition that this is <strong>not made a habit or a trick</strong> to skip the congregation.</div></li>
<li data-n="4"><div class="li-ar">الخوف المحقق على النفس أو المال أو غيرهما.</div><div class="li-translit">Al-khawfu l-muḥaqqaqu ʿala n-nafsi awi l-māli aw ghayrihimā.</div><div class="li-en"><strong>Real (confirmed) fear</strong> for one's life, wealth, or the like.</div></li>
</ol></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Look at excuse no. 2 and 3. Allah does not want you standing in front of Him while your mind is on the bathroom or your stomach. He wants your <strong>heart</strong> present. The Sharīʿah cares about your body and about your khushūʿ at the same time. Notice also the condition: "not a habit or a trick." Ease is a mercy, not a loophole. Ask yourself: do I use Allah's concessions honestly?</div></div>
`;}

function L7P5(){return `
<div class="sec"><div class="sec-ar">من أحكام صلاة الجماعة</div><div class="sec-translit">Min aḥkāmi ṣalāti l-jamāʿah</div><div class="sec-en">Some Rules of Congregational Prayer</div></div>

<div class="point"><div class="point-num">1</div><div class="point-ar">إذا جاء المسلم والإمام على أي حال فينبغي أن يكبّر ويتابعه في تلك الحال ولا ينتظره حتى يقوم.</div><div class="point-translit">Idhā jāʾa l-muslimu wa l-imāmu ʿalā ayyi ḥālin fa-yanbaghī an yukabbira wa yutābiʿahu fī tilka l-ḥāli wa lā yantaẓirahu ḥattā yaqūm.</div><div class="point-en">When a Muslim arrives and the imam is in <strong>any position</strong>, he should say the takbīr and follow him in that position, and <strong>not wait</strong> for him to stand up.</div></div>

<div class="point"><div class="point-num">2</div><div class="point-ar">من تخلّف عن صلاة الجماعة في المسجد لعذر فإنه يصليها جماعة إذا تيسّر له ذلك كمرافق المريض يصليها معه، أو مع أهل بيته.</div><div class="point-translit">Man takhallafa ʿan ṣalāti l-jamāʿati fi l-masjidi li-ʿudhrin fa-innahu yuṣallīhā jamāʿatan idhā tayassara lahu dhālika ka-murāfiqi l-marīḍi yuṣallīhā maʿah, aw maʿa ahli baytih.</div><div class="point-en">Whoever misses the congregation in the masjid because of an excuse should still pray it <strong>in congregation if possible</strong>, like a person accompanying a sick patient praying with him, or praying with his family at home.</div></div>

<div class="point"><div class="point-num">3</div><div class="point-ar">إذا دخل الرجل المسجد وقد صلى الناس، فالمشروع له أن يصلي جماعة إذا تيسر له ذلك.</div><div class="point-translit">Idhā dakhala r-rajulu l-masjida wa qad ṣalla n-nās, fa-l-mashrūʿu lahu an yuṣalliya jamāʿatan idhā tayassara lahu dhālik.</div><div class="point-en">If a man enters the masjid after the people have finished praying, what is prescribed for him is to pray <strong>in congregation</strong> (with another latecomer) if that is possible.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ The thread through all three rules</span><div class="study-note-body">Always look for the <strong>jamāʿah</strong>. Join the imam at once (rule 1). Make your own jamāʿah when you had an excuse (rule 2). Make a second jamāʿah when you arrive late (rule 3). Togetherness is the goal.</div></div>
`;}

function L7P6(){return `
<div class="assessment" id="as7p6">
<div class="section-badge">التَّقْوِيم · Assessment</div>
<p class="assessment-intro" style="margin-top:8px">Try each question before revealing.</p>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('as7p6'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('as7p6'))">Hide All</button></div>

<div class="q-item"><span class="q-num">1</span><div class="q-en">Upon whom is congregational prayer obligatory?</div><div class="q-ar">على من تجب صلاة الجماعة؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">It is obligatory in the masjid, for the five daily prayers, upon <strong>men</strong> who are <strong>residents</strong> (not travellers) and <strong>able</strong>.</div></div>

<div class="q-item"><span class="q-num">2</span><div class="q-en">Explain the ruling on congregational prayer in these cases: (a) a man who has a worker repairing things in his house; (b) a man who has a sick person he needs to take to hospital because his condition is serious; (c) a man who has a flight appointment and fears missing it.</div><div class="q-ar">بيّن حكم صلاة الجماعة في الحالات التالية:<br>● رجل عنده عامل يصلح له بعض الأعمال في منزله.<br>● رجل عنده مريض يحتاج أن يذهب به إلى المستشفى لخطورة حالته.<br>● رجل عنده موعد سفر بالطائرة وخشي أن يفوته.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>(a) Worker at home:</strong> not an excuse. The congregation stays <strong>obligatory</strong>; he goes to the masjid.<br><strong>(b) Serious patient:</strong> this is a valid excuse (real fear for a life). He may miss the masjid congregation, and he should pray in congregation when possible, e.g. with the patient or others accompanying him.<br><strong>(c) Flight he fears missing:</strong> if the fear of missing it is real, this falls under "real fear for one's wealth or the like," so it is an excuse. He prays in congregation where possible (e.g. at the airport).</div></div>

<div class="q-item"><span class="q-num">3</span><div class="q-en">How is the congregation caught? Give evidence for your answer.</div><div class="q-ar">بم تدرك الجماعة؟ دلل على ما تقول.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">By catching <strong>one rakʿah</strong> with the imam.<br><strong>Evidence:</strong> the Prophet ﷺ said: «من أدرك ركعة من الصلاة فقد أدرك الصلاة» "Whoever catches one rakʿah of the prayer has caught the prayer." (al-Bukhārī 580, Muslim 607)</div></div>

<div class="q-item"><span class="q-num">4</span><div class="q-en">Ṣāliḥ entered the masjid for ʿIshāʾ while the imam was in rukūʿ of the third rakʿah. Ṣāliḥ said the takbīr, then bowed after the imam had risen from his rukūʿ. How many rakʿahs did Ṣāliḥ catch, and why?</div><div class="q-ar">دخل صالح إلى المسجد لصلاة العشاء والإمام في الركوع للركعة الثالثة، فكبّر صالح ثم ركع بعد أن رفع الإمام من ركوعه، فكم أدرك صالح من ركعة؟ ولماذا؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">He caught <strong>one rakʿah only</strong> (the fourth). He did <strong>not</strong> catch the third, because a rakʿah is caught by <strong>catching the rukūʿ with the imam</strong>, and the imam had already risen before Ṣāliḥ bowed. After the imam's salām, he stands and makes up three rakʿahs. (He did catch the congregation, since he caught one rakʿah.)</div></div>
</div>
`;}

function L8P1(){return `
<div class="callout"><div class="callout-label">الْوَحْدَةُ الْخَامِسَةُ · Unit Five</div><div class="callout-ar">الوحدة الخامسة: صلاة المسافر<br>قال تعالى: ﴿وَإِذَا ضَرَبْتُمْ فِي الْأَرْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَقْصُرُوا مِنَ الصَّلَاةِ﴾</div><div class="callout-translit">Al-waḥdatu l-khāmisah: Ṣalātu l-musāfir. Qāla taʿālā: Wa idhā ḍarabtum fi l-arḍi fa-laysa ʿalaykum junāḥun an taqṣurū mina ṣ-ṣalāh.</div><div class="callout-en"><strong>Unit Five: The Prayer of the Traveller.</strong> Allah the Exalted said (meaning): <strong>"And when you travel through the land, there is no blame on you if you shorten the prayer."</strong><br><span style="font-size:.85em">سورة النساء: ١٠١ · Sūrat an-Nisāʾ 4:101</span></div></div>

<div class="sec"><div class="sec-ar">الدرس الثامن: صلاة المسافر</div><div class="sec-translit">Ad-darsu th-thāmin: Ṣalātu l-musāfir</div><div class="sec-en">Lesson 8: The Prayer of the Traveller</div></div>

<div class="body-text"><div class="bt-label">تمهيد · Introduction</div><div class="bt-ar">الإنسان في هذه الحياة بين إقامة وسفر، وقد شرع للمسلم المحافظة على الصلاة في جميع أحواله، وسنتعرف في هذا الدرس على الأحكام المتعلقة بصلاة المسافر.</div><div class="bt-translit">Al-insānu fī hādhihi l-ḥayāti bayna iqāmatin wa safar, wa qad shuriʿa li-l-muslimi l-muḥāfaẓatu ʿala ṣ-ṣalāti fī jamīʿi aḥwālih, wa sa-nataʿarrafu fī hādha d-darsi ʿala l-aḥkāmi l-mutaʿalliqati bi-ṣalāti l-musāfir.</div><div class="bt-en">In this life, a person is either <strong>staying home (iqāmah)</strong> or <strong>travelling (safar)</strong>. The Muslim has been commanded to guard the prayer in all his situations. In this lesson we will learn the rulings connected to the traveller's prayer.</div></div>

<div class="sec"><div class="sec-ar">صفة صلاة المسافر</div><div class="sec-translit">Ṣifatu ṣalāti l-musāfir</div><div class="sec-en">How the Traveller Prays</div></div>

<div class="body-text"><div class="bt-ar">يُسنُّ للمسافر قصر الصلاة الرباعية (الظهر والعصر والعشاء) فيصلّيها ركعتين؛ لقوله تعالى:</div><div class="bt-translit">Yusannu li-l-musāfiri qaṣru ṣ-ṣalāti r-rubāʿiyyah (aẓ-ẓuhri wa l-ʿaṣri wa l-ʿishāʾ) fa-yuṣallīhā rakʿatayn; li-qawlihi taʿālā:</div><div class="bt-en">It is <strong>sunnah</strong> for the traveller to <strong>shorten (qaṣr)</strong> the four-rakʿah prayers (Ẓuhr, ʿAṣr and ʿIshāʾ), praying them as <strong>two rakʿahs</strong>, because Allah the Exalted says:</div></div>

<div class="verse"><div class="v-ar">﴿وَإِذَا ضَرَبْتُمْ فِي الْأَرْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَقْصُرُوا مِنَ الصَّلَاةِ﴾</div><div class="v-translit">Wa idhā ḍarabtum fi l-arḍi fa-laysa ʿalaykum junāḥun an taqṣurū mina ṣ-ṣalāh.</div><div class="v-en">Meaning: <strong>"And when you travel through the land, there is no blame on you if you shorten the prayer."</strong></div><div class="v-ref">Sūrat an-Nisāʾ 4:101 · سورة النساء: ١٠١</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Anas on the journey to Makkah</div><div class="h-ar">وعن أنس بن مالك ﵁ قال: «خرجنا مع النبي ﷺ من المدينة إلى مكة، فكان يصلّي ركعتين ركعتين حتى رجعنا إلى المدينة».</div><div class="h-translit">Wa ʿan Anasi bni Mālikin qāl: «Kharajnā maʿa n-nabiyyi ﷺ mina l-Madīnati ilā Makkah, fa-kāna yuṣallī rakʿatayni rakʿatayn ḥattā rajaʿnā ila l-Madīnah».</div><div class="h-en">Anas ibn Mālik said: <strong>"We went out with the Prophet ﷺ from Madīnah to Makkah, and he prayed two rakʿahs, two rakʿahs, until we returned to Madīnah."</strong></div><div class="h-source">أخرجه البخاري برقم (١٠٨١)، ومسلم برقم (٦٩٣) · Narrated by al-Bukhārī, no. 1081, and Muslim, no. 693</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">قَصْر · qaṣr</div><div class="study-note-body">Root ق-ص-ر (q-ṣ-r) = <strong>to make short</strong>. <em>Qaṣīr</em> means "short" (a short person, a short time). <em>Qaṣr aṣ-ṣalāh</em> = shortening the prayer: 4 rakʿahs become 2. Fun fact: <em>qaṣr</em> also means "palace" in Arabic, but that is a different meaning. In fiqh, it always means shortening.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Only the four-rakʿah prayers!</span><div class="study-note-body">Only <strong>Ẓuhr, ʿAṣr and ʿIshāʾ</strong> are shortened. <strong>Fajr (2) and Maghrib (3) are never shortened.</strong> You will see this tested in Activity 2.</div></div>

<div class="sec"><div class="sec-ar">أحكام القصر</div><div class="sec-translit">Aḥkāmu l-qaṣr</div><div class="sec-en">Rules of Shortening</div></div>

<div class="num-list"><ol>
<li data-n="1"><div class="li-ar">المسافة التي إذا أراد المسافر قطعها جاز له قصر الصلاة هي ٨٠ كم تقريبًا.</div><div class="li-translit">Al-masāfatu llatī idhā arāda l-musāfiru qaṭʿahā jāza lahu qaṣru ṣ-ṣalāti hiya thamānūna kīlūmitran taqrīban.</div><div class="li-en">The distance which, if the traveller intends to cover it, allows him to shorten the prayer is <strong>about 80 km</strong>.</div></li>
<li data-n="2"><div class="li-ar">يجوز للمسافر القصر من حين خروجه من بلده، وذلك بمفارقته آخر بيوتها العامرة، ولا عبرة بالبيوت القديمة الخربة غير المسكونة، ولا المزارع والاستراحات التي خارج البلد.</div><div class="li-translit">Yajūzu li-l-musāfiri l-qaṣru min ḥīni khurūjihi min baladih, wa dhālika bi-mufāraqatihi ākhira buyūtiha l-ʿāmirah, wa lā ʿibrata bi-l-buyūti l-qadīmati l-kharibati ghayri l-maskūnah, wa la l-mazāriʿi wa l-istirāḥāti llatī khārija l-balad.</div><div class="li-en">The traveller may shorten <strong>from the moment he leaves his town</strong>, that is, once he passes the <strong>last inhabited houses</strong>. Old ruined, empty houses do not count, nor do farms and rest-houses outside the town.</div></li>
<li data-n="3"><div class="li-ar">للمسافر القصر في رجوعه حتى يدخل بلده الذي خرج منه.</div><div class="li-translit">Li-l-musāfiri l-qaṣru fī rujūʿihi ḥattā yadkhula baladahu lladhī kharaja minh.</div><div class="li-en">The traveller may shorten on his <strong>return journey</strong> until he enters the town he left from.</div></li>
<li data-n="4"><div class="li-ar">إذا كان المطار خارج البلد جاز للمسافر أن يترخص فيه بالقصر والجمع في ذهابه ورجوعه.</div><div class="li-translit">Idhā kāna l-maṭāru khārija l-baladi jāza li-l-musāfiri an yatarakhkhaṣa fīhi bi-l-qaṣri wa l-jamʿi fī dhahābihi wa rujūʿih.</div><div class="li-en">If the <strong>airport is outside the town</strong>, the traveller may use the concessions of shortening and combining there, both going and returning.</div></li>
<li data-n="5"><div class="li-ar">إذا وصل المسافر بلدًا وأراد الإقامة فيه، فله ثلاثة أحوال:</div><div class="li-translit">Idhā waṣala l-musāfiru baladan wa arāda l-iqāmata fīh, fa-lahu thalāthatu aḥwāl:</div><div class="li-en">If the traveller arrives in a town and wants to stay there, he has <strong>three cases</strong> (next tab).</div></li>
</ol></div>
<div class="h-source">وقال بعض العلماء: إن ضابط السفر هو العرف في طول المسافة ومدة الإقامة، فما يسميه الناس سفرًا فهو سفر. · Some scholars said: the measure of travel is custom (ʿurf), in the length of the distance and the duration of the stay. Whatever people call travel is travel.</div>

<div class="study-note beginner"><span class="study-note-label">💡 When does the journey "start"?</span><div class="study-note-body">Not when you pack your bags, and not when you sit in the car at home. Your travel rulings start when you <strong>drive past the last lived-in houses</strong> of your town. And they continue until you come back inside your town.</div></div>
`;}

function L8P2(){return `
<div class="sec"><div class="sec-ar">إذا وصل المسافر بلدًا وأراد الإقامة فيه</div><div class="sec-translit">Idhā waṣala l-musāfiru baladan wa arāda l-iqāmata fīh</div><div class="sec-en">When the Traveller Arrives Somewhere and Stays: Three Cases</div></div>

<div class="compare-grid">
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">أ</div><div class="ch-translit">Case A · more than 4 days</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">أن ينوي الإقامة أكثر من أربعة أيام، فيجب عليه إتمام الصلاة من أول يوم استقر فيه، ولا يترخص برخص السفر.</span></li>
<li><em>An yanwiya l-iqāmata akthara min arbaʿati ayyām, fa-yajibu ʿalayhi itmāmu ṣ-ṣalāti min awwali yawmin istaqarra fīh, wa lā yatarakhkhaṣu bi-rukhaṣi s-safar.</em></li>
<li>He intends to stay <strong>more than four days</strong>: he must <strong>pray in full</strong> from the first day he settles there, and does not use the travel concessions.</li>
</ul></div></div>
<div class="compare-card"><div class="compare-card-head gold"><div class="ch-ar">ب</div><div class="ch-translit">Case B · four days or less</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">أن ينوي الإقامة أربعة أيام فأقل، فيجوز له القصر والترخص برخص السفر جميع المدة.</span></li>
<li><em>An yanwiya l-iqāmata arbaʿata ayyāmin fa-aqall, fa-yajūzu lahu l-qaṣru wa t-tarakhkhuṣu bi-rukhaṣi s-safari jamīʿa l-muddah.</em></li>
<li>He intends to stay <strong>four days or less</strong>: he may <strong>shorten</strong> and use the travel concessions for the whole period.</li>
</ul></div></div>
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">ج</div><div class="ch-translit">Case C · no fixed stay</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">ألا ينوي إقامة محددة، بل قد يبقى يومًا أو عشرة أيام حسب مناسبة المكان له، أو لديه غرض من علاج أو مراجعة للدوائر الحكومية وغيرها متى انتهى غرضه رجع إلى بلده، فهذا يجوز له القصر والترخص برخص السفر حتى يرجع، ولو زادت مدة بقائه على أربعة أيام.</span></li>
<li><em>Allā yanwiya iqāmatan muḥaddadah, bal qad yabqā yawman aw ʿasharata ayyāmin ḥasba munāsabati l-makāni lah, aw ladayhi gharaḍun min ʿilājin aw murājaʿatin li-d-dawāʾiri l-ḥukūmiyyati wa ghayrihā matā ntahā gharaḍuhu rajaʿa ilā baladih, fa-hādhā yajūzu lahu l-qaṣru wa t-tarakhkhuṣu bi-rukhaṣi s-safari ḥattā yarjiʿ, wa law zādat muddatu baqāʾihi ʿalā arbaʿati ayyām.</em></li>
<li>He has <strong>no fixed length of stay</strong>: he may stay one day or ten depending on how the place suits him, or he has a purpose (medical treatment, government paperwork, etc.) and will go home as soon as it is done. He may shorten and use the concessions <strong>until he returns</strong>, even if his stay goes beyond four days.</li>
</ul></div></div>
</div>

<div class="study-note remember"><span class="study-note-label">⭐ The key is the intention (niyyah)</span><div class="study-note-body">Ask: "How long do I <strong>plan</strong> to stay?"<br>• Planned more than 4 days → <strong>pray full</strong> from day one.<br>• Planned 4 days or less → <strong>shorten</strong>.<br>• No plan, "I'll leave when my work is done" → <strong>shorten</strong> until you go home, however long it takes.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Case A vs Case C</span><div class="study-note-body">Students often mix these. In Case C, the person truly does <strong>not know</strong> when he will finish. If you know from the start that it will be more than four days (even without knowing the exact number), that is Case A: pray in full.</div></div>
`;}

function L8P3(){return `
<div class="sec"><div class="sec-ar">المسافر والمقيم في صلاة الجماعة</div><div class="sec-translit">Al-musāfiru wa l-muqīmu fī ṣalāti l-jamāʿah</div><div class="sec-en">Traveller and Resident Praying Together</div></div>

<div class="num-list"><ol>

function L8P4(){return `
<div class="sec"><div class="sec-ar">صلاة المسافر على مركوبه</div><div class="sec-translit">Ṣalātu l-musāfiri ʿalā markūbih</div><div class="sec-en">The Traveller Praying on His Vehicle</div></div>

<div class="body-text"><div class="bt-ar">صلاة المسافر على مركوبه قسمان:</div><div class="bt-translit">Ṣalātu l-musāfiri ʿalā markūbihi qismān:</div><div class="bt-en">The traveller's prayer on his means of transport is of <strong>two kinds</strong>:</div></div>

<div class="body-text"><div class="bt-label">القسم الأول · Kind One</div><div class="bt-ar">القسم الأول: أن تكون الصلاة فريضة، فلا تخلو من حالين:</div><div class="bt-translit">Al-qismu l-awwal: an takūna ṣ-ṣalātu farīḍah, fa-lā takhlū min ḥālayn:</div><div class="bt-en"><strong>Kind one:</strong> the prayer is <strong>obligatory (farīḍah)</strong>. It has two situations:</div></div>

<div class="compare-grid">
<div class="compare-card"><div class="compare-card-head gold"><div class="ch-ar">الحال الأولى</div><div class="ch-translit">Al-ḥālu l-ūlā · Situation 1</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">أن يتمكن من فعل الصلاة على المركوب كما يجب، فيمكنه الاستقبال والقيام والركوع والسجود، فالصلاة على المركوب في هذه الحالة صحيحة بعذر ودون عذر، وذلك كالصلاة في السفينة.</span></li>
<li><em>An yatamakkana min fiʿli ṣ-ṣalāti ʿala l-markūbi kamā yajib, fa-yumkinuhu l-istiqbālu wa l-qiyāmu wa r-rukūʿu wa s-sujūd, fa-ṣ-ṣalātu ʿala l-markūbi fī hādhihi l-ḥālati ṣaḥīḥatun bi-ʿudhrin wa dūna ʿudhr, wa dhālika ka-ṣ-ṣalāti fi s-safīnah.</em></li>
<li>He <strong>can</strong> pray on the vehicle properly: facing the qiblah, standing, bowing and prostrating. Then the prayer on the vehicle is <strong>valid, with or without an excuse</strong>, like praying on a ship.</li>
<li><span dir="rtl" lang="ar">مثّل بأمثلة أخرى:</span> <em>Maththil bi-amthilatin ukhrā</em> · Give other examples.</li>
</ul></div></div>
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">الحال الثانية</div><div class="ch-translit">Al-ḥālu th-thāniyah · Situation 2</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">ألا يتمكن من فعل الصلاة على المركوب كما يجب، فله حالتان:</span></li>
<li><em>Allā yatamakkana min fiʿli ṣ-ṣalāti ʿala l-markūbi kamā yajib, fa-lahu ḥālatān:</em></li>
<li>He <strong>cannot</strong> pray on the vehicle properly. Then there are two cases:</li>
<li><strong>١</strong> <span dir="rtl" lang="ar">أن يتمكن من النزول والصلاة على الأرض، وذلك كالمسافر بالسيارة، فيجب عليه النزول، ويصلِّي الصلاة على الوجه الكامل.</span><br><em>An yatamakkana mina n-nuzūli wa ṣ-ṣalāti ʿala l-arḍ, wa dhālika ka-l-musāfiri bi-s-sayyārah, fa-yajibu ʿalayhi n-nuzūl, wa yuṣalli ṣ-ṣalāta ʿala l-wajhi l-kāmil.</em><br>He <strong>can get down</strong> and pray on the ground, like someone travelling by car: he <strong>must get down</strong> and pray the prayer completely.</li>
<li><strong>٢</strong> <span dir="rtl" lang="ar">ألا يتمكن من النزول والصلاة على الأرض، وذلك كالمسافر بالطائرة إذا لم يكن بها محل للصلاة، أو كان مسافرًا بالسيارة ونحوها، ولا يمكنه النزول خوفًا من مطر أو عدو أو غيرهما، فإن كانت الصلاة تجمع مع غيرها فيؤخرها مع الصلاة الأخرى ليؤديها على الهيئة الكاملة، وإن كانت صلاة الفجر التي ينتهي وقتها بسرعة أو خشي انتهاء وقت الصلاة المجموعة فإنه يصلي حسب استطاعته، ويومئ بالركوع والسجود.</span><br><em>Allā yatamakkana mina n-nuzūli wa ṣ-ṣalāti ʿala l-arḍ, wa dhālika ka-l-musāfiri bi-ṭ-ṭāʾirati idhā lam yakun bihā maḥallun li-ṣ-ṣalāh, aw kāna musāfiran bi-s-sayyārati wa naḥwihā, wa lā yumkinuhu n-nuzūlu khawfan min maṭarin aw ʿaduwwin aw ghayrihimā. Fa-in kānati ṣ-ṣalātu tujmaʿu maʿa ghayrihā fa-yuʾakhkhiruhā maʿa ṣ-ṣalāti l-ukhrā li-yuʾaddiyahā ʿala l-hayʾati l-kāmilah, wa in kānat ṣalāta l-fajri llatī yantahī waqtuhā bi-surʿatin aw khashiya ntihāʾa waqti ṣ-ṣalāti l-majmūʿati fa-innahu yuṣallī ḥasba stiṭāʿatih, wa yūmiʾu bi-r-rukūʿi wa s-sujūd.</em><br>He <strong>cannot get down</strong>, like someone on a plane with no prayer area, or travelling by car and unable to stop for fear of rain, an enemy, etc. If the prayer can be <strong>combined</strong> with another, he <strong>delays it</strong> to pray both in full form later. If it is Fajr, whose time ends quickly, or he fears the time of the combined prayer will run out, he <strong>prays as best he can</strong>, making gestures (<em>īmāʾ</em>) for bowing and prostration.</li>
</ul></div></div>
</div>

<div class="activity" id="act8p4">
<div class="section-badge">نَشَاط · Activity</div>
<div class="act-item"><div class="act-prompt"><div class="act-ar">مثّل بأمثلة أخرى:</div><div class="act-translit">Maththil bi-amthilatin ukhrā.</div>Give other examples (of a vehicle where you can pray properly, like a ship).</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">1. A <strong>train</strong> that has a prayer area where you can stand, face the qiblah, bow and prostrate.<br>2. A <strong>large aeroplane</strong> with a dedicated prayer space.<br>(Also: a ferry with a prayer room.)</div></div>
</div>

<div class="body-text"><div class="bt-label">القسم الثاني · Kind Two</div><div class="bt-ar">القسم الثاني: أن تكون الصلاة نافلة، فتصح على المركوب مطلقًا بعذر أو بغير عذر، مستقبلًا للكعبة أو غير مستقبل لها، لما ثبت من حديث عبدالله بن عمر ﵄ «أن النبي ﷺ كان يصلّي النافلة في السفر على راحلته أينما توجهت»؛ لكن الأفضل أن يستفتح الصلاة متجهًا إلى القبلة.</div><div class="bt-translit">Al-qismu th-thānī: an takūna ṣ-ṣalātu nāfilah, fa-taṣiḥḥu ʿala l-markūbi muṭlaqan bi-ʿudhrin aw bi-ghayri ʿudhr, mustaqbilan li-l-Kaʿbati aw ghayra mustaqbilin lahā, li-mā thabata min ḥadīthi ʿAbdi-llāhi bni ʿUmar «anna n-nabiyya ﷺ kāna yuṣalli n-nāfilata fi s-safari ʿalā rāḥilatihi aynamā tawajjahat»; lākini l-afḍalu an yastaftiḥa ṣ-ṣalāta muttajihan ila l-qiblah.</div><div class="bt-en"><strong>Kind two:</strong> the prayer is <strong>voluntary (nāfilah)</strong>. It is valid on the vehicle <strong>in all cases</strong>, with or without an excuse, facing the Kaʿbah or not, because of what is established in the ḥadīth of ʿAbdullāh ibn ʿUmar: <strong>"The Prophet ﷺ used to pray voluntary prayers while travelling on his mount, whichever direction it faced."</strong> But it is better to <strong>begin</strong> the prayer facing the qiblah.</div></div>
<div class="h-source">انظر صحيح البخاري برقم (١٠٩٣، ١٠٩٤)، ومسلم برقم (٧٠٠) · See Ṣaḥīḥ al-Bukhārī, nos. 1093, 1094, and Muslim, no. 700</div>

<div class="study-note remember"><span class="study-note-label">⭐ Farḍ vs nafl on a vehicle</span><div class="study-note-body"><strong>Farḍ:</strong> needs the full form (qiblah, standing, rukūʿ, sujūd). If you can't do that, get down; if you can't get down, delay and combine; if even that is impossible, pray as best you can.<br><strong>Nafl:</strong> pray on the vehicle in any direction. Try to start facing the qiblah.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Even on a plane, stuck in a seat, the prayer does not fall away. You pray with gestures, as best you can. This shows two things together: the prayer is so precious that it is never dropped, and Allah is so merciful that He never asks you for more than you can do. Next time you fly, think of the Prophet ﷺ on his camel, praying nafl wherever it walked. Your journey can be full of worship too.</div></div>
`;}

function L8P5(){return `
<div class="sec"><div class="sec-ar">الجمع بين الصلاتين</div><div class="sec-translit">Al-jamʿu bayna ṣ-ṣalātayn</div><div class="sec-en">Combining Two Prayers</div></div>

<div class="defbox"><div class="defbox-tag">📌 Definition</div><div class="defbox-body"><div class="defbox-ar">الجمع بين الصلاتين يراد به الجمع بين الظهر والعصر في وقت إحداهما، والجمع بين المغرب والعشاء في وقت إحداهما.</div><div class="defbox-translit">Al-jamʿu bayna ṣ-ṣalātayni yurādu bihi l-jamʿu bayna ẓ-ẓuhri wa l-ʿaṣri fī waqti iḥdāhumā, wa l-jamʿu bayna l-maghribi wa l-ʿishāʾi fī waqti iḥdāhumā.</div><div class="defbox-en">Combining two prayers means praying <strong>Ẓuhr and ʿAṣr</strong> together in the time of one of them, and <strong>Maghrib and ʿIshāʾ</strong> together in the time of one of them.</div></div></div>

<div class="body-text"><div class="bt-ar">والجمع نوعان: جمع تقديم، وجمع تأخير، وهو رخصة فيجوز عند الحاجة إليه، ومن الحالات التي يجوز فيها الجمع ما يلي:</div><div class="bt-translit">Wa l-jamʿu nawʿān: jamʿu taqdīm, wa jamʿu taʾkhīr, wa huwa rukhṣatun fa-yajūzu ʿinda l-ḥājati ilayh, wa mina l-ḥālāti llatī yajūzu fīha l-jamʿu mā yalī:</div><div class="bt-en">Combining is of <strong>two types</strong>: <strong>jamʿ taqdīm</strong> (bringing the later prayer forward into the earlier one's time) and <strong>jamʿ taʾkhīr</strong> (delaying the earlier prayer into the later one's time). It is a <strong>concession (rukhṣah)</strong>, so it is allowed when there is a need. Among the cases where combining is allowed:</div></div>

<div class="num-list"><ol>
<li data-n="1"><div class="li-ar">السفر، فيجوز للمسافر الجمع مطلقًا، والأفضل له ترك الجمع إذا استقر في موضع وقتًا يتسع لأداء كل صلاة في وقتها، كما فعل النبي ﷺ في منى حيث كان يقصر الصلاة ولا يجمع.</div><div class="li-translit">As-safar, fa-yajūzu li-l-musāfiri l-jamʿu muṭlaqā, wa l-afḍalu lahu tarku l-jamʿi idha staqarra fī mawḍiʿin waqtan yattasiʿu li-adāʾi kulli ṣalātin fī waqtihā, kamā faʿala n-nabiyyu ﷺ fī Minā ḥaythu kāna yaqṣuru ṣ-ṣalāta wa lā yajmaʿ.</div><div class="li-en"><strong>Travel:</strong> the traveller may combine in general. But it is <strong>better not to combine</strong> if he has settled in a place long enough to pray each prayer in its own time, as the Prophet ﷺ did in <strong>Minā</strong>, where he shortened the prayers but did not combine them.</div></li>
<li data-n="2"><div class="li-ar">المرض الذي يشقُّ معه فعلُ كلِّ صلاة في وقتها.</div><div class="li-translit">Al-maraḍu lladhī yashuqqu maʿahu fiʿlu kulli ṣalātin fī waqtihā.</div><div class="li-en"><strong>Illness</strong> that makes praying each prayer in its own time difficult.</div></li>
<li data-n="3"><div class="li-ar">المطر الذي تحصل به مشقة على الناس في الحضور إلى المسجد وقت الصلاة الأخرى، أما من صلى في بيته وقت المطر فلا يجمع لأجله.</div><div class="li-translit">Al-maṭaru lladhī taḥṣulu bihi mashaqqatun ʿala n-nāsi fi l-ḥuḍūri ila l-masjidi waqta ṣ-ṣalāti l-ukhrā, ammā man ṣallā fī baytihi waqta l-maṭari fa-lā yajmaʿu li-ajlih.</div><div class="li-en"><strong>Rain</strong> that makes it hard for people to come back to the masjid at the time of the next prayer. But whoever prays <strong>at home</strong> during rain does <strong>not</strong> combine because of it.</div></li>
</ol></div>

<div class="study-note beginner"><span class="study-note-label">💡 Shortening and combining are different!</span><div class="study-note-body"><strong>Qaṣr</strong> = fewer rakʿahs (4 → 2). Only for the <strong>traveller</strong>.<br><strong>Jamʿ</strong> = two prayers at one time (rakʿahs stay the same). For the traveller, the sick, and in heavy rain.<br>So a resident who combines because of rain still prays ʿIshāʾ as <strong>four</strong> rakʿahs.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">تَقْدِيم / تَأْخِير · taqdīm / taʾkhīr</div><div class="study-note-body"><strong>Taqdīm</strong> from ق-د-م = to bring forward (<em>qadīm</em> = old, earlier). <strong>Taʾkhīr</strong> from أ-خ-ر = to put back, delay (<em>ākhir</em> = last). Jamʿ taqdīm: ʿAṣr prayed early, in Ẓuhr's time. Jamʿ taʾkhīr: Ẓuhr prayed late, in ʿAṣr's time.</div></div>

<div class="sec"><div class="sec-ar">حكم جمع العصر إلى الجمعة</div><div class="sec-translit">Ḥukmu jamʿi l-ʿaṣri ila l-jumuʿah</div><div class="sec-en">Combining ʿAṣr With Jumuʿah</div></div>

<div class="body-text"><div class="bt-ar">صلاة الجمعة صلاة مستقلة لا تجمع إليها صلاة العصر؛ لعدم الدليل على جواز الجمع في مثل هذه الحالة، فلا يجوز جمع العصر إليها في الحضر لمطر وغيره، ولا في السفر إذا صلّاها جمعة مع الناس في البلد الذي هو فيه، أما إذا صلّاها ظهرًا فيجوز جمع العصر إليها.</div><div class="bt-translit">Ṣalātu l-jumuʿati ṣalātun mustaqillah lā tujmaʿu ilayhā ṣalātu l-ʿaṣr; li-ʿadami d-dalīli ʿalā jawāzi l-jamʿi fī mithli hādhihi l-ḥālah, fa-lā yajūzu jamʿu l-ʿaṣri ilayhā fi l-ḥaḍari li-maṭarin wa ghayrih, wa lā fi s-safari idhā ṣallāhā jumuʿatan maʿa n-nāsi fi l-baladi lladhī huwa fīh, ammā idhā ṣallāhā ẓuhran fa-yajūzu jamʿu l-ʿaṣri ilayhā.</div><div class="bt-en">Jumuʿah is a <strong>separate, independent prayer</strong>; ʿAṣr is <strong>not combined</strong> with it, because there is no evidence allowing combining in this case. So ʿAṣr may not be combined with it at home (for rain or anything else), nor while travelling if he prayed it as Jumuʿah with the people in the town he is in. But if he prayed it as <strong>Ẓuhr</strong>, he may combine ʿAṣr with it.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Jumuʿah ≠ Ẓuhr for combining</span><div class="study-note-body">Even though Jumuʿah is at Ẓuhr time, it is a different prayer. Never combine ʿAṣr with Jumuʿah. A traveller who prays Ẓuhr (not Jumuʿah) may combine ʿAṣr with that Ẓuhr.</div></div>
`;}

<div class="sec"><div class="sec-ar">الدرس التاسع: أحكام صلاة الجمعة</div><div class="sec-translit">Ad-darsu t-tāsiʿ: aḥkāmu ṣalāti l-jumuʿah</div><div class="sec-en">Lesson Nine: The Rulings of the Friday Prayer</div></div>

<div class="body-text"><div class="bt-label">تمهيد · Introduction</div><div class="bt-ar">يوم الجمعة هو أفضل أيام الأسبوع، خص الله به هذه الأمة، وقد جاء في فضله أحاديث كثيرة منها قوله ﷺ:</div><div class="bt-translit">Yawmu l-jumuʿati huwa afḍalu ayyāmi l-usbūʿ, khaṣṣa llāhu bihi hādhihi l-ummah, wa qad jāʾa fī faḍlihi aḥādīthu kathīratun minhā qawluhu ṣallā llāhu ʿalayhi wa sallam:</div><div class="bt-en">Friday is the <strong>best day of the week</strong>. Allah singled out this ummah with it. Many ḥadīths have come about its virtue, among them the saying of the Prophet ﷺ:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — The best day</div><div class="h-ar">«خَيْرُ يومٍ طلعت عليه الشمس يومُ الجمعة، فيه خُلق آدم، وفيه أُدخل الجنة، وفيه أُخرج منها»</div><div class="h-translit">Khayru yawmin ṭalaʿat ʿalayhi sh-shamsu yawmu l-jumuʿah, fīhi khuliqa Ādam, wa fīhi udkhila l-jannah, wa fīhi ukhrija minhā.</div><div class="h-en"><strong>"The best day on which the sun has risen is Friday. On it Ādam was created, on it he was admitted into Paradise, and on it he was taken out of it."</strong></div><div class="h-source">أخرجه مسلم برقم (٨٥٤) · Narrated by Muslim, no. 854</div></div>

<div class="sec"><div class="sec-ar">حكم صلاة الجمعة</div><div class="sec-translit">Ḥukmu ṣalāti l-jumuʿah</div><div class="sec-en">The Ruling on the Friday Prayer</div></div>

<div class="defbox"><div class="defbox-tag">📌 Ruling</div><div class="defbox-body"><div class="defbox-ar">صلاة الجمعة فرض عين على كل مسلم ذكرٍ بالغٍ عاقلٍ مستوطنٍ لا عذرَ له.</div><div class="defbox-translit">Ṣalātu l-jumuʿati farḍu ʿaynin ʿalā kulli muslimin dhakarin bālighin ʿāqilin mustawṭinin lā ʿudhra lah.</div><div class="defbox-en">The Friday prayer is a <strong>personal obligation (farḍ ʿayn)</strong> on every Muslim who is: <strong>male</strong>, <strong>adult</strong>, <strong>sane</strong>, a <strong>settled resident</strong>, and has <strong>no valid excuse</strong>.</div></div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What does "farḍ ʿayn" mean — and what about me as a woman?</span><div class="study-note-body"><strong>Farḍ ʿayn</strong> means an obligation on <em>each person himself</em>, like the five daily prayers. Nobody else can do it for him.<br><br>Look at the list: <em>male</em> is one of the conditions. So Jumuʿah is <strong>not obligatory on women</strong>. On Friday a woman prays Ẓuhr at home as normal. If she does attend Jumuʿah at the masjid and prays it with the imam, it counts for her instead of Ẓuhr.</div></div>

<div class="body-text"><div class="bt-label">الأدلة · The evidence</div><div class="bt-ar">ويدل على ذلك:</div><div class="bt-translit">Wa yadullu ʿalā dhālik:</div><div class="bt-en">The evidence for this:</div></div>

<div class="verse"><div class="v-ar">١ ـ قول الله تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ۚ ذَٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ﴾</div><div class="v-translit">1 – Qawlu llāhi taʿālā: Yā ayyuha lladhīna āmanū idhā nūdiya li-ṣ-ṣalāti min yawmi l-jumuʿati fa-sʿaw ilā dhikri llāhi wa dharu l-bayʿ. Dhālikum khayrun lakum in kuntum taʿlamūn.</div><div class="v-en">1 – The saying of Allah the Exalted (meaning): <strong>"O you who believe! When the call is made for the prayer on Friday, hurry to the remembrance of Allah and leave off trading. That is better for you, if only you knew."</strong></div><div class="v-ref">سورة الجمعة: ٩ · Sūrat al-Jumuʿah 62:9</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 How does this verse prove it is obligatory?</span><div class="study-note-body">Allah gives a <strong>command</strong>: "hurry (<em>fa-sʿaw</em>)". And He tells us to <strong>leave trading</strong>, which is normally allowed. You only stop something allowed for something that is required. So the verse shows Jumuʿah is a duty, not an extra.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — 2: A warning for those who leave it</div><div class="h-ar">٢ ـ عن عبدالله بن عمر وأبي هريرة ﵄ أن رسول الله ﷺ قال: «لَيَنْتَهِيَنَّ أقوامٌ عن وَدْعِهِمُ الجُمُعات أو لَيَختمنَّ الله على قلوبهم، ثم ليكونُنَّ من الغافلين»</div><div class="h-translit">2 – ʿAn ʿAbdi llāhi bni ʿUmara wa Abī Hurayrata raḍiya llāhu ʿanhumā anna rasūla llāhi ṣallā llāhu ʿalayhi wa sallama qāl: La-yantahiyanna aqwāmun ʿan wadʿihimu l-jumuʿāti aw la-yakhtimanna llāhu ʿalā qulūbihim, thumma la-yakūnunna mina l-ghāfilīn.</div><div class="h-en">From ʿAbdullāh ibn ʿUmar and Abū Hurayrah (may Allah be pleased with them both) that the Messenger of Allah ﷺ said: <strong>"People must stop abandoning the Friday prayers, or else Allah will seal their hearts, and then they will surely be among the heedless."</strong></div><div class="h-source">أخرجه مسلم برقم (٨٦٥) · Narrated by Muslim, no. 865<br>وَدْعِهِمُ: تركهم · <em>wadʿihim</em> = their leaving / abandoning</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ A serious warning</span><div class="study-note-body">A "sealed heart" means a heart that no longer feels reminders or is moved by good. The Prophet ﷺ only warns this strongly about something important. For a man, skipping Jumuʿah with no excuse is not a small matter.</div></div>
`;}

<div class="sec"><div class="sec-ar">شروط صحة صلاة الجمعة</div><div class="sec-translit">Shurūṭu ṣiḥḥati ṣalāti l-jumuʿah</div><div class="sec-en">Conditions for the Friday Prayer to Be Valid</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">الوقت، ووقتها كوقت صلاة الظهر، ولا تصح بعد خروج وقتها.</div><div class="li-translit">Al-waqt, wa waqtuhā ka-waqti ṣalāti ẓ-ẓuhr, wa lā taṣiḥḥu baʿda khurūji waqtihā.</div><div class="li-en"><strong>The time.</strong> Its time is like the time of Ẓuhr. It is not valid after its time has ended.</div></li>
<li data-n="2"><div class="li-ar">أن يحضر الخطبة والصلاةَ جماعةٌ تنعقد بعددهم الجمعة.</div><div class="li-translit">An yaḥḍura l-khuṭbata wa ṣ-ṣalāta jamāʿatun tanʿaqidu bi-ʿadadihimu l-jumuʿah.</div><div class="li-en"><strong>A group must attend</strong> the khuṭbah and the prayer — a number large enough for Jumuʿah to be established.</div></li>
<li data-n="3"><div class="li-ar">أن يكون المصلّون مستوطنين بمساكن مبنية بما جرت العادة بالبناء به، سواء أكان ذلك من الأسمنت المسلّح، أم من الحجارة، أم من الطين وغيرها. وعليه فلا تصح من أهل البوادي أصحاب الخيام وبيوت الشعر الذين لا يسكنون مكانًا ثابتًا، بل يتنقلون ويتتبعون العشب لمواشيهم.</div><div class="li-translit">An yakūna l-muṣallūna mustawṭinīna bi-masākina mabniyyatin bimā jarati l-ʿādatu bi-l-bināʾi bih, sawāʾun a-kāna dhālika mina l-asmanti l-musallaḥ, am mina l-ḥijārah, am mina ṭ-ṭīni wa ghayrihā. Wa ʿalayhi fa-lā taṣiḥḥu min ahli l-bawādī aṣḥābi l-khiyāmi wa buyūti sh-shaʿri lladhīna lā yaskunūna makānan thābitā, bal yatanaqqalūna wa yatatabbaʿūna l-ʿushba li-mawāshīhim.</div><div class="li-en"><strong>The worshippers must be settled residents</strong> living in buildings made of what people normally build with — reinforced concrete, stone, mud or other materials. So it is not valid from desert nomads who live in tents and hair-tents and have no fixed place, but keep moving, following the grass for their livestock.</div></li>

</ol>

<div class="study-note remember"><span class="study-note-label">⭐ Memory hook: T-G-H-K</span><div class="study-note-body"><strong>T</strong>ime (like Ẓuhr) · <strong>G</strong>roup (enough people) · <strong>H</strong>omes (settled residents) · <strong>K</strong>huṭbahs (two, before the prayer).<br>If any one is missing, the Jumuʿah is not valid and Ẓuhr is prayed instead.</div></div>

<div class="sec"><div class="sec-ar">صفة صلاة الجمعة</div><div class="sec-translit">Ṣifatu ṣalāti l-jumuʿah</div><div class="sec-en">How the Friday Prayer Is Performed</div></div>

<div class="body-text"><div class="bt-ar">صلاة الجمعة ركعتان يجهر فيهما بالقراءة، ويُسنُّ أن يقرأ في الركعة الأولى ـ بعد الفاتحة ـ سورة الجمعة، وفي الثانية ـ بعد الفاتحة ـ سورة المنافقون، أو يقرأ في الأولى سورة الأعلى وفي الثانية سورة الغاشية، أو سورة الجمعة وسورة الغاشية، فهذه ثلاثة أنواع كلها ثابتة عن رسول الله ﷺ.</div><div class="bt-translit">Ṣalātu l-jumuʿati rakʿatāni yujharu fīhimā bi-l-qirāʾah, wa yusannu an yaqraʾa fi r-rakʿati l-ūlā — baʿda l-fātiḥah — sūrata l-jumuʿah, wa fi th-thāniyah — baʿda l-fātiḥah — sūrata l-munāfiqūn, aw yaqraʾa fi l-ūlā sūrata l-aʿlā wa fi th-thāniyati sūrata l-ghāshiyah, aw sūrata l-jumuʿati wa sūrata l-ghāshiyah, fa-hādhihi thalāthatu anwāʿin kulluhā thābitatun ʿan rasūli llāhi ṣallā llāhu ʿalayhi wa sallam.</div><div class="bt-en">The Friday prayer is <strong>two rakʿahs</strong> with the recitation <strong>aloud</strong>. It is sunnah to recite, after al-Fātiḥah:<br>• Option 1: <strong>al-Jumuʿah</strong> in the 1st rakʿah and <strong>al-Munāfiqūn</strong> in the 2nd; or<br>• Option 2: <strong>al-Aʿlā</strong> in the 1st and <strong>al-Ghāshiyah</strong> in the 2nd; or<br>• Option 3: <strong>al-Jumuʿah</strong> and <strong>al-Ghāshiyah</strong>.<br>All three are authentically reported from the Messenger of Allah ﷺ.</div><div class="h-source">انظر صحيح مسلم برقم (٨٧٧–٨٧٩) · See Ṣaḥīḥ Muslim, nos. 877–879</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Two rakʿahs instead of four?</span><div class="study-note-body">Jumuʿah <strong>replaces Ẓuhr</strong> on Friday for those who attend it. Ẓuhr is four rakʿahs, read silently. Jumuʿah is two rakʿahs, read aloud, and it comes after two khuṭbahs. You do not pray Ẓuhr as well after a valid Jumuʿah.</div></div>

<div class="act-item"><div class="act-ar">من خلال ما سبق دراسته في دخول الوقت من درس شروط الصلاة، أُبيّن وقت صلاة الجمعة.</div><div class="act-translit">Min khilāli mā sabaqa dirāsatuhu fī dukhūli l-waqti min darsi shurūṭi ṣ-ṣalāh, ubayyinu waqta ṣalāti l-jumuʿah.</div><div class="act-prompt">Using what I studied before about the prayer time (in the lesson on the conditions of prayer), I explain the time of the Friday prayer.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">The time of Jumuʿah is <strong>like the time of Ẓuhr</strong>: it starts at <strong>zawāl</strong> (when the sun passes its highest point and begins to move west) and lasts until the shadow of a thing becomes <strong>equal to its own length</strong> (beyond the small shadow it had at zawāl). After that, the time of ʿAṣr begins and Jumuʿah can no longer be prayed — Ẓuhr is prayed instead.</div></div>

`;}
