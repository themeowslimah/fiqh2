<div class="sec"><div class="sec-ar">خطبتا الجمعة</div><div class="sec-translit">Khuṭbatā l-jumuʿah</div><div class="sec-en">The Two Friday Sermons</div></div>

<div class="body-text"><div class="bt-ar">لخُطبتي الجمعة أهمية ومكانة بارزة في الإسلام؛ لما تشتملان عليه من القرآن والحديث، والتوجيه النافع، والموعظة الحسنة والتذكير، والأمر بالمعروف والنهي عن المنكر، مع حضور ذلك الجمع الكبير، مما يكون له أكبر الأثر في توجيه المجتمع ونصحه وتذكيره على هذا المستوى في كل أسبوع.</div><div class="bt-translit">Li-khuṭbatayi l-jumuʿati ahammiyyatun wa makānatun bārizatun fi l-islām; limā tashtamilāni ʿalayhi mina l-qurʾāni wa l-ḥadīth, wa t-tawjīhi n-nāfiʿ, wa l-mawʿiẓati l-ḥasanati wa t-tadhkīr, wa l-amri bi-l-maʿrūfi wa n-nahyi ʿani l-munkar, maʿa ḥuḍūri dhālika l-jamʿi l-kabīr, mimmā yakūnu lahu akbaru l-athari fī tawjīhi l-mujtamaʿi wa nuṣḥihi wa tadhkīrihi ʿalā hādha l-mustawā fī kulli usbūʿ.</div><div class="bt-en">The two Friday khuṭbahs have great importance and a prominent place in Islam, because they contain <strong>Qur'an and ḥadīth</strong>, <strong>useful guidance</strong>, <strong>good admonition and reminders</strong>, and <strong>enjoining good and forbidding evil</strong> — all with that large gathering present. This has the greatest effect in guiding, advising and reminding the community at this level <strong>every single week</strong>.</div></div>

<div class="defbox"><div class="defbox-tag gold">⚖️ Ruling</div><div class="defbox-body"><div class="defbox-ar">حكم الخُطْبتين: الخطبتان واجبتان، وهما شرط لصحة الجمعة.</div><div class="defbox-translit">Ḥukmu l-khuṭbatayn: al-khuṭbatāni wājibatān, wa humā sharṭun li-ṣiḥḥati l-jumuʿah.</div><div class="defbox-en">Ruling of the two khuṭbahs: they are <strong>obligatory (wājib)</strong>, and they are a <strong>condition (sharṭ)</strong> for the Jumuʿah to be valid.</div></div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">خُطْبَة · khuṭbah</div><div class="study-note-body">Root خ-ط-ب (kh-ṭ-b): <strong>to address, to speak to someone</strong>. <em>Khuṭbah</em> = a sermon/address; <em>khaṭīb</em> = the one giving it; <em>yakhṭub</em> = he is giving the khuṭbah. Careful: <em>khiṭbah</em> (with i) from the same root means a marriage proposal — also "addressing" someone!</div></div>

<div class="compare-grid">
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">أركانهما</div><div class="ch-translit">Arkānuhumā · Their pillars (4)</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">١ ـ حمد الله والشهادتان</span><br><em>Ḥamdu llāhi wa sh-shahādatān</em><br>Praising Allah, and the two testimonies of faith.</li>
<li><span dir="rtl" lang="ar">٢ ـ الصلاة على رسول الله ﷺ</span><br><em>Aṣ-ṣalātu ʿalā rasūli llāh ﷺ</em><br>Sending ṣalāh (blessings) on the Messenger of Allah ﷺ.</li>
<li><span dir="rtl" lang="ar">٣ ـ الموعظة، ومنها الوصية بتقوى الله تعالى</span><br><em>Al-mawʿiẓah, wa minha l-waṣiyyatu bi-taqwa llāhi taʿālā</em><br>Admonition — including advising people to have taqwā (mindful fear) of Allah the Exalted.</li>
<li><span dir="rtl" lang="ar">٤ ـ قراءة شيء من القرآن</span><br><em>Qirāʾatu shayʾin mina l-qurʾān</em><br>Reciting something from the Qur'an.</li>
</ul></div></div>
<div class="compare-card"><div class="compare-card-head gold"><div class="ch-ar">مستحباتهما</div><div class="ch-translit">Mustaḥabbātuhumā · Their recommended acts (5)</div></div><div class="compare-card-body"><ul>
<li><span dir="rtl" lang="ar">١ ـ الخُطبة على منبر</span><br><em>Al-khuṭbatu ʿalā minbar</em><br>Giving the khuṭbah on a minbar (pulpit).</li>
<li><span dir="rtl" lang="ar">٢ ـ الفصل بين الخُطبتين بجلسة خفيفة</span><br><em>Al-faṣlu bayna l-khuṭbatayni bi-jalsatin khafīfah</em><br>Separating the two khuṭbahs with a short sitting.</li>
<li><span dir="rtl" lang="ar">٣ ـ الدعاء فيهما للمسلمين وولي الأمر</span><br><em>Ad-duʿāʾu fīhimā li-l-muslimīna wa waliyyi l-amr</em><br>Making duʿāʾ in them for the Muslims and for the ruler.</li>
<li><span dir="rtl" lang="ar">٤ ـ تقصيرهما</span><br><em>Taqṣīruhumā</em><br>Keeping them short.</li>
<li><span dir="rtl" lang="ar">٥ ـ سلام الخطيب على الناس عند صعوده</span><br><em>Salāmu l-khaṭībi ʿala n-nāsi ʿinda ṣuʿūdih</em><br>The khaṭīb greeting the people with salām when he goes up (the minbar).</li>
</ul></div></div>
</div>

<div class="study-note remember"><span class="study-note-label">⭐ Pillar vs. recommended</span><div class="study-note-body"><strong>Rukn (pillar)</strong> = must be there. If a pillar is missing, the khuṭbah is not complete. The four: <em>praise of Allah & shahādah · ṣalāh on the Prophet ﷺ · advice to taqwā · some Qur'an</em>.<br><strong>Mustaḥabb (recommended)</strong> = rewarded if done, no sin if left: minbar, short sitting, duʿāʾ, keeping it short, salām.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why "keep them short"?</span><div class="study-note-body">A short, focused khuṭbah is easier to remember and act on. People of all kinds are there — the old, the sick, workers on a break. The sunnah is a clear message that sticks, not a long lecture.</div></div>
`;}

function L9P4(){return `
<div class="sec"><div class="sec-ar">مستحبات يوم الجمعة</div><div class="sec-translit">Mustaḥabbātu yawmi l-jumuʿah</div><div class="sec-en">Recommended Acts of Friday</div></div>

<div class="body-text"><div class="bt-ar">من خلال الأحاديث التالية أَستنبطُ بعض المستحبات للجمعة ويومها:</div><div class="bt-translit">Min khilāli l-aḥādīthi t-tāliyati astanbiṭu baʿḍa l-mustaḥabbāti li-l-jumuʿati wa yawmihā:</div><div class="bt-en">From the following ḥadīths, I work out some of the recommended acts for the Friday prayer and its day. (In the book this is a table: <strong>المستحبات</strong> "recommended acts" | <strong>الدليل</strong> "the evidence".)</div></div>

<div class="hadith"><div class="hadith-label">الدليل ١ · Evidence 1</div><div class="h-ar">عن أبي سعيد ﵁ أن رسول الله ﷺ قال: «الغسل يوم الجمعة واجب على كل محتلم، وأن يَسْتَنَّ، وأن يمسَّ طيبًا إن وجد»</div><div class="h-translit">ʿAn Abī Saʿīdin raḍiya llāhu ʿanhu anna rasūla llāhi ṣallā llāhu ʿalayhi wa sallama qāl: Al-ghuslu yawma l-jumuʿati wājibun ʿalā kulli muḥtalim, wa an yastanna, wa an yamassa ṭīban in wajad.</div><div class="h-en">From Abū Saʿīd (may Allah be pleased with him) that the Messenger of Allah ﷺ said: <strong>"Ghusl on Friday is a duty on everyone who has reached puberty, and (also) that he cleans his teeth (with siwāk), and that he puts on perfume if he finds any."</strong></div><div class="h-source">أخرجه البخاري برقم (٨٥٨) ومسلم برقم (٨٤٦). ومعنى يستن: أي يدلك أسنانه بالسواك · Narrated by al-Bukhārī, no. 858, and Muslim, no. 846. <em>Yastann</em> means: he rubs his teeth with the siwāk.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ "Wājib" here — does skipping ghusl cancel the prayer?</span><div class="study-note-body">No. The book lists Friday ghusl under the <strong>recommended acts</strong>. Many scholars understand "wājib" in this ḥadīth as "strongly emphasised". So if someone comes with only wuḍūʾ, his prayer is <strong>valid</strong>, but he has missed a great sunnah. (This comes up in the assessment!)</div></div>

<div class="hadith"><div class="hadith-label">الدليل ٢ · Evidence 2</div><div class="h-ar">عن أوس بن أوس الثقفي ﵁ قال: سمعت رسول الله ﷺ يقول: «من غسَّل يوم الجمعة واغتسل، ثم بكَّر وابتكر، ومشى ولم يركب، ودنا من الإمام فاستمع ولم يلغُ، كان له بكل خطوة عمل سنة أجر صيامها وقيامها»</div><div class="h-translit">ʿAn Awsi bni Awsini th-Thaqafiyyi raḍiya llāhu ʿanhu qāl: samiʿtu rasūla llāhi ṣallā llāhu ʿalayhi wa sallama yaqūl: Man ghassala yawma l-jumuʿati wa ghtasal, thumma bakkara wa btakar, wa mashā wa lam yarkab, wa danā mina l-imāmi fa-stamaʿa wa lam yalghu, kāna lahu bi-kulli khuṭwatin ʿamalu sanatin ajru ṣiyāmihā wa qiyāmihā.</div><div class="h-en">From Aws ibn Aws ath-Thaqafī (may Allah be pleased with him): I heard the Messenger of Allah ﷺ say: <strong>"Whoever washes thoroughly on Friday and bathes, then sets out early and arrives early, walks and does not ride, sits close to the imam, listens and does not engage in idle talk — for every step he will have the deeds of a whole year: the reward of its fasting and its night prayer."</strong></div><div class="h-source">أخرجه أبو داود برقم (٣٤٥)، وصححه الحاكم برقم (١٠٤٢) · Narrated by Abū Dāwūd, no. 345; al-Ḥākim graded it authentic, no. 1042</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Every step = a year!</span><div class="study-note-body">Count the conditions in this one ḥadīth: <strong>ghusl · go early · walk · sit near the imam · listen · no idle talk</strong>. Do them all, and <em>each step</em> to the masjid carries the reward of a year of fasting and night prayer. Few deeds have a reward this huge.</div></div>

<div class="hadith"><div class="hadith-label">الدليل ٣ · Evidence 3</div><div class="h-ar">عن أبي هريرة ﵁ أن رسول الله ﷺ ذكر يوم الجمعة فقال: «فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلّي يسأل الله تعالى شيئًا إلا أعطاه إياه» وأشار بيده يقلّلها.</div><div class="h-translit">ʿAn Abī Hurayrata raḍiya llāhu ʿanhu anna rasūla llāhi ṣallā llāhu ʿalayhi wa sallama dhakara yawma l-jumuʿati fa-qāl: Fīhi sāʿatun lā yuwāfiquhā ʿabdun muslimun wa huwa qāʾimun yuṣallī yasʾalu llāha taʿālā shayʾan illā aʿṭāhu iyyāh. Wa ashāra bi-yadihi yuqallilu-hā.</div><div class="h-en">From Abū Hurayrah (may Allah be pleased with him) that the Messenger of Allah ﷺ mentioned Friday and said: <strong>"In it there is an hour: no Muslim servant happens upon it while standing in prayer, asking Allah the Exalted for something, except that He gives it to him."</strong> And he gestured with his hand to show how short it is.</div><div class="h-source">أخرجه البخاري برقم (٩٣٥)، ومسلم برقم (٨٥٢) · Narrated by al-Bukhārī, no. 935, and Muslim, no. 852</div></div>

<div class="hadith"><div class="hadith-label">الدليل ٤ · Evidence 4</div><div class="h-ar">عن أبي سعيد الخدري ﵄ أن النبي ﷺ قال: «إن مَنْ قرأ سورة الكهف يوم الجمعة أضاء له من النور ما بين الجمعتين»</div><div class="h-translit">ʿAn Abī Saʿīdini l-Khudriyyi raḍiya llāhu ʿanhumā anna n-nabiyya ṣallā llāhu ʿalayhi wa sallama qāl: Inna man qaraʾa sūrata l-kahfi yawma l-jumuʿati aḍāʾa lahu mina n-nūri mā bayna l-jumuʿatayn.</div><div class="h-en">From Abū Saʿīd al-Khudrī (may Allah be pleased with him and his father) that the Prophet ﷺ said: <strong>"Whoever reads Sūrat al-Kahf on Friday, light will shine for him (lasting) between the two Fridays."</strong></div><div class="h-source">أخرجه الحاكم برقم (٣٣٩٢) · Narrated by al-Ḥākim, no. 3392</div></div>

<div class="hadith"><div class="hadith-label">الدليل ٥ · Evidence 5</div><div class="h-ar">عن أوس بن أوس ﵁ أن النبي ﷺ قال: «إن من أفضل أيامكم يوم الجمعة فيه خلق آدم، وفيه قُبض، وفيه النفخة، وفيه الصعقة، فأكثروا عليّ من الصلاة فيه، فإن صلاتكم معروضة عليّ»</div><div class="h-translit">ʿAn Awsi bni Awsin raḍiya llāhu ʿanhu anna n-nabiyya ṣallā llāhu ʿalayhi wa sallama qāl: Inna min afḍali ayyāmikum yawma l-jumuʿah, fīhi khuliqa Ādam, wa fīhi qubiḍ, wa fīhi n-nafkhah, wa fīhi ṣ-ṣaʿqah, fa-aktirū ʿalayya mina ṣ-ṣalāti fīh, fa-inna ṣalātakum maʿrūḍatun ʿalayy.</div><div class="h-en">From Aws ibn Aws (may Allah be pleased with him) that the Prophet ﷺ said: <strong>"Among the best of your days is Friday. On it Ādam was created, on it he died, on it will be the Blowing (of the Trumpet), and on it the Swoon (when all creatures fall unconscious). So send much ṣalāh upon me on it, for your ṣalāh is presented to me."</strong></div><div class="h-source">أخرجه أبو داود برقم (١٠٤٧)، والنسائي برقم (١٣٧٤)، وأحمد برقم (٤/٨)، وابن حبان (٩١٠)، وابن خزيمة برقم (٣/١١٨)، وصححه الحاكم برقم (١٠٢٩) · Narrated by Abū Dāwūd, no. 1047; an-Nasāʾī, no. 1374; Aḥmad (4/8); Ibn Ḥibbān (910); Ibn Khuzaymah (3/118); al-Ḥākim graded it authentic, no. 1029</div></div>

<div class="activity" id="act9p4">
<div class="section-badge">نَشَاط · Activity</div>
<div class="act-item"><div class="act-ar">أَستنبطُ بعض المستحبات للجمعة ويومها (أملأ عمود المستحبات).</div><div class="act-translit">Astanbiṭu baʿḍa l-mustaḥabbāti li-l-jumuʿati wa yawmihā.</div><div class="act-prompt">Fill in the "recommended acts" column for each piece of evidence.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box"><table class="styled-table"><thead><tr><th><span dir="rtl" lang="ar">الدليل</span> · Evidence</th><th><span dir="rtl" lang="ar">المستحبات</span> · Recommended acts</th></tr></thead><tbody>
<tr><td>1 — Abū Saʿīd: ghusl, siwāk, perfume</td><td><span dir="rtl" lang="ar">الاغتسال، والتسوك، والتطيب</span><br>Taking a ghusl · cleaning the teeth with siwāk · wearing perfume</td></tr>
<tr><td>2 — Aws ath-Thaqafī: every step = a year</td><td><span dir="rtl" lang="ar">التبكير، والمشي، والدنو من الإمام، والاستماع وترك اللغو</span><br>Going early · walking (not riding) · sitting near the imam · listening and not speaking idly</td></tr>
<tr><td>3 — Abū Hurayrah: the hour of answer</td><td><span dir="rtl" lang="ar">الإكثار من الدعاء رجاء ساعة الإجابة</span><br>Making lots of duʿāʾ, hoping to catch the hour of answer</td></tr>
<tr><td>4 — Abū Saʿīd al-Khudrī: light between two Fridays</td><td><span dir="rtl" lang="ar">قراءة سورة الكهف</span><br>Reading Sūrat al-Kahf</td></tr>
<tr><td>5 — Aws ibn Aws: ṣalāh is presented to me</td><td><span dir="rtl" lang="ar">الإكثار من الصلاة على النبي ﷺ</span><br>Sending much ṣalāh (blessings) on the Prophet ﷺ</td></tr>
</tbody></table></div></div>
</div>

<div class="sec"><div class="sec-ar">ما يُنهى عنه من حضر الجمعة</div><div class="sec-translit">Mā yunhā ʿanhu man ḥaḍara l-jumuʿah</div><div class="sec-en">What Is Forbidden for Someone Attending Jumuʿah</div></div>

<div class="point"><div class="point-num">1</div><div class="point-ar">يحرمُ الكلام والإمام يخطب يوم الجمعة، فعن أبي هريرة ﵁ أن النبي ﷺ قال: «إذا قلت لصاحبك يوم الجمعة: أنصت ـ والإمام يخطب ـ فقد لغوت»، أي قلت اللغو، واللغو: الإثم.</div><div class="point-translit">Yaḥrumu l-kalāmu wa l-imāmu yakhṭubu yawma l-jumuʿah, fa-ʿan Abī Hurayrata raḍiya llāhu ʿanhu anna n-nabiyya ṣallā llāhu ʿalayhi wa sallama qāl: Idhā qulta li-ṣāḥibika yawma l-jumuʿati: anṣit — wa l-imāmu yakhṭub — fa-qad laghawt. Ay qulta l-laghw, wa l-laghw: al-ithm.</div><div class="point-en"><strong>Talking while the imam is giving the Friday khuṭbah is forbidden (ḥarām).</strong> Abū Hurayrah (may Allah be pleased with him) reported that the Prophet ﷺ said: <strong>"If you say to your companion on Friday, 'Be quiet!' while the imam is giving the khuṭbah, you have engaged in idle talk (laghw)."</strong> That is, you have spoken <em>laghw</em> — and <em>laghw</em> here means sin.</div></div>
<div class="h-source">أخرجه البخاري برقم (٩٣٤)، ومسلم برقم (٨٥١) · Narrated by al-Bukhārī, no. 934, and Muslim, no. 851</div>

<div class="study-note beginner"><span class="study-note-label">💡 Even "shh!" counts?</span><div class="study-note-body">Yes! Telling someone to be quiet is a <em>good</em> thing normally — yet during the khuṭbah even that is <em>laghw</em>. So chatting, joking or scrolling is even more serious. If someone is talking, you can signal with your hand, without words.</div></div>

<div class="point"><div class="point-num">2</div><div class="point-ar">يكره تخطّي رقابِ الناس، إلا إذا كان إمامًا، أو التخطيَ إلى فُرجة لا يصل إليها إلا بذلك.</div><div class="point-translit">Yukrahu takhaṭṭī riqābi n-nās, illā idhā kāna imāmā, awi t-takhaṭṭiya ilā furjatin lā yaṣilu ilayhā illā bi-dhālik.</div><div class="point-en"><strong>Stepping over people's necks (shoulders) is disliked (makrūh)</strong> — except for the imam, or stepping over to reach an empty gap that cannot be reached any other way.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Two levels — don't mix them up</span><div class="study-note-body"><strong>Talking during the khuṭbah</strong> → <em>yaḥrum</em> = <strong>ḥarām</strong> (forbidden).<br><strong>Stepping over people</strong> → <em>yukrah</em> = <strong>makrūh</strong> (disliked), with two exceptions.<br>Tip: arrive early and you will never need to step over anyone!</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Look at how many of Friday's sunnahs are about <strong>other people</strong>: smelling nice, clean teeth, not stepping over shoulders, not disturbing others with talk. Worship in Islam is never only "me and Allah"; it shapes how we treat the person sitting next to us. And then the gift of the hidden <em>hour</em>: Allah keeps it hidden so that we keep turning to Him all day. <em>What would I ask for if I knew this was the hour?</em></div></div>
`;}

function L9P5(){return `
<div class="sec"><div class="sec-ar">إدراك الجمعة</div><div class="sec-translit">Idrāku l-jumuʿah</div><div class="sec-en">Catching the Friday Prayer</div></div>

<div class="body-text"><div class="bt-ar">من أدرك الركوع مع الإمام في الركعة الثانية من صلاة الجمعة فقد أدرك الجمعة، ويتمّها ركعتين، وإن لم يدرك الركوع من الركعة الثانية فقد فاتته الجمعة ويتمّها ظُهرًا، وكذا من فاتته الجمعة لنوم أو غيره فإنه يصلّيها ظُهرًا.</div><div class="bt-translit">Man adraka r-rukūʿa maʿa l-imāmi fi r-rakʿati th-thāniyati min ṣalāti l-jumuʿati fa-qad adraka l-jumuʿah, wa yutimmuhā rakʿatayn, wa in lam yudriki r-rukūʿa mina r-rakʿati th-thāniyati fa-qad fātathu l-jumuʿatu wa yutimmuhā ẓuhrā, wa kadhā man fātathu l-jumuʿatu li-nawmin aw ghayrihi fa-innahu yuṣallīhā ẓuhrā.</div><div class="bt-en">Whoever catches the <strong>rukūʿ with the imam in the second rakʿah</strong> of Jumuʿah has caught the Jumuʿah, and completes it as <strong>two rakʿahs</strong>. If he does not catch the rukūʿ of the second rakʿah, he has missed Jumuʿah and completes it as <strong>Ẓuhr</strong> (four rakʿahs). Likewise, whoever misses Jumuʿah because of sleep or anything else prays it as <strong>Ẓuhr</strong>.</div></div>

<table class="styled-table"><thead><tr><th>When you join the imam…</th><th>What you do</th></tr></thead><tbody>
<tr><td>Before or in the <strong>rukūʿ of the 2nd rakʿah</strong></td><td>You caught Jumuʿah → add <strong>1 rakʿah</strong> after the imam's salām (total 2).</td></tr>
<tr><td><strong>After</strong> the rukūʿ of the 2nd rakʿah (sujūd, last tashahhud)</td><td>You missed Jumuʿah → join with the intention of Ẓuhr and complete <strong>4 rakʿahs</strong>.</td></tr>
<tr><td>Missed it completely (slept, etc.)</td><td>Pray <strong>Ẓuhr — 4 rakʿahs</strong>. Jumuʿah is not made up as Jumuʿah.</td></tr>
</tbody></table>

<div class="study-note watch-out"><span class="study-note-label">⚠️ The rukūʿ is the key</span><div class="study-note-body">A common mistake: arriving at the last tashahhud and then praying only two rakʿahs, thinking "I caught Jumuʿah". You didn't! The cut-off is the <strong>rukūʿ of the second rakʿah</strong>. Miss it, and you pray four.</div></div>

<tr><td><span dir="rtl" lang="ar">أسباب التأخر</span><br>Reasons for being late</td><td>1. Staying up late on Thursday night and sleeping in.<br>2. Being busy with work, shopping or trade.<br>3. Laziness and not knowing the great reward of going early.</td></tr>

<tr><td><span dir="rtl" lang="ar">الأمور المعينة</span><br>Helps</td><td>1. Preparing clean clothes, perfume and siwāk the night before.<br>2. Taking the ghusl early and setting off early.<br>3. Going together with family or good friends who encourage each other.</td></tr>

<div class="activity" id="act9p5b">
<div class="section-badge">نَشَاط · Activity 3</div>
<div class="act-item"><div class="act-ar">بالرجوع إلى مصادر التعلم، تعرّف على ساعة الإجابة، واكتب ملخصًا لما عرفته.</div><div class="act-translit">Bi-r-rujūʿi ilā maṣādiri t-taʿallum, taʿarraf ʿalā sāʿati l-ijābah, wa ktub mulakhkhaṣan limā ʿaraftah.</div><div class="act-prompt">Using learning resources, find out about the "hour of answer" (on Friday) and write a summary of what you learned.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box"><strong>Model summary:</strong><br>• On Friday there is a <strong>short hour</strong> in which duʿāʾ is answered (ḥadīth of Abū Hurayrah, al-Bukhārī 935, Muslim 852 — Evidence 3 on p. 235).<br>• Scholars have different opinions about when it is. The two best-known:<br>&nbsp;&nbsp;1. From when the imam <strong>sits on the minbar until the prayer is finished</strong> (ḥadīth of Abū Mūsā in Muslim, no. 853).<br>&nbsp;&nbsp;2. The <strong>last hour of Friday, after ʿAṣr</strong>, before sunset (reported in Abū Dāwūd and others).<br>• Allah kept its exact time hidden so that the believer stays busy with duʿāʾ the whole day, especially in these two times.</div></div>
</div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">If someone sleeps through Jumuʿah, the book simply says: pray Ẓuhr. No panic, no "it's all lost". Allah's law is gentle and practical. But the ḥadīth of the sealed heart (p. 232) is about <em>habitually</em> leaving it. Mercy for the slip; seriousness about the habit. <em>Where else in my life do I need that same balance — gentle with my slips, serious about my habits?</em></div></div>
`;}

<div class="q-item"><span class="q-num">1</span><div class="q-en">Explain the ruling in the following cases, giving the reason:<br>• A congregation in a masjid whose khaṭīb was late, so they prayed Jumuʿah without a khuṭbah.<br>• A person who caught the imam in the last tashahhud of the Friday prayer, and completed the Friday prayer as two rakʿahs.<br>• A person who went to the Friday prayer with wuḍūʾ but without a ghusl.</div><div class="q-ar">بيّن الحكم في الحالات الآتية مع ذكر السبب:<br>• جماعة في مسجد تأخر عليهم الخطيب، فصلّوا الجمعة بغير خطبة.<br>• شخص أدرك الإمام في التشهد الأخير من صلاة الجمعة، وأتم صلاة الجمعة ركعتين.<br>• شخص ذهب لصلاة الجمعة متوضئًا من غير اغتسال..</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>a) Jumuʿah without a khuṭbah → not valid.</strong> Reason: the two khuṭbahs are a <strong>condition</strong> for the validity of Jumuʿah. They must repeat it: if the time remains, give the khuṭbah and pray Jumuʿah; otherwise pray Ẓuhr (4 rakʿahs).<br><br><strong>b) Prayed two rakʿahs → not correct.</strong> Reason: he did not catch the <strong>rukūʿ of the second rakʿah</strong>, so he missed Jumuʿah. He must complete it as <strong>Ẓuhr — four rakʿahs</strong>.<br><br><strong>c) Wuḍūʾ without ghusl → prayer is valid.</strong> Reason: ghusl on Friday is among the <strong>recommended acts</strong>, not a condition. But he missed a great sunnah and its reward.</div></div>

<div class="q-item"><span class="q-num">2</span><div class="q-en">Identify the correct action: Saʿd entered the masjid on Friday while the imam was giving the khuṭbah:<br>• He sits down straight away where the rows end.<br>• He looks for a place in the front rows, squeezes in between two people, prays the greeting prayer and sits.<br>• He goes to where the rows end, prays taḥiyyat al-masjid (the greeting prayer of the masjid), then sits.</div><div class="q-ar">حدد التصرف الصحيح فيما يلي:<br>دخل سعد المسجد يوم الجمعة والإمام يخطب:<br>• يجلس مباشرة حيث انتهت الصفوف.<br>• يبحث عن مكان في الصفوف المتقدمة، ويوسع بين اثنين ويصلّي التحية ويجلس.<br>• يأتي إلى حيث انتهت الصفوف ويصلّي تحية المسجد، ثم يجلس.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>The correct action is the third:</strong> he goes to where the rows end, prays <strong>taḥiyyat al-masjid</strong> (two short rakʿahs), then sits and listens.<br>• The 1st is wrong because he leaves the greeting prayer of the masjid (the Prophet ﷺ told a man who sat down during the khuṭbah to stand and pray two short rakʿahs — Muslim, no. 875).<br>• The 2nd is wrong because pushing forward and squeezing between people means <strong>stepping over necks</strong> and disturbing them, which is <strong>makrūh</strong>.</div></div>

<div class="callout"><div class="callout-label">الوحدة السابعة · Unit Seven</div><div class="callout-ar">الوحدة السابعة: صلاة العيدين</div><div class="callout-translit">Al-waḥdatu s-sābiʿah: Ṣalātu l-ʿĪdayn</div><div class="callout-en">Unit Seven: <strong>The Prayer of the Two ʿĪds</strong></div>
<div class="callout-ar">عن أنس ﵁ قال: قَدِم رسول اللَّه ﷺ المدينة ولهم يومان يلعبون فيهما، فقال: «ما هذان اليومان؟» قالوا: كنا نلعب فيهما في الجاهلية، فقال رسول اللَّه ﷺ: «إن اللَّه قد أبدلكم بهما خيرًا منهما، يوم الأضحى ويوم الفطر»</div><div class="callout-translit">ʿAn Anasin raḍiya-llāhu ʿanhu qāl: qadima rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallama l-madīnata wa lahum yawmāni yalʿabūna fīhimā, fa-qāl: «mā hādhāni l-yawmān?» Qālū: kunnā nalʿabu fīhimā fi l-jāhiliyyah. Fa-qāla rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallam: «inna-llāha qad abdalakum bihimā khayran minhumā: yawma l-aḍḥā wa yawma l-fiṭr».</div><div class="callout-en">Anas (may Allah be pleased with him) said: The Messenger of Allah ﷺ came to Madinah, and the people there had two days on which they used to play. He asked: <strong>"What are these two days?"</strong> They said: "We used to play on them in the Jāhiliyyah (the time before Islam)." So the Messenger of Allah ﷺ said: <strong>"Allah has replaced them for you with two days better than them: the Day of al-Aḍḥā and the Day of al-Fiṭr."</strong></div></div>
<div class="h-source">أخرجه أبو داود برقم (١١٣٤)، وصححه الحاكم برقم (١/٤٣٤) · Narrated by Abū Dāwūd, no. 1134; al-Ḥākim graded it authentic (1/434)</div>

<div class="study-note beginner"><span class="study-note-label">💡 What is this hadith teaching us?</span><div class="study-note-body">The people of Madinah already had two "fun days" from before Islam. The Prophet ﷺ did not just ban them and leave a gap. He told them Allah had given them <strong>something better</strong>: ʿĪd al-Fiṭr and ʿĪd al-Aḍḥā.<br><br>So in Islam, joy is not taken away. It is <em>upgraded</em>. Our celebrations are a gift chosen by Allah.</div></div>

<div class="activity" id="act10p1">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act10p1'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act10p1'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt"><strong>تمهيد · Warm-up:</strong> What does ʿĪd mean to you?</div><div class="act-ar">ماذا يعني لك العيد؟</div><div class="act-translit">Mādhā yaʿnī laka l-ʿīd?</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">There is no single right answer here, it is about you! A model answer: ʿĪd means <strong>joy after worship</strong> (after Ramaḍān or after the ḥajj days), thanking Allah, praying together, wearing my best clothes, visiting family and neighbours, and giving to people in need.</div></div>
</div>

<div class="sec"><div class="sec-ar">العيد عند المسلمين</div><div class="sec-translit">Al-ʿīdu ʿinda l-muslimīn</div><div class="sec-en">ʿĪd for Muslims</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">أعياد المسلمين أعياد ربانية شرعها اللَّه لهم ولم يشرعوها من عند أنفسهم، وليس لهم إلا عيدان فقط هما عيد الفطر والأضحى، وهما يأتيان بعد أداء الطاعات ليكونا بمثابة الجائزة والفرحة الجائزةُ لأن اللَّه سبحانه وتعالى بعد أن قَضَي العبادُ طاعتهم ناسب أن يجزيهم بالرحمة و المغفرة والعتق من النار، والفرحةُ بنعمة اللَّه علينا بإِكمال الطاعة وإتمامها، فيحصل في هذين العيدين: الفرح والسرور، وصلة الأرحام والجيران، والإِحسانُ إلى المحتاجين.</div><div class="bt-translit">Aʿyādu l-muslimīna aʿyādun rabbāniyyatun sharaʿahā-llāhu lahum wa lam yashraʿūhā min ʿindi anfusihim, wa laysa lahum illā ʿīdāni faqaṭ humā ʿīdu l-fiṭri wa l-aḍḥā, wa humā yaʾtiyāni baʿda adāʾi ṭ-ṭāʿāti li-yakūnā bi-mathābati l-jāʾizati wa l-farḥah. Al-jāʾizatu li-anna-llāha subḥānahu wa taʿālā baʿda an qaḍā l-ʿibādu ṭāʿatahum nāsaba an yajziyahum bi-r-raḥmati wa l-maghfirati wa l-ʿitqi mina n-nār, wa l-farḥatu bi-niʿmati-llāhi ʿalaynā bi-ikmāli ṭ-ṭāʿati wa itmāmihā, fa-yaḥṣulu fī hādhayni l-ʿīdayn: al-faraḥu wa s-surūr, wa ṣilatu l-arḥāmi wa l-jīrān, wa l-iḥsānu ila l-muḥtājīn.</div><div class="bt-en">The ʿĪds of the Muslims are <strong>divine celebrations</strong>: Allah legislated them for them; they did not invent them themselves. Muslims have <strong>only two ʿĪds</strong>: ʿĪd al-Fiṭr and ʿĪd al-Aḍḥā. Both come <strong>after acts of worship</strong> are completed, so they are like a <strong>prize</strong> and a <strong>joy</strong>.<br>• <strong>The prize:</strong> after the servants have completed their worship, it is fitting that Allah (glorified and exalted) rewards them with mercy, forgiveness and freedom from the Fire.<br>• <strong>The joy:</strong> happiness at Allah’s blessing on us in letting us complete the worship fully.<br>So in these two ʿĪds we find: joy and happiness, keeping ties with relatives and neighbours, and kindness to people in need.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Remember: ʿĪd = prize + joy</span><div class="study-note-body"><strong>ʿĪd al-Fiṭr</strong> comes after <em>fasting Ramaḍān</em>.<br><strong>ʿĪd al-Aḍḥā</strong> comes after the <em>days of ḥajj</em> (and the blessed ten days of Dhu l-Ḥijjah).<br><br>Key words: <strong>al-jāʾizah</strong> (الجائزة) = the prize · <strong>al-farḥah</strong> (الفرحة) = the joy.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Only two</span><div class="study-note-body">The text says clearly: <strong>"wa laysa lahum illā ʿīdāni faqaṭ"</strong>, Muslims have <em>only</em> two ʿĪds. They are set by Allah, not made up by people.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">عِيد · ʿīd</div><div class="study-note-body">From root ع-و-د (ʿ-w-d), meaning <strong>to return / come back</strong>. ʿĪd is a day of joy that <em>returns</em> every year. The same root gives <strong>ʿāda</strong> (عاد, "he returned") and <strong>ʿādah</strong> (عادة, "a habit", something you keep coming back to). Plural: <strong>aʿyād</strong> (أعياد). Dual: <strong>ʿīdān / ʿīdayn</strong> (عيدان / عيدين), "two ʿĪds".</div></div>

<div class="sec"><div class="sec-ar">مظاهر العيد</div><div class="sec-translit">Maẓāhiru l-ʿīd</div><div class="sec-en">Signs of ʿĪd</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">العيد في الإِسلام مظهر من مظاهر الفرح والسرور، وتناول الطيِّبات و المباحات، ولذلك ينبغي للمسلمين أن يظهروا الفرح والسرور في العيد، ويلبسوا فيه أحسن اللباس، ويَصِلُوا فيه الأقارب والأصدقاء.</div><div class="bt-translit">Al-ʿīdu fi l-islāmi maẓharun min maẓāhiri l-faraḥi wa s-surūr, wa tanāwuli ṭ-ṭayyibāti wa l-mubāḥāt, wa li-dhālika yanbaghī li-l-muslimīna an yuẓhirū l-faraḥa wa s-surūra fi l-ʿīd, wa yalbasū fīhi aḥsana l-libās, wa yaṣilū fīhi l-aqāriba wa l-aṣdiqāʾ.</div><div class="bt-en">ʿĪd in Islam is a time to show <strong>joy and happiness</strong> and to enjoy good, permitted things. So Muslims should <strong>show their joy</strong> on ʿĪd, <strong>wear their best clothes</strong>, and <strong>visit and keep ties</strong> with relatives and friends.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Notice the order: first the effort (a month of fasting, or the days of ḥajj), <em>then</em> the celebration. Allah could have asked us to worship without any reward day. Instead He gives us a day where being happy, dressing nicely, and eating good food are themselves part of His religion.<br><br>Sit with this: <em>Allah enjoys seeing His servants happy after they obey Him.</em> When you smile on ʿĪd, hug your family, or give to someone in need, you are not "taking a break" from your dīn. You are living it.</div></div>
`;}

function L10P2(){return `
<div class="sec"><div class="sec-ar">حكم صلاة العيدين</div><div class="sec-translit">Ḥukmu ṣalāti l-ʿīdayn</div><div class="sec-en">The Ruling on the ʿĪd Prayers</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">صلاة العيدين فرض كفاية، واظَبَ عليها النبي ﷺ ولم يُعلم أنه تركها حتى فارق الدنيا، صلوات اللَّه وسلامه عليه، وواظَبَ عليها الخلفاء الراشدون رضي الله عنهم بعد النبي ﷺ، وهي من أعلام الدين وشعائره الظاهرة، ولا ينبغي للمسلم التخلفُ عنها إلا لعذر يمنعه منها.</div><div class="bt-translit">Ṣalātu l-ʿīdayni farḍu kifāyah, wāẓaba ʿalayha n-nabiyyu ṣallā-llāhu ʿalayhi wa sallama wa lam yuʿlam annahu tarakahā ḥattā fāraqa d-dunyā, ṣalawātu-llāhi wa salāmuhu ʿalayh, wa wāẓaba ʿalayha l-khulafāʾu r-rāshidūna raḍiya-llāhu ʿanhum baʿda n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam, wa hiya min aʿlāmi d-dīni wa shaʿāʾirihi ẓ-ẓāhirah, wa lā yanbaghī li-l-muslimi t-takhallufu ʿanhā illā li-ʿudhrin yamnaʿuhu minhā.</div><div class="bt-en">The ʿĪd prayer is a <strong>farḍ kifāyah</strong> (a community obligation). The Prophet ﷺ kept doing it regularly, and it is not known that he ever left it until he passed away (may Allah’s blessings and peace be upon him). The Rightly-Guided Caliphs (may Allah be pleased with them) also kept doing it after him. It is one of the <strong>clear landmarks of the religion</strong> and its visible symbols. A Muslim should not stay away from it except for an excuse that stops him.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What does "farḍ kifāyah" mean?</span><div class="study-note-body"><strong>Farḍ ʿayn</strong> = an obligation on <em>every</em> person (like the five daily prayers).<br><strong>Farḍ kifāyah</strong> = an obligation on the <em>community</em>. If enough people do it, the duty is lifted from the rest. If nobody does it, everyone is sinful.<br><br>But look at the end of the text: even though it is a community duty, the book says a Muslim <strong>should not miss it</strong> without an excuse. The Prophet ﷺ never left it!</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">واظَبَ · wāẓaba</div><div class="study-note-body">"He kept doing it regularly / was consistent in it." From root و-ظ-ب (w-ẓ-b), to stick to something. Here it shows the Prophet ﷺ and the four Caliphs <strong>never dropped</strong> the ʿĪd prayer.</div></div>

<div class="sec"><div class="sec-ar">الحكمة من مشروعية صلاة العيدين</div><div class="sec-translit">Al-ḥikmatu min mashrūʿiyyati ṣalāti l-ʿīdayn</div><div class="sec-en">The Wisdom Behind the ʿĪd Prayers</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">صلاة العيدين مظهر من مظاهر شكر النعمة على إتمام الصيام والحج، فإن اللَّه منَّ على عباده بهاتين العبادتين، فناسب عند الانتهاء منهما أن يشكر المسلم ربه على إتمامهما والقيام بهما، فإن هذا فضل من اللَّه تفضل به على عبده.</div><div class="bt-translit">Ṣalātu l-ʿīdayni maẓharun min maẓāhiri shukri n-niʿmati ʿalā itmāmi ṣ-ṣiyāmi wa l-ḥajj, fa-inna-llāha manna ʿalā ʿibādihi bi-hātayni l-ʿibādatayn, fa-nāsaba ʿinda l-intihāʾi minhumā an yashkura l-muslimu rabbahu ʿalā itmāmihimā wa l-qiyāmi bihimā, fa-inna hādhā faḍlun mina-llāhi tafaḍḍala bihi ʿalā ʿabdih.</div><div class="bt-en">The ʿĪd prayer is a way of <strong>thanking Allah for the blessing</strong> of completing the <strong>fast</strong> and the <strong>ḥajj</strong>. Allah favoured His servants with these two acts of worship, so when they finish them, it is fitting that the Muslim thanks his Lord for letting him complete them and carry them out, because this is a <strong>favour from Allah</strong> that He gave to His servant.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">The text says something beautiful: even our ability to fast and do ḥajj is a <strong>favour from Allah</strong> (<em>faḍlun mina-llāh</em>). We often think "I did my worship." The book reminds us: <em>Allah let you do it.</em><br><br>So ʿĪd prayer is a "thank You" prayer. Ask yourself: what worship did Allah make easy for me this year that I should thank Him for?</div></div>

<div class="sec"><div class="sec-ar">وقت صلاة العيدين</div><div class="sec-translit">Waqtu ṣalāti l-ʿīdayn</div><div class="sec-en">The Time of the ʿĪd Prayers</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">يبدأ وقت صلاة العيد من ارتفاع الشمس قدر رمح أي: بعد ربع ساعة تقريبًا من طلوع الشمس، وينتهي وقتها عند زوال الشمس.</div><div class="bt-translit">Yabdaʾu waqtu ṣalāti l-ʿīdi mina rtifāʿi sh-shamsi qadra rumḥ, ay: baʿda rubʿi sāʿatin taqrīban min ṭulūʿi sh-shams, wa yantahī waqtuhā ʿinda zawāli sh-shams.</div><div class="bt-en">The time of the ʿĪd prayer <strong>begins</strong> when the sun has risen <strong>the height of a spear</strong>, that is, about <strong>a quarter of an hour after sunrise</strong>. Its time <strong>ends at zawāl</strong> (when the sun passes its highest point at midday).</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Time window</span><div class="study-note-body"><strong>Start:</strong> about 15 minutes after sunrise (qadra rumḥ, "a spear’s length").<br><strong>End:</strong> zawāl (just before Ẓuhr time comes in).<br><br>Memory hook: ʿĪd is a <em>morning</em> prayer: after the sun is up, before midday.</div></div>
`;}

function L10P3(){return `
<div class="sec"><div class="sec-ar">صفة صلاة العيدين</div><div class="sec-translit">Ṣifatu ṣalāti l-ʿīdayn</div><div class="sec-en">How the ʿĪd Prayer Is Performed</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">صلاة العيد ركعتان بلا أذان ولا إقامة، يجهر فيهما الإِمام بالقراءة، وصفتها كما يلي:</div><div class="bt-translit">Ṣalātu l-ʿīdi rakʿatāni bi-lā adhānin wa lā iqāmah, yajharu fīhima l-imāmu bi-l-qirāʾah, wa ṣifatuhā kamā yalī:</div><div class="bt-en">The ʿĪd prayer is <strong>two rakʿahs</strong>, with <strong>no adhān and no iqāmah</strong>. The imām <strong>recites aloud</strong> in both. It is done as follows:</div></div>

<div class="point"><span class="point-num">1a</span><div class="point-ar">يكبِّر في الركعة الأولى تكبيرة الإِحرام، ثم يقرأ دعاء الاستفتاح، ثم يكبِّر ست تكبيرات يرفع يديه مع كل تكبيرة، ويحمد اللَّه ويُثني عليه، ويصلِّي على النبي ﷺ بين التكبيرات، ثم يتعوَّذ ويبسمل ويشرع في القراءة.</div><div class="point-translit">Yukabbiru fi r-rakʿati l-ūlā takbīrata l-iḥrām, thumma yaqraʾu duʿāʾa l-istiftāḥ, thumma yukabbiru sitta takbīrātin yarfaʿu yadayhi maʿa kulli takbīrah, wa yaḥmadu-llāha wa yuthnī ʿalayh, wa yuṣallī ʿala n-nabiyyi ṣallā-llāhu ʿalayhi wa sallama bayna t-takbīrāt, thumma yataʿawwadhu wa yubasmilu wa yashraʿu fi l-qirāʾah.</div><div class="point-en"><strong>First rakʿah:</strong> he says takbīrat al-iḥrām (the opening "Allāhu akbar"), then reads the opening duʿāʾ (duʿāʾ al-istiftāḥ), then says <strong>six extra takbīrs</strong>, raising his hands with each one. Between the takbīrs he praises Allah, extols Him, and sends ṣalāh on the Prophet ﷺ. Then he seeks refuge (aʿūdhu billāh), says the basmalah, and begins reciting.</div></div>

<div class="point"><span class="point-num">1b</span><div class="point-ar">يكبِّر في الركعة الثانية بعد تكبيرة الانتقال خمس تكبيرات، ثم يستعيذ ويبسمل ويشرع في القراءة.</div><div class="point-translit">Yukabbiru fi r-rakʿati th-thāniyati baʿda takbīrati l-intiqāli khamsa takbīrāt, thumma yastaʿīdhu wa yubasmilu wa yashraʿu fi l-qirāʾah.</div><div class="point-en"><strong>Second rakʿah:</strong> after the takbīr of moving (standing up from sujūd), he says <strong>five extra takbīrs</strong>, then seeks refuge, says the basmalah, and begins reciting.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ 6 + 5</span><div class="study-note-body"><strong>Rakʿah 1:</strong> opening takbīr → duʿāʾ al-istiftāḥ → <strong>6 takbīrs</strong> → aʿūdhu + bismillāh → recite.<br><strong>Rakʿah 2:</strong> takbīr of standing up → <strong>5 takbīrs</strong> → aʿūdhu + bismillāh → recite.<br><br>Memory hook: "<strong>six then five</strong>", counting down, like the day getting closer to celebration!</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Common mix-up</span><div class="study-note-body">The opening duʿāʾ (istiftāḥ) comes <strong>before</strong> the six takbīrs. The seeking of refuge (taʿawwudh) comes <strong>after</strong> them, right before reciting. Don’t swap them. This is exactly Assessment question 1!</div></div>

<div class="point"><span class="point-num">2</span><div class="point-ar">يقرأ في الركعتين بعد الفاتحة سورة «الأعلى» في الأولى وسورة «الغاشية» في الثانية، أو سورة «ق» في الأولى، و«القمر» في الثانية.</div><div class="point-translit">Yaqraʾu fi r-rakʿatayni baʿda l-fātiḥati sūrata «al-Aʿlā» fi l-ūlā wa sūrata «al-Ghāshiyah» fi th-thāniyah, aw sūrata «Qāf» fi l-ūlā, wa «al-Qamar» fi th-thāniyah.</div><div class="point-en">In both rakʿahs, after al-Fātiḥah, he recites <strong>Sūrat al-Aʿlā</strong> (87) in the first and <strong>Sūrat al-Ghāshiyah</strong> (88) in the second; <em>or</em> <strong>Sūrat Qāf</strong> (50) in the first and <strong>al-Qamar</strong> (54) in the second.</div></div>

<div class="point"><span class="point-num">3</span><div class="point-ar">فإِذا سلَّم الإِمام صعِدَ على المنبر فخطب خُطبتين، يجلس بينهما جلسة خفيفة كما يفعل في خُطبتي الجمعة.</div><div class="point-translit">Fa-idhā sallama l-imāmu ṣaʿida ʿala l-minbari fa-khaṭaba khuṭbatayn, yajlisu baynahumā jalsatan khafīfatan kamā yafʿalu fī khuṭbatayi l-jumuʿah.</div><div class="point-en">When the imām finishes with the salām, he goes up on the minbar and gives <strong>two khuṭbahs</strong> (sermons), sitting briefly between them, just as he does in the two Friday khuṭbahs.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Prayer first, then sermon?</span><div class="study-note-body">Yes! On ʿĪd the order is <strong>prayer → khuṭbah</strong>. On Friday it is the opposite: <strong>khuṭbah → prayer</strong>. This is one of the big differences you will need for the comparison table in the assessment.</div></div>

</div>

<div class="sec"><div class="sec-ar">موضع صلاة العيدين</div><div class="sec-translit">Mawḍiʿu ṣalāti l-ʿīdayn</div><div class="sec-en">Where the ʿĪd Prayer Is Held</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">السُّنّة أن تُصلّى صلاة العيدين في المُصَلَّى؛ لفعل النبي ﷺ، ولو صُلِّيت في المسجد فلا بأس.</div><div class="bt-translit">As-sunnatu an tuṣallā ṣalātu l-ʿīdayni fi l-muṣallā; li-fiʿli n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam, wa law ṣulliyat fi l-masjidi fa-lā baʾs.</div><div class="bt-en">The Sunnah is to pray the ʿĪd prayer in the <strong>muṣallā</strong> (an open prayer ground), because that is what the Prophet ﷺ did. But if it is prayed in the masjid, there is <strong>no harm</strong>.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">مُصَلَّى · muṣallā</div><div class="study-note-body">From root ص-ل-و (ṣ-l-w), the root of <strong>ṣalāh</strong>. A <em>muṣallā</em> is "a place where prayer is done". For ʿĪd it means a big open ground outside, so the whole town can gather together.</div></div>
`;}

function L10P4(){return `
<div class="sec"><div class="sec-ar">سنن العيدين</div><div class="sec-translit">Sunanu l-ʿīdayn</div><div class="sec-en">The Sunnahs of the Two ʿĪds</div></div>

<ul class="num-list">
<li data-n="1"><div class="li-ar">الغُسل يوم العيد، وقد ثبت هذا من فعل الصحابة رضي الله عنهم، فعن نافع – رحمه اللَّه – «أن عبداللَّه بن عمر رضي الله عنهما كان يغتسل يوم الفطر قبل أن يغدو إلى المصلّى».</div><div class="li-translit">Al-ghuslu yawma l-ʿīd, wa qad thabata hādhā min fiʿli ṣ-ṣaḥābati raḍiya-llāhu ʿanhum, fa-ʿan Nāfiʿin raḥimahu-llāh: «anna ʿAbda-llāhi bna ʿUmara raḍiya-llāhu ʿanhumā kāna yaghtasilu yawma l-fiṭri qabla an yaghduwa ila l-muṣallā».</div><div class="li-en"><strong>Taking a ghusl (full bath) on the day of ʿĪd.</strong> This is established from the practice of the Companions (may Allah be pleased with them). Nāfiʿ (may Allah have mercy on him) reported: <strong>"ʿAbdullāh ibn ʿUmar (may Allah be pleased with them both) used to take a ghusl on the Day of al-Fiṭr before going out in the morning to the muṣallā."</strong></div></li>
</ul>
<div class="h-source">أخرجه مالك برقم (٢) · Narrated by Mālik (al-Muwaṭṭaʾ), no. 2</div>

<ul class="num-list">
<li data-n="2"><div class="li-ar">أن يتنظف، ويتطيب، ويلبس أحسن ما يجد.</div><div class="li-translit">An yatanaẓẓafa, wa yataṭayyaba, wa yalbasa aḥsana mā yajid.</div><div class="li-en"><strong>To clean himself, put on perfume, and wear the best clothes he has.</strong></div></li>
</ul>
<div class="h-source">المغني (٢/٢٧٤)، وفتح الباري: ٢/٤٣٩ · See al-Mughnī 2/274 and Fatḥ al-Bārī 2/439</div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ A note for sisters</span><div class="study-note-body">The book lists perfume as a Sunnah of ʿĪd. Remember from your earlier lessons that a woman going out among non-maḥram men does not wear perfume that others can smell. Your beautifying and perfume can be at home and among women. Ask your teacher if you are unsure.</div></div>

<ul class="num-list">
<li data-n="3"><div class="li-ar">أن يأكل قبل خروجه إلى المصلَّى في عيد الفطر تَمَرات، والأفضل أن تكون وترًا، أما عيد الأضحى فالأفضل لمن أراد أن يضحي يوم العيد ألّا يأكل حتى يرجع من المصلَّى، فيأكل من أضحيته.</div><div class="li-translit">An yaʾkula qabla khurūjihi ila l-muṣallā fī ʿīdi l-fiṭri tamarāt, wa l-afḍalu an takūna witrā. Ammā ʿīdu l-aḍḥā fa-l-afḍalu li-man arāda an yuḍaḥḥiya yawma l-ʿīdi allā yaʾkula ḥattā yarjiʿa mina l-muṣallā, fa-yaʾkula min uḍḥiyatih.</div><div class="li-en"><strong>On ʿĪd al-Fiṭr: eat some dates before going out to the muṣallā</strong>, and it is best that they be an odd number. <strong>On ʿĪd al-Aḍḥā:</strong> it is best for someone who intends to offer a sacrifice on the day of ʿĪd <strong>not to eat until he returns</strong> from the muṣallā, and then eat from his sacrifice.</div></li>
</ul>

<div class="hadith"><div class="hadith-label">Ḥadīth — Dates before ʿĪd al-Fiṭr</div><div class="h-ar">فعن أنس بن مالك ﵁ قال: «كان رسول اللَّه ﷺ لا يغدو يوم الفطر حتى يأكل تمرات، ويأكلهن وترًا».</div><div class="h-translit">Fa-ʿan Anasi bni Mālikin raḍiya-llāhu ʿanhu qāl: «kāna rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallama lā yaghdū yawma l-fiṭri ḥattā yaʾkula tamarāt, wa yaʾkuluhunna witrā».</div><div class="h-en">Anas ibn Mālik (may Allah be pleased with him) said: <strong>"The Messenger of Allah ﷺ would not go out on the morning of the Day of al-Fiṭr until he had eaten some dates, and he would eat them in an odd number."</strong></div><div class="h-source">أخرجه البخاري برقم (٩٥٣) · Narrated by al-Bukhārī, no. 953</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Fiṭr: eat first · Aḍḥā: pray first</div><div class="h-ar">وعن بريدة ﵁ قال: «كان رسول اللَّه ﷺ لا يخرج يوم الفطر حتى يطعم، ولا يطعم يوم الأضحى حتى يصلي».</div><div class="h-translit">Wa ʿan Buraydata raḍiya-llāhu ʿanhu qāl: «kāna rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallama lā yakhruju yawma l-fiṭri ḥattā yaṭʿam, wa lā yaṭʿamu yawma l-aḍḥā ḥattā yuṣallī».</div><div class="h-en">Buraydah (may Allah be pleased with him) said: <strong>"The Messenger of Allah ﷺ would not go out on the Day of al-Fiṭr until he had eaten, and he would not eat on the Day of al-Aḍḥā until he had prayed."</strong></div><div class="h-source">أخرجه الترمذي برقم (٥٤٢)، وابن ماجه برقم (١٧٥٦)، وصححه الألباني في صحيح الترمذي: ١/٣٠٢ · Narrated by at-Tirmidhī, no. 542, and Ibn Mājah, no. 1756; al-Albānī graded it authentic in Ṣaḥīḥ at-Tirmidhī 1/302</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Fiṭr vs Aḍḥā: eating</span><div class="study-note-body"><strong>Fiṭr</strong> (فطر) literally means "breaking the fast", so you <strong>eat first</strong> (odd number of dates: 1, 3, 5…), then go to pray.<br><strong>Aḍḥā</strong> is the day of sacrifice, so you <strong>pray first</strong>, then eat from your sacrifice.</div></div>

<ul class="num-list">
<li data-n="4"><div class="li-ar">أن يخرج إلى العيد ماشيًا، وعليه السكينة والوقار، وقد ثبت «أن النبي ﷺ يخرج إلى العيد ماشيًا ويعود ماشيًا».</div><div class="li-translit">An yakhruja ila l-ʿīdi māshiyā, wa ʿalayhi s-sakīnatu wa l-waqār, wa qad thabata «anna n-nabiyya ṣallā-llāhu ʿalayhi wa sallama yakhruju ila l-ʿīdi māshiyan wa yaʿūdu māshiyā».</div><div class="li-en"><strong>To go out to the ʿĪd prayer walking</strong>, with calmness and dignity. It is established <strong>"that the Prophet ﷺ would go out to ʿĪd walking and come back walking."</strong></div></li>
</ul>
<div class="h-source">أخرجه ابن ماجه برقم (١٢٩٥) · Narrated by Ibn Mājah, no. 1295</div>

<ul class="num-list">
<li data-n="5"><div class="li-ar">أن يذهب إلى المصلَّى من طريق ويرجع من طريق آخر، لحديث جابر ﵁ قال: «كان النبي ﷺ إذا كان يوم عيد خالف الطريق».</div><div class="li-translit">An yadhhaba ila l-muṣallā min ṭarīqin wa yarjiʿa min ṭarīqin ākhar, li-ḥadīthi Jābirin raḍiya-llāhu ʿanhu qāl: «kāna n-nabiyyu ṣallā-llāhu ʿalayhi wa sallama idhā kāna yawmu ʿīdin khālafa ṭ-ṭarīq».</div><div class="li-en"><strong>To go to the muṣallā by one road and return by another</strong>, because of the hadith of Jābir (may Allah be pleased with him), who said: <strong>"On the day of ʿĪd, the Prophet ﷺ would take different routes (going and returning)."</strong></div></li>
</ul>
<div class="h-source">أخرجه البخاري برقم (٩٨٦) · Narrated by al-Bukhārī, no. 986</div>

<ul class="num-list">
<li data-n="6"><div class="li-ar">يستحب للمأموم التبكير إلى المصلى يوم العيد بعد صلاة الصبح، أما الإِمام فيُستحبُّ له أن يتأخر إلى وقت الصلاة؛ لأن النبي ﷺ كان يفعل ذلك.</div><div class="li-translit">Yustaḥabbu li-l-maʾmūmi t-tabkīru ila l-muṣallā yawma l-ʿīdi baʿda ṣalāti ṣ-ṣubḥ, ammā l-imāmu fa-yustaḥabbu lahu an yataʾakhkhara ilā waqti ṣ-ṣalāh; li-anna n-nabiyya ṣallā-llāhu ʿalayhi wa sallama kāna yafʿalu dhālik.</div><div class="li-en">It is recommended for the <strong>followers</strong> to go <strong>early</strong> to the muṣallā on ʿĪd day, after the Fajr prayer. As for the <strong>imām</strong>, it is recommended that he comes <strong>at prayer time</strong>, because the Prophet ﷺ used to do that.</div></li>
</ul>

<div class="study-note remember"><span class="study-note-label">⭐ Six Sunnahs: quick list</span><div class="study-note-body">1. Ghusl · 2. Clean, perfume, best clothes · 3. Dates before Fiṭr / wait until after prayer on Aḍḥā · 4. Walk there and back calmly · 5. Different road back · 6. Followers come early, imām comes at prayer time.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Look how much the Prophet ﷺ cared about <em>small</em> details on ʿĪd: what he ate, how many dates, whether he walked, which road he took. Nothing about this day was careless.<br><br>Taking a different road back means more streets see the Muslims celebrating, more people get greeted, and more ground witnesses your steps to worship. Next ʿĪd, try to follow each of these Sunnahs on purpose and feel how the whole morning turns into worship.</div></div>
`;}

function L10P5(){return `
<div class="sec"><div class="sec-ar">التكبير المطلق والمقيد</div><div class="sec-translit">At-takbīru l-muṭlaqu wa l-muqayyad</div><div class="sec-en">The Free Takbīr and the Tied Takbīr</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">يُسَنّ التكبيرُ ليلتي العيدين، وعشر ذي الحجة، وأيام التشريق، وهو نوعان:</div><div class="bt-translit">Yusannu t-takbīru laylatayi l-ʿīdayn, wa ʿashri dhi l-ḥijjah, wa ayyāmi t-tashrīq, wa huwa nawʿān:</div><div class="bt-en">It is Sunnah to say the <strong>takbīr</strong> (Allāhu akbar…) on the <strong>two nights of ʿĪd</strong>, in the <strong>(first) ten days of Dhu l-Ḥijjah</strong>, and in the <strong>days of tashrīq</strong>. It is of <strong>two types</strong>:</div></div>

<div class="defbox"><div class="defbox-tag">📌 Type 1</div><div class="defbox-body"><div class="defbox-ar">أولًا التكبير المُطْلَق: وهو الذي لم يُقَيَّد بوقت محدد، ويبدأ في عيد الفطر من غروب شمس ليلة العيد إلى بدء صلاة العيد، فيكبِّر في الليل، وفي الطريق إلى المصلى، وأثناء جلوسه فيه حتى حضور الإِمام.</div><div class="defbox-translit">Awwalan: at-takbīru l-muṭlaq: wa huwa lladhī lam yuqayyad bi-waqtin muḥaddad, wa yabdaʾu fī ʿīdi l-fiṭri min ghurūbi shamsi laylati l-ʿīdi ilā badʾi ṣalāti l-ʿīd, fa-yukabbiru fi l-layl, wa fi ṭ-ṭarīqi ila l-muṣallā, wa athnāʾa julūsihi fīhi ḥattā ḥuḍūri l-imām.</div><div class="defbox-en"><strong>First: the free (muṭlaq) takbīr.</strong> It is the takbīr that is <strong>not tied to a specific time</strong>. For <strong>ʿĪd al-Fiṭr</strong>, it starts at <strong>sunset on the night of ʿĪd</strong> and lasts <strong>until the ʿĪd prayer begins</strong>. So one says takbīr during the night, on the way to the muṣallā, and while sitting there until the imām arrives.</div></div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">ويبدأ التكبير المطلق في عشر ذي الحجة من غروب الشمس ليلة اليوم الأول من ذي الحجة إلى غروب شمس آخر أيام التشريق وهو اليوم الثالث عشر.</div><div class="bt-translit">Wa yabdaʾu t-takbīru l-muṭlaqu fī ʿashri dhi l-ḥijjati min ghurūbi sh-shamsi laylata l-yawmi l-awwali min dhi l-ḥijjati ilā ghurūbi shamsi ākhiri ayyāmi t-tashrīq, wa huwa l-yawmu th-thālitha ʿashar.</div><div class="bt-en">For <strong>Dhu l-Ḥijjah</strong>, the free takbīr starts at <strong>sunset on the night of the 1st of Dhu l-Ḥijjah</strong> and lasts until <strong>sunset on the last day of tashrīq</strong>, which is the <strong>13th</strong>.</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">ويكبّر في هذه الأيام في الأسواق والبيوت والمساجد وغيرها، ويجهر به الرجال دون النساء.</div><div class="bt-translit">Wa yukabbiru fī hādhihi l-ayyāmi fi l-aswāqi wa l-buyūti wa l-masājidi wa ghayrihā, wa yajharu bihi r-rijālu dūna n-nisāʾ.</div><div class="bt-en">In these days one says takbīr in the <strong>markets, homes, masjids</strong> and other places. <strong>Men say it aloud; women do not</strong> (they say it quietly).</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ For sisters</span><div class="study-note-body">The book says men raise their voices with the takbīr, <strong>not women</strong>. That does not mean women skip it! You still say the takbīr, just in a <strong>low voice</strong>. Same reward, softer voice.</div></div>

<div class="defbox"><div class="defbox-tag gold">📌 Type 2</div><div class="defbox-body"><div class="defbox-ar">ثانيًا التكبير المقيَّد: وهو المقيّد بأدبار الصلوات المفروضة المؤدّاة في جماعة، ويبدأ في حق غير المُحْرِم بالحج: من صلاة الفجر يوم عرفة إلى عصر آخر أيام التشريق.</div><div class="defbox-translit">Thāniyan: at-takbīru l-muqayyad: wa huwa l-muqayyadu bi-adbāri ṣ-ṣalawāti l-mafrūḍati l-muʾaddāti fī jamāʿah, wa yabdaʾu fī ḥaqqi ghayri l-muḥrimi bi-l-ḥajj: min ṣalāti l-fajri yawma ʿArafata ilā ʿaṣri ākhiri ayyāmi t-tashrīq.</div><div class="defbox-en"><strong>Second: the tied (muqayyad) takbīr.</strong> It is tied to <strong>right after the obligatory prayers</strong> performed in congregation. For someone <strong>not in iḥrām for ḥajj</strong>, it runs from <strong>Fajr on the Day of ʿArafah</strong> until <strong>ʿAṣr on the last day of tashrīq</strong>.</div></div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">وفي حق المُحْرِم بالحج: يبدأ من صلاة الظهر يوم العيد إلى عصر آخر أيام التشريق.</div><div class="bt-translit">Wa fī ḥaqqi l-muḥrimi bi-l-ḥajj: yabdaʾu min ṣalāti ẓ-ẓuhri yawma l-ʿīdi ilā ʿaṣri ākhiri ayyāmi t-tashrīq.</div><div class="bt-en">For the <strong>pilgrim in iḥrām</strong>: it starts from <strong>Ẓuhr on the day of ʿĪd</strong> until <strong>ʿAṣr on the last day of tashrīq</strong>.</div></div>

<div class="callout rust"><div class="callout-label">📌 Conclusion</div><div class="callout-ar">وعلى هذا فيجتمع في يوم عرفة وما بعده من أيام العيد التكبير المطلق والمقيّد.</div><div class="callout-translit">Wa ʿalā hādhā fa-yajtamiʿu fī yawmi ʿArafata wa mā baʿdahu min ayyāmi l-ʿīdi t-takbīru l-muṭlaqu wa l-muqayyad.</div><div class="callout-en">So, on the <strong>Day of ʿArafah and the ʿĪd days after it</strong>, <strong>both</strong> the free and the tied takbīr come together.</div></div>

<table class="styled-table"><thead><tr><th></th><th><span dir="rtl" lang="ar">التكبير المطلق</span><br>Free takbīr</th><th><span dir="rtl" lang="ar">التكبير المقيد</span><br>Tied takbīr</th></tr></thead><tbody>
<tr><td><strong>What</strong></td><td>Any time, anywhere</td><td>Right after obligatory prayers in congregation</td></tr>
<tr><td><strong>ʿĪd al-Fiṭr</strong></td><td>Sunset on ʿĪd night → start of ʿĪd prayer</td><td>—</td></tr>
<tr><td><strong>Dhu l-Ḥijjah</strong></td><td>Sunset on night of 1st → sunset of 13th</td><td>Fajr of ʿArafah (9th) → ʿAṣr of 13th<br><em>(pilgrim: Ẓuhr of ʿĪd day → ʿAṣr of 13th)</em></td></tr>
</tbody></table>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">مُطْلَق / مُقَيَّد · muṭlaq / muqayyad</div><div class="study-note-body"><strong>Muṭlaq</strong> from ط-ل-ق (ṭ-l-q), "to set free, release". The free takbīr is <em>released</em>: any time, any place.<br><strong>Muqayyad</strong> from ق-ي-د (q-y-d), "to tie, restrict" (<em>qayd</em> = a shackle). The tied takbīr is <em>tied</em> to after the prayers.</div></div>

<div class="sec"><div class="sec-ar">صفة التكبير</div><div class="sec-translit">Ṣifatu t-takbīr</div><div class="sec-en">The Wording of the Takbīr</div></div>

<div class="verse"><div class="v-ar">أن يقول: اللّٰه أكبر، اللّٰه أكبر، لا إله إلا اللّٰه. اللّٰه أكبر، اللّٰه أكبر ولله الحمد.</div><div class="v-translit">An yaqūl: Allāhu akbar, Allāhu akbar, lā ilāha illa-llāh. Allāhu akbar, Allāhu akbar, wa li-llāhi l-ḥamd.</div><div class="v-en">He says: <strong>"Allah is the Greatest, Allah is the Greatest, there is no god but Allah. Allah is the Greatest, Allah is the Greatest, and to Allah belongs all praise."</strong></div><div class="v-ref">صفة التكبير · The takbīr (from the book)</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">For days, Muslims fill homes, markets and masjids with "Allāhu akbar". In the markets, where people usually think about money and buying, the takbīr reminds everyone: <em>Allah is greater</em> than anything here.<br><br>Try this: while cooking, driving or shopping in the first ten days of Dhu l-Ḥijjah, quietly repeat this takbīr. What feels "big" in your life right now? Say <em>Allāhu akbar</em> and let it shrink.</div></div>
`;}

function L10P6(){return `
<div class="assessment" id="as10p6">
<div class="section-badge">التَّقْوِيم · Assessment</div>
<p class="assessment-intro" style="margin-top:8px">Try each question before revealing.</p>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('as10p6'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('as10p6'))">Hide All</button></div>

<div class="q-item"><span class="q-num">1</span><div class="q-en">Where do the opening duʿāʾ (istiftāḥ) and the seeking of refuge (istiʿādhah) come in the ʿĪd prayer?</div><div class="q-ar">ما موضع دعاء الاستفتاح، والاستعاذة في صلاة العيد؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>Duʿāʾ al-istiftāḥ:</strong> in the first rakʿah, right <strong>after takbīrat al-iḥrām</strong> and <strong>before</strong> the six extra takbīrs.<br><strong>Istiʿādhah (taʿawwudh):</strong> <strong>after</strong> the extra takbīrs, just before reciting: in the first rakʿah after the six takbīrs, and in the second rakʿah after the five takbīrs, followed by the basmalah and the recitation.</div></div>

<div class="q-item"><span class="q-num">2</span><div class="q-en">If you want to go to the ʿĪd muṣallā, what actions do you do from the moment you leave home until you come back from the muṣallā?</div><div class="q-ar">إذا أردتَّ الذهاب إلى مصلَّى العيد فما الأعمال التي تقوم بها من حين خروجك من المنزل حتى رجوعك إليه مرة أخرى قادمًا من المصلى؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">Before leaving: ghusl, cleaning myself, perfume (at home for women), my best clothes; on ʿĪd al-Fiṭr I eat an odd number of dates (on al-Aḍḥā, if I am sacrificing, I wait and eat after the prayer).<br>Going: walk with calm and dignity, go early after Fajr (if I am not the imām), and say the free takbīr on the way and while sitting until the imām comes (men aloud, women quietly).<br>There: pray two rakʿahs (6 + 5 takbīrs) and listen to the two khuṭbahs.<br>Returning: walk back <strong>by a different road</strong>; on al-Aḍḥā eat from my sacrifice; visit relatives and friends and show joy.</div></div>

<div class="q-item"><span class="q-num">3</span><div class="q-en">From your earlier study of voluntary prayer, which prayer has the same start and end time as the ʿĪd prayer?</div><div class="q-ar">من خلال دراستك السابقة لصلاة التطوّع، ما الصلاة التي يكون بداية وقتها وانتهاؤه مماثلاً لصلاة العيد؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>Ṣalāt aḍ-Ḍuḥā</strong> (the forenoon prayer). Like the ʿĪd prayer, its time begins when the sun has risen about a spear’s length (around a quarter of an hour after sunrise) and ends at zawāl.</div></div>

<div class="q-item"><span class="q-num">4</span><div class="q-en">Compare the ʿĪd prayer and the Friday (Jumuʿah) prayer.</div><div class="q-ar">قارن بين صلاتي العيد والجمعة.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">
<table class="styled-table"><thead><tr><th><span dir="rtl" lang="ar">صلاة العيد</span><br>ʿĪd prayer</th><th><span dir="rtl" lang="ar">صلاة الجمعة</span><br>Friday prayer</th></tr></thead><tbody>
<tr><td>Farḍ kifāyah (community obligation)</td><td>Farḍ ʿayn (individual obligation on men)</td></tr>
<tr><td>No adhān, no iqāmah</td><td>Has adhān and iqāmah</td></tr>
<tr><td>Prayer first, <strong>then</strong> two khuṭbahs</td><td>Two khuṭbahs first, <strong>then</strong> the prayer</td></tr>
<tr><td>Extra takbīrs: 6 in the 1st rakʿah, 5 in the 2nd</td><td>No extra takbīrs</td></tr>
<tr><td>Time: from sun a spear’s length high until zawāl</td><td>Time: Ẓuhr time</td></tr>
<tr><td>Twice a year, Sunnah to pray in the muṣallā</td><td>Every week, in the masjid</td></tr>
</tbody></table>
<strong>Same in both:</strong> two rakʿahs, recitation aloud, two khuṭbahs with a short sitting between them.</div></div>
</div>
`;}
