<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiqh Level 2 — Islamic Jurisprudence Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rust:#2c4a6b;--rust-mid:#4a7aa5;--rust-light:#dde7f2;--rust-pale:#f0f5fa;
  --gold:#5a7ba3;--gold-light:#e8edf4;--gold-pale:#f4f7fb;
  --sand:#f4f7fb;--ink:#1f2a36;--ink-mid:#3a4756;--muted:#6a7684;
  --border:#c8d4e0;--white:#ffffff;
  --teal:#4a8a7a;--teal-pale:#d6ebe4;
  --shadow:0 2px 12px rgba(44,74,107,.10);--shadow-lg:0 8px 32px rgba(44,74,107,.14);
  --r:10px;--r-sm:6px;
  --ar:'Amiri','Noto Naskh Arabic','Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--ink);font-size:15px;line-height:1.75;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
.top-nav{background:var(--rust);color:#fff;padding:0 20px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top-nav .logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.top-nav .logo-ar{font-size:1.15rem;opacity:.75;margin-left:4px}
.top-nav-spacer{flex:1}
.unit-tabs{display:flex;gap:4px;flex-wrap:wrap}
.unit-tab{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 11px;border-radius:18px;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:500;transition:all .2s;white-space:nowrap}
.unit-tab:hover{background:rgba(255,255,255,.22)}
.unit-tab.active{background:#fff;color:var(--rust);font-weight:600}
.main{display:block;flex:1}
.content{padding:28px 32px;max-width:860px;margin:0 auto}
.page-nav{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.page-nav-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:5px}
.page-nav-btn:hover{background:var(--rust-pale);border-color:var(--rust-mid);color:var(--rust)}
.page-nav-btn.active{background:var(--rust);border-color:var(--rust);color:#fff}
.page-nav-btn .pnb-num{width:18px;height:18px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
.page-nav-btn:not(.active) .pnb-num{background:var(--rust-light);color:var(--rust)}
.lesson-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--rust-light)}
.lesson-num-badge{background:var(--rust);color:#fff;border-radius:var(--r-sm);padding:8px 14px;text-align:center;min-width:60px;flex-shrink:0}
.lesson-num-badge .lnb-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.lesson-num-badge .lnb-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;line-height:1;margin-top:2px}
.lesson-title-ar{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--rust);line-height:1.15;margin-bottom:4px}
.lesson-title-en{font-size:1.05rem;font-weight:500;color:var(--ink-mid)}
.lesson-title-translit{font-size:.85rem;font-style:italic;color:var(--muted);margin-top:2px}
.page-label{display:inline-flex;align-items:center;gap:6px;background:var(--gold-light);border:1px solid rgba(90,123,163,.3);border-radius:20px;padding:4px 12px;font-size:.75rem;font-weight:600;color:var(--gold);margin-bottom:20px;letter-spacing:.3px}
.page-label::before{content:"📄";font-size:.8rem}
.sec{background:linear-gradient(90deg,var(--rust-light),rgba(221,231,242,0));border-left:3px solid var(--rust-mid);padding:10px 16px;margin:24px 0 14px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.sec .sec-ar{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:700;color:var(--rust)}
.sec .sec-translit{font-size:.8rem;font-style:italic;color:var(--muted);margin-top:1px}
.sec .sec-en{font-size:.92rem;font-weight:600;color:var(--ink-mid);margin-top:2px}
.point{background:var(--gold-light);border:1px solid rgba(90,123,163,.25);border-radius:var(--r);padding:10px 16px;margin:18px 0 10px;display:flex;align-items:flex-start;gap:10px}
.point-num{background:var(--gold);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:1px}
.point-ar{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;color:var(--rust)}
.point-translit{font-size:.78rem;font-style:italic;color:var(--muted)}
.point-en{font-size:.9rem;font-weight:600;color:var(--ink-mid)}
.defbox{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:12px 0;box-shadow:var(--shadow)}
.defbox-tag{background:var(--rust);color:#fff;padding:5px 14px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px}
.defbox-tag.gold{background:var(--gold)}
.defbox-tag.light{background:var(--rust-light);color:var(--rust)}
.defbox-body{padding:14px 16px}
.defbox-ar{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--ink);line-height:1.8;margin-bottom:6px;text-align:right;direction:rtl}
.defbox-translit{font-style:italic;color:var(--muted);font-size:.85rem;margin-bottom:6px}
.defbox-en{color:var(--ink-mid);font-size:.9rem;line-height:1.65}
.verse{background:var(--rust-pale);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin:14px 0;text-align:center}
.verse .v-ar{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--rust);line-height:2;direction:rtl;margin-bottom:10px}
.verse .v-translit{font-style:italic;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.verse .v-en{color:var(--ink);font-size:.92rem;line-height:1.65;font-style:italic}
.body-text{background:rgba(221,231,242,.35);border-right:3px solid var(--rust-mid);border-radius:var(--r-sm);padding:14px 18px;margin:14px 0}
.body-text .bt-ar{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink);line-height:2;direction:rtl;text-align:right;margin-bottom:10px}
.body-text .bt-translit{font-style:italic;color:var(--muted);font-size:.82rem;line-height:1.7;margin-bottom:8px;padding:6px 10px;background:rgba(44,74,107,.04);border-radius:var(--r-sm)}
.body-text .bt-en{color:var(--ink-mid);font-size:.92rem;line-height:1.7}
.body-text .bt-label{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--rust);background:var(--rust-light);padding:2px 8px;border-radius:10px;margin-bottom:8px}
.verse .v-ref{margin-top:10px;font-size:.75rem;font-weight:600;color:var(--gold);letter-spacing:.3px}
.hadith{background:var(--gold-pale);border:1px solid rgba(90,123,163,.25);border-radius:var(--r);padding:16px 20px;margin:14px 0;position:relative}
.hadith::before{content:"ﷺ";position:absolute;top:12px;right:16px;font-size:1.2rem;color:var(--gold);opacity:.4;font-family:'Cormorant Garamond',serif}
.hadith-label{display:inline-block;background:var(--gold);color:#fff;padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.hadith .h-ar{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--ink);line-height:1.9;direction:rtl;text-align:right;margin-bottom:8px}
.hadith .h-translit{font-style:italic;color:var(--muted);font-size:.84rem;margin-bottom:8px;padding:6px 10px;background:rgba(90,123,163,.06);border-radius:var(--r-sm)}
.hadith .h-en{color:var(--ink-mid);font-size:.9rem;line-height:1.65}
.hadith .h-source{margin-top:10px;font-size:.75rem;color:var(--muted);padding-top:8px;border-top:1px dashed rgba(90,123,163,.3)}
.callout{border-left:4px solid var(--gold);background:var(--gold-light);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin:14px 0}
.callout.rust{border-left-color:var(--rust-mid);background:var(--rust-light)}
.callout-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);margin-bottom:6px}
.callout.rust .callout-label{color:var(--rust)}
.callout-ar{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--ink);direction:rtl;text-align:center;margin:8px 0}
.callout-translit{font-style:italic;color:var(--muted);font-size:.83rem;text-align:center}
.callout-en{font-size:.9rem;color:var(--ink-mid);line-height:1.65}
.num-list{list-style:none;padding:0}
.num-list li{background:var(--white);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px 12px 48px;margin-bottom:8px;position:relative;box-shadow:var(--shadow)}
.num-list li::before{content:attr(data-n);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;background:var(--rust);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.num-list li .li-ar{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--rust);font-weight:600;margin-bottom:3px}
.num-list li .li-translit{font-style:italic;color:var(--muted);font-size:.8rem;margin-bottom:2px}
.num-list li .li-en{font-size:.88rem;color:var(--ink-mid)}
.styled-table{width:100%;border-collapse:collapse;margin:14px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.styled-table th{background:var(--rust);color:#fff;padding:10px 14px;text-align:left;font-size:.82rem;font-weight:600;letter-spacing:.3px}
.styled-table td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:.88rem;background:var(--white);vertical-align:top}
.styled-table tr:last-child td{border-bottom:none}
.styled-table tr:nth-child(even) td{background:var(--rust-pale)}
.activity,.assessment{border:2px solid var(--rust-mid);border-radius:var(--r);padding:20px 20px 16px;margin:20px 0;position:relative;background:var(--rust-pale)}
.assessment{border-color:var(--gold);background:var(--gold-pale)}
.section-badge{position:absolute;top:-14px;right:20px;background:var(--rust-mid);color:#fff;padding:4px 16px;border-radius:20px;font-weight:700;font-size:.82rem;box-shadow:var(--shadow)}
.assessment .section-badge{background:var(--gold)}
.activity-intro,.assessment-intro{font-size:.9rem;color:var(--muted);font-style:italic;margin-bottom:12px}
.activity-controls{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.btn-reveal-all,.btn-hide-all{background:var(--white);border:1.5px solid var(--rust-mid);color:var(--rust);padding:5px 14px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-reveal-all:hover{background:var(--rust-mid);color:#fff}
.assessment .btn-reveal-all{border-color:var(--gold);color:var(--gold)}
.assessment .btn-reveal-all:hover{background:var(--gold);color:#fff}
.act-item{background:var(--white);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
.act-item .act-prompt{font-size:.9rem;color:var(--ink);margin-bottom:6px}
.act-item .act-ar{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--rust);font-weight:600;direction:rtl;text-align:right;margin-bottom:3px}
.act-item .act-translit{font-size:.78rem;font-style:italic;color:var(--muted);margin-bottom:4px}
.btn-answer{background:var(--rust-mid);color:#fff;border:none;padding:5px 12px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:600;transition:all .2s;margin-top:4px}
.btn-answer.open{background:var(--gold)}
.answer-box{display:none;background:var(--rust-light);border-left:3px solid var(--rust-mid);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:8px;font-size:.88rem;color:var(--rust);font-weight:500;animation:fadeDown .25s ease}
.answer-box.open{display:block}
.answer-box.gold-box{background:var(--gold-light);border-color:var(--gold);color:var(--ink);font-weight:normal}
.q-item{background:var(--white);border:1px solid rgba(90,123,163,.25);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:10px}
.q-item .q-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--gold);color:#fff;border-radius:50%;font-weight:700;font-size:.78rem;margin-right:8px;float:left;margin-top:1px}
.q-item .q-en{font-size:.9rem;font-weight:600;color:var(--ink);margin-bottom:4px}
.q-item .q-ar{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--ink-mid);direction:rtl;text-align:right}
.q-item .q-translit{font-size:.78rem;font-style:italic;color:var(--muted);margin-top:2px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.compare-card{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.compare-card-head{padding:8px 14px;font-weight:700;font-size:.88rem;color:#fff}
.compare-card-head.rust{background:var(--rust)}
.compare-card-head.gold{background:var(--gold)}
.compare-card-head .ch-ar{font-family:'Cormorant Garamond',serif;font-size:1rem;display:block}
.compare-card-head .ch-translit{font-size:.72rem;opacity:.85;font-style:italic}
.compare-card-body{background:var(--white);padding:0}
.compare-card-body li{padding:8px 14px;font-size:.85rem;border-bottom:1px solid var(--border);list-style:none}
.compare-card-body li:last-child{border-bottom:none}
.word-note{display:inline-block;background:var(--gold-light);border:1.5px dashed rgba(90,123,163,.5);padding:2px 10px;border-radius:14px;font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--rust);font-weight:600}
.impl-list{list-style:none;padding:0;margin:8px 0}
.impl-list li{padding:6px 10px 6px 30px;font-size:.88rem;position:relative;margin-bottom:4px}
.impl-list li::before{content:"•";position:absolute;left:10px;color:var(--rust-mid);font-weight:700}
.page-footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.prev-next{display:flex;gap:8px}
.pn-btn{background:var(--white);border:1px solid var(--border);color:var(--rust);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:500;transition:all .2s}
.pn-btn:hover{background:var(--rust);color:#fff;border-color:var(--rust)}
.pn-btn:disabled{opacity:.35;cursor:default}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.page-content{animation:fadeDown .3s ease}
/* STUDY NOTES */
.study-note{position:relative;background:#fdf6e3;border:1.5px solid #e8d4a0;border-radius:var(--r);padding:14px 18px 14px 54px;margin:16px 0;box-shadow:0 2px 10px rgba(90,123,163,.12)}
.study-note::before{content:"📝";position:absolute;left:14px;top:12px;font-size:1.3rem;background:#f5ead0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #e8d4a0}
.study-note-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#8a6b1f;margin-bottom:5px;display:block}
.study-note-title{font-weight:700;font-size:.95rem;color:var(--ink);margin-bottom:4px;font-family:'Cormorant Garamond',serif}
.study-note-body{font-size:.88rem;color:var(--ink-mid);line-height:1.65}
.study-note-body strong{color:var(--gold)}
.study-note-body em{font-style:italic;color:var(--rust)}
.study-note.remember{background:#fff5f5;border-color:#e8a5a5}
.study-note.remember::before{content:"⭐";background:#ffe8e8;border-color:#e8a5a5}
.study-note.remember .study-note-label{color:#b85050}
.study-note.watch-out{background:#fff3e8;border-color:#e8b87a}
.study-note.watch-out::before{content:"⚠️";background:#ffe6cc;border-color:#e8b87a}
.study-note.watch-out .study-note-label{color:#a8641a}
.study-note.root-tip{background:#f0f8ff;border-color:#8fb8d8}
.study-note.root-tip::before{content:"🌱";background:#e0ecf5;border-color:#8fb8d8}
.study-note.root-tip .study-note-label{color:#3a6a8a}
.study-note.beginner{background:var(--teal-pale);border-color:var(--teal)}
.study-note.beginner::before{content:"💡";background:var(--teal-pale);border-color:var(--teal)}
.study-note.beginner .study-note-label{color:var(--teal)}
/* VOCAB */
.vocab-page-label{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--rust),var(--rust-mid));color:#fff;border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:700;margin-bottom:20px;letter-spacing:.5px}
.vocab-page-label::before{content:"📖";font-size:.9rem}
.vocab-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--rust-mid);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.vocab-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.vocab-table{width:100%;border-collapse:collapse;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px}
.vocab-table thead tr{background:var(--rust)}
.vocab-table thead th{color:#fff;padding:9px 14px;text-align:left;font-size:.78rem;font-weight:600}
.vocab-table tbody td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:.88rem;background:transparent;vertical-align:top}
.vocab-table tbody tr:last-child td{border-bottom:none}
.vocab-table tbody tr:nth-child(even) td{background:rgba(168,69,31,.03)}
.vtd-ar{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--rust);font-weight:600}
.vtd-translit{font-style:italic;color:var(--muted);font-size:.83rem}
.vtd-type{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.68rem;font-weight:700;text-transform:uppercase}
.vtd-type.noun{background:rgba(168,69,31,.12);color:var(--rust)}
.vtd-type.verb{background:rgba(90,123,163,.15);color:var(--gold)}
.vtd-type.adj{background:rgba(61,82,72,.12);color:var(--ink-mid)}
.vtd-type.phrase{background:rgba(194,99,56,.15);color:var(--rust-mid)}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.vcard{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:all .2s;border-left:3px solid var(--rust-light)}
.vcard:hover{box-shadow:var(--shadow-lg);border-left-color:var(--rust-mid);transform:translateY(-1px)}
.vcard.flipped{border-left-color:var(--gold)}
.vcard .vc-ar{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--rust);font-weight:700;line-height:1.2;margin-bottom:4px}
.vcard .vc-translit{font-style:italic;color:var(--muted);font-size:.8rem}
.vcard .vc-back{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.vcard.flipped .vc-back{display:block}
.vcard .vc-meaning{font-size:.9rem;color:var(--ink);font-weight:500}
.vcard .vc-type{margin-top:4px}
.vcard .vc-root{font-size:.78rem;color:var(--muted);margin-top:4px;font-style:italic}
.vcard .vc-hint{position:absolute;bottom:8px;right:10px;font-size:.65rem;color:var(--muted)}
.vcard.flipped .vc-hint{color:var(--gold)}
.vocab-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px;align-items:center}
.vocab-ctrl-btn{background:var(--white);border:1.5px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:500;transition:all .2s}
.vocab-ctrl-btn:hover{border-color:var(--rust-mid);color:var(--rust);background:var(--rust-pale)}
.vocab-count{font-size:.75rem;color:var(--muted);margin-left:auto}
/* FIQH-specific: Ruling chart */
.ruling-chart{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.ruling-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--rust-mid);text-align:center}
.ruling-card.wajib{border-top-color:#2a8f74}
.ruling-card.mustahabb{border-top-color:#6ab04c}
.ruling-card.mubah{border-top-color:#95a5a6}
.ruling-card.makruh{border-top-color:#e17055}
.ruling-card.haram{border-top-color:#c0392b}
.ruling-card .rc-num{font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.ruling-card .rc-ar{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:700;color:var(--rust);margin-bottom:3px}
.ruling-card .rc-translit{font-style:italic;color:var(--muted);font-size:.75rem;margin-bottom:6px}
.ruling-card .rc-def{font-size:.78rem;color:var(--ink-mid);line-height:1.4;margin-bottom:6px}
.ruling-card .rc-ex{font-size:.72rem;color:var(--rust);font-weight:600;background:var(--rust-pale);padding:4px 8px;border-radius:4px;display:inline-block}

/* HAMBURGER & DRAWER */
.hamburger{background:none;border:none;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:4px;border-radius:6px;transition:all .2s}
.hamburger:hover{background:rgba(255,255,255,.12)}
.hamburger span{display:block;width:22px;height:2px;background:#fff;border-radius:1px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-backdrop.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:var(--white);box-shadow:4px 0 24px rgba(0,0,0,.15);z-index:160;transition:left .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:18px 14px}
.drawer.open{left:0}
.drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.drawer-title{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:700;color:var(--rust)}
.drawer-close{background:none;border:none;cursor:pointer;font-size:1.4rem;color:var(--muted);padding:2px 8px;border-radius:4px;line-height:1}
.drawer-close:hover{background:var(--rust-light);color:var(--rust)}
.drawer-unit{margin-bottom:16px}
.drawer-unit-head{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);padding:4px 10px 6px;display:flex;align-items:center;gap:6px}
.drawer-unit-head .due-ar{font-family:'Cormorant Garamond',serif;font-size:.92rem;font-weight:600;color:var(--rust);text-transform:none;letter-spacing:0;margin-left:auto}
.drawer-lesson{padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:3px}
.drawer-lesson:hover{background:var(--rust-pale);border-color:var(--border)}
.drawer-lesson.active{background:var(--rust-light);border-color:var(--rust-mid)}
.drawer-lesson .dl-num{font-size:.68rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.8px}
.drawer-lesson .dl-title{font-size:.88rem;font-weight:500;color:var(--ink);line-height:1.35;margin-top:1px}
.drawer-lesson .dl-ar{font-size:.82rem;color:var(--muted);margin-top:1px;font-family:'Cormorant Garamond',serif}
.drawer-lesson.active .dl-title{color:var(--rust)}
.drawer-lesson .dl-pages{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.dl-page-dot{width:22px;height:22px;border-radius:50%;background:var(--rust-light);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;color:var(--rust);cursor:pointer;transition:all .15s}
.dl-page-dot:hover,.dl-page-dot.active{background:var(--rust);color:#fff;border-color:var(--rust)}

@media(max-width:768px){.content{padding:16px}.compare-grid{grid-template-columns:1fr}.unit-tabs{display:none}.drawer{width:280px;left:-300px}}

/* Level 2 additions */
.sec-ar,.point-ar,.defbox-ar,.v-ar,.bt-ar,.h-ar,.callout-ar,.li-ar,.act-ar,.q-ar,.ch-ar,.vtd-ar,.vc-ar,.lesson-title-ar,.rc-ar,.due-ar,.dl-ar,.logo-ar,.study-note-title,[lang=ar],[dir=rtl]{font-family:var(--ar)}

.lesson-header-text{flex:1}
.h-ar,.bt-ar,.defbox-ar{line-height:2.1}
.study-note.reflect{background:#f4f0fa;border-color:#b9a6d8}

.study-note.reflect .study-note-label{color:#6b4f9a}
.styled-table td [dir=rtl],.compare-card-body [dir=rtl]{display:block;text-align:right;font-size:1.05rem}
.styled-table{display:block;overflow-x:auto}
@media(max-width:768px){.study-note{padding:14px 14px 14px 50px}.lesson-title-ar{font-size:1.6rem}}

<script>
const UNITS=[
  {id:0,titleAr:'رابعًا: الفقه',titleEn:'Introduction',translit:'',ordAr:'',lessons:[100]},
  {id:1,titleAr:'سجود السهو',titleEn:'Prostration of Forgetfulness',translit:'Sujūd as-sahw',ordAr:'الأولى',lessons:[1, 2]},
  {id:2,titleAr:'صلاة التطوع',titleEn:'Voluntary Prayers',translit:'Ṣalāt at-taṭawwuʿ',ordAr:'الثانية',lessons:[3, 4]},
  {id:3,titleAr:'صلاة الاستسقاء وصلاة الكسوف',titleEn:'Rain & Eclipse Prayers',translit:'Ṣalāt al-istisqāʾ wa ṣalāt al-kusūf',ordAr:'الثالثة',lessons:[5, 6]},
  {id:4,titleAr:'صلاة الجماعة',titleEn:'Congregational Prayer',translit:'Ṣalāt al-jamāʿah',ordAr:'الرابعة',lessons:[7]},
  {id:5,titleAr:'صلاة المسافر',titleEn:'The Traveller’s Prayer',translit:'Ṣalāt al-musāfir',ordAr:'الخامسة',lessons:[8]},
  {id:6,titleAr:'صلاة الجمعة',titleEn:'The Friday Prayer',translit:'Ṣalāt al-jumuʿah',ordAr:'السادسة',lessons:[9]},
  {id:7,titleAr:'صلاة العيدين',titleEn:'The Two ʿĪd Prayers',translit:'Ṣalāt al-ʿīdayn',ordAr:'السابعة',lessons:[10]},
  {id:8,titleAr:'الجنائز',titleEn:'Funerals',translit:'Al-janāʾiz',ordAr:'الثامنة',lessons:[11]}
];
const LESSONS_PART={};
let cU=0,cL=100,cP=0;
function switchUnit(u){cU=u;const un=UNITS.find(x=>x.id===u);cL=un.lessons[0];cP=0;render();}
function switchLesson(l,p=0){cL=l;cP=p;render();}
function switchPage(p){cP=p;renderContent();window.scrollTo({top:0,behavior:'smooth'});}
function prevPage(){const l=LESSONS[cL];if(cP>0){switchPage(cP-1);return;}const ul=UNITS.find(u=>u.id===cU).lessons;const i=ul.indexOf(cL);if(i>0){const pl=ul[i-1];cL=pl;cP=LESSONS[pl].pages.length-1;render();}else if(cU>0){const pu=UNITS[UNITS.findIndex(u=>u.id===cU)-1];cU=pu.id;cL=pu.lessons[pu.lessons.length-1];cP=LESSONS[cL].pages.length-1;render();}}
function nextPage(){const l=LESSONS[cL];if(cP<l.pages.length-1){switchPage(cP+1);return;}const ul=UNITS.find(u=>u.id===cU).lessons;const i=ul.indexOf(cL);if(i<ul.length-1){cL=ul[i+1];cP=0;render();}else{const ni=UNITS.findIndex(u=>u.id===cU)+1;if(ni<UNITS.length){const nu=UNITS[ni];cU=nu.id;cL=nu.lessons[0];cP=0;render();}}}
function render(){document.querySelectorAll('.unit-tab').forEach(t=>t.classList.toggle('active',+t.dataset.unit===cU));renderContent();if(document.getElementById('drawer').classList.contains('open'))renderDrawer();}
function renderDrawer(){let h='';UNITS.forEach(u=>{h+=`<div class="drawer-unit"><div class="drawer-unit-head">${u.id===0?'Intro':'Unit '+u.id}<span class="due-ar">${u.titleAr}</span></div>`;u.lessons.forEach(lid=>{const l=LESSONS[lid];const a=lid===cL;h+=`<div class="drawer-lesson${a?' active':''}" onclick="selectFromDrawer(${u.id},${lid})"><div class="dl-num">${lid===100?'Intro':'Lesson '+lid}</div><div class="dl-title">${l.titleEn}</div><div class="dl-ar">${l.titleAr}</div>${a?`<div class="dl-pages">${l.pages.map((p,i)=>`<div class="dl-page-dot${a&&i===cP?' active':''}" onclick="event.stopPropagation();selectFromDrawer(${u.id},${lid},${i})" title="${p.label}">${i+1}</div>`).join('')}</div>`:''}</div>`;});h+=`</div>`;});document.getElementById('drawerBody').innerHTML=h;}
function toggleDrawer(){const d=document.getElementById('drawer');const b=document.getElementById('drawerBackdrop');const h=document.getElementById('hamburger');const open=d.classList.toggle('open');b.classList.toggle('open',open);h.classList.toggle('open',open);if(open)renderDrawer();}
function selectFromDrawer(u,l,p){cU=u;cL=l;cP=p||0;document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open');document.getElementById('hamburger').classList.remove('open');render();}
function renderContent(){const l=LESSONS[cL];const pg=l.pages[cP];const ul=UNITS.find(u=>u.id===cU).lessons;const li=ul.indexOf(cL);const isF=cU===0&&li===0&&cP===0;const lastU=UNITS[UNITS.length-1];const isL=cU===lastU.id&&li===ul.length-1&&cP===l.pages.length-1;let h=`<div class="page-content"><div class="page-nav">${l.pages.map((p,i)=>`<button class="page-nav-btn${i===cP?' active':''}" onclick="switchPage(${i})"><span class="pnb-num">${i+1}</span>${p.label}${p.p?' <span style="font-size:.72rem;opacity:.65;">p.'+p.p+'</span>':''}</button>`).join('')}</div><div class="lesson-header"><div class="lesson-num-badge"><div class="lnb-label">${cL===100?'Intro':'Lesson'}</div><div class="lnb-num">${cL===100?'0':cL}</div></div><div class="lesson-header-text"><div class="lesson-title-ar">${l.titleAr}</div><div class="lesson-title-en">${l.titleEn}</div><div class="lesson-title-translit">${l.translit}</div></div></div>${pg.p?`<div class="page-label">Textbook page ${pg.p} · ${pg.label}</div>`:''}${getPageContent(pg.c)}<div class="page-footer"><div class="prev-next"><button class="pn-btn" onclick="prevPage()" ${isF?'disabled':''}>← Previous</button><button class="pn-btn" onclick="nextPage()" ${isL?'disabled':''}>Next →</button></div><div style="font-size:.75rem;color:var(--muted);">Ministry of Education · 2021–1443</div></div></div>`;document.getElementById('mainContent').innerHTML=h;}
function toggleAnswer(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.classList.toggle('open',open);btn.innerHTML=open?'✓ Hide Answer':'👁 Show Answer';}
function revealAll(el){el.querySelectorAll('.btn-answer').forEach(b=>{b.nextElementSibling.classList.add('open');b.classList.add('open');b.innerHTML='✓ Hide Answer';});}
function hideAll(el){el.querySelectorAll('.btn-answer').forEach(b=>{b.nextElementSibling.classList.remove('open');b.classList.remove('open');b.innerHTML='👁 Show Answer';});}
function flipCard(el){el.classList.toggle('flipped');el.querySelector('.vc-hint').textContent=el.classList.contains('flipped')?'tap to hide':'tap to flip';}
function flipAllCards(n,open){document.querySelectorAll(`[id^="vc${n}_"]`).forEach(c=>{open?c.classList.add('flipped'):c.classList.remove('flipped');c.querySelector('.vc-hint').textContent=open?'tap to hide':'tap to flip';});}
function vocabPage(lessonNum,words){const rows=words.map(w=>`<tr><td class="vtd-ar">${w[0]}</td><td class="vtd-translit">${w[1]}</td><td>${w[2]}</td><td><span class="vtd-type ${w[3]||'noun'}">${w[3]||'noun'}</span></td><td style="font-size:.86rem;color:var(--ink-mid)">${w[4]}</td></tr>`).join('');const cards=words.map((w,i)=>`<div class="vcard" id="vc${lessonNum}_${i}" onclick="flipCard(this)"><div class="vc-ar">${w[0]}</div><div class="vc-translit">${w[1]}</div><div class="vc-back"><div class="vc-meaning">${w[4]}</div><div class="vc-type"><span class="vtd-type ${w[3]||'noun'}">${w[3]||'noun'}</span></div>${w[5]?`<div class="vc-root">Root: ${w[5]}</div>`:''}</div><span class="vc-hint">tap to flip</span></div>`).join('');return `<div class="vocab-page-label">Lesson ${lessonNum===100?'Intro':lessonNum} Vocabulary</div><div class="vocab-section-title">Quick Reference Table</div><table class="vocab-table"><thead><tr><th>Arabic</th><th>Transliteration</th><th>English</th><th>Type</th><th>Explanation</th></tr></thead><tbody>${rows}</tbody></table><div class="vocab-section-title">Flashcards — tap each card</div><div class="vocab-controls"><button class="vocab-ctrl-btn" onclick="flipAllCards(${lessonNum},true)">Reveal All</button><button class="vocab-ctrl-btn" onclick="flipAllCards(${lessonNum},false)">Hide All</button><span class="vocab-count">${words.length} terms</span></div><div class="vocab-grid">${cards}</div>`;}
function getPageContent(id){const f=window[id];return typeof f==='function'?f():'<p style="color:var(--muted)">Content coming soon.</p>';}
LESSONS_PART[100]={titleAr:'رَابِعًا: الْفِقْهُ',titleEn:'Part Four: Fiqh (Level 2)',translit:'Rābiʿan: al-fiqh',unit:0,pages:[
  {label:'Opening Ḥadīth',p:183,c:'INTP1'},
  {label:'Map of This Book',p:0,c:'INTP2'}
]};
function INTP1(){return `
<div class="sec"><div class="sec-ar">رَابِعًا: الْفِقْهُ</div><div class="sec-translit">Rābiʿan: al-fiqh</div><div class="sec-en">Part Four: Fiqh</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — The opening of this book</div><div class="h-ar">عن معاوية ﵁ قال: قال ﷺ: «مَنْ يُرِدِ اللَّه بِهِ خَيْرًا يُفَقِّهه في الدِّين».</div><div class="h-translit">ʿAn Muʿāwiyata raḍiya-llāhu ʿanhu qāla: qāla ṣalla-llāhu ʿalayhi wa sallam: «Man yuridi-llāhu bihi khayran yufaqqihhu fi-d-dīn».</div><div class="h-en">From Muʿāwiyah (may Allah be pleased with him), who said: The Prophet ﷺ said: <strong>"Whoever Allah wants good for, He gives him deep understanding of the religion."</strong></div><div class="h-source">Agreed upon (al-Bukhārī no. 71, Muslim no. 1037)</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why does the book open with this ḥadīth?</span><div class="study-note-body">Before teaching you a single ruling, the book reminds you <strong>why</strong> you are here. Studying fiqh is not just homework. It is a <em>sign</em> that Allah wants good for you. If you are reading this, Allah opened this door for you.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">يُفَقِّهْهُ · yufaqqihhu</div><div class="study-note-body">From the same root as <strong>fiqh</strong>: ف-ق-ه (f-q-h), <strong>deep understanding</strong>. The verb form <em>faqqaha</em> means "to <strong>make</strong> someone understand deeply." So the ḥadīth says Allah Himself is the One who gives understanding. Your effort is the means; the understanding is His gift.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ What Level 2 covers</span><div class="study-note-body">Level 1 taught you <strong>how to pray</strong> (purity, wuḍūʾ, conditions and pillars of ṣalāh). Level 2 teaches what to do <strong>around and beyond</strong> the five daily prayers: fixing mistakes (sujūd as-sahw), extra prayers, prayers for rain and eclipses, praying in congregation, travelling, Jumuʿah, ʿĪd, and the funeral prayer.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">The ḥadīth doesn't say "whoever Allah wants good for, He makes rich" or "makes famous." The good He chose to mention is <strong>understanding of the religion</strong>. Sit with that: of all the gifts Allah could give, this one is named. Before each lesson, make a small duʿāʾ: <em>Allāhumma faqqihnī fi-d-dīn</em> — "O Allah, give me understanding of the religion."</div></div>
`;}
function INTP2(){
  const rows=UNITS.filter(u=>u.id>0).map(u=>`<li data-n="${u.id}"><div class="li-ar">الوحدة ${u.ordAr}: ${u.titleAr}</div><div class="li-translit">${u.translit}</div><div class="li-en">${u.titleEn} — ${u.lessons.map(l=>'Lesson '+l).join(', ')}</div></li>`).join('');
  return `<div class="sec"><div class="sec-ar">وَحَدَاتُ الْكِتَابِ</div><div class="sec-translit">Waḥadātu l-kitāb</div><div class="sec-en">The units of this book</div></div><ul class="num-list">${rows}</ul>
<div class="study-note beginner"><span class="study-note-label">💡 How to use this workbook</span><div class="study-note-body">Each lesson keeps <strong>every line of Arabic</strong> from the textbook, with transliteration and an English translation under it. The coloured notes help you: <strong>💡</strong> simple explanation, <strong>🌱</strong> word of the day, <strong>⭐</strong> remember, <strong>⚠️</strong> watch out, <strong>🤲</strong> deep reflection. Try each activity and assessment yourself before tapping "Show Answer".</div></div>`;}

// PART A — Unit 1: سجود السهو — Lessons 1 & 2 (textbook pp. 185–194)

LESSONS_PART[1] = {titleAr:'سجود السهو (حكمه - صفته)', titleEn:'The Prostration of Forgetfulness (Its Ruling and How It Is Done)', translit:'Sujūd as-sahw (ḥukmuhu – ṣifatuh)', unit:1, pages:[
  {label:'Introduction & definition', p:186, c:'L1P1'},
  {label:'Ruling, wisdom & placement', p:186, c:'L1P2'},
  {label:'How it is done', p:187, c:'L1P3'},
  {label:'Assessment', p:187, c:'L1P4'},
  {label:'📖 Vocabulary', p:0, c:'L1V', isVocab:true}
]};

LESSONS_PART[2] = {titleAr:'أسباب سجود السهو', titleEn:'The Causes of the Prostration of Forgetfulness', translit:'Asbābu sujūdi s-sahw', unit:1, pages:[
  {label:'Cause 1: Adding', p:188, c:'L2P1'},
  {label:'Cause 2: Missing a pillar', p:188, c:'L2P2'},
  {label:'Photo example: a missed pillar', p:189, c:'L2P3'},
  {label:'Missing an obligatory act', p:190, c:'L2P4'},
  {label:'Cause 3: Doubt', p:190, c:'L2P5'},
  {label:'Summary chart', p:191, c:'L2P6'},
  {label:'First tashahhud, imam & follower', p:192, c:'L2P7'},
  {label:'Follower who forgets + activity', p:193, c:'L2P8'},
  {label:'Assessment', p:194, c:'L2P9'},
  {label:'📖 Vocabulary', p:0, c:'L2V', isVocab:true}
]};

/* ===================== LESSON 1 ===================== */

function L1P1(){return `
<div class="callout"><div class="callout-label">الْوَحْدَةُ الْأُولَى · Unit One</div><div class="callout-ar">الوحدة الأولى<br>سجود السهو</div><div class="callout-translit">Al-waḥdatu l-ūlā — Sujūdu s-sahw</div><div class="callout-en"><strong>Unit One: The Prostration of Forgetfulness</strong></div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth on the unit cover</div><div class="h-ar">قال ﷺ: «إذا زاد الرجل أو نقص فليسجد سجدتين»</div><div class="h-translit">Qāla ṣallā-llāhu ʿalayhi wa sallam: «Idhā zāda r-rajulu aw naqaṣa fal-yasjud sajdatayn.»</div><div class="h-en">The Prophet ﷺ said: <strong>"If a man adds (something to his prayer) or leaves (something) out, let him prostrate two prostrations."</strong></div><div class="h-source">أخرجه مسلم برقم (٥٧٢) · Narrated by Muslim, no. 572</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What is this whole unit about?</span><div class="study-note-body">Everyone forgets things in prayer sometimes. Maybe you prayed one rakʿah too many. Maybe you forgot to sit for the first tashahhud. Maybe you lost count.<br><br>Allah gave us a simple fix: <strong>two extra prostrations</strong> called <em>sujūd as-sahw</em>. This unit teaches you when to do them and how.</div></div>

<div class="sec"><div class="sec-ar">الدرس الأول: سجود السهو (حكمه - صفته)</div><div class="sec-translit">Ad-darsu l-awwal: Sujūdu s-sahw (ḥukmuhu – ṣifatuh)</div><div class="sec-en">Lesson 1: The Prostration of Forgetfulness (Its Ruling and How It Is Done)</div></div>

<div class="sec"><div class="sec-ar">تمهيد</div><div class="sec-translit">Tamhīd</div><div class="sec-en">Introduction</div></div>

<div class="body-text"><div class="bt-label">Introduction</div><div class="bt-ar">من طبيعة الإنسان السهو والنسيان، لذا قد يقع من المصلي سهوٌ في صلاته وقد ثبت أن النبي ﷺ سها في صلاته أكثر من مرة؛ لأن السهو من مقتضى الطبيعة البشرية.</div><div class="bt-translit">Min ṭabīʿati l-insāni s-sahwu wa n-nisyān, li-dhā qad yaqaʿu mina l-muṣallī sahwun fī ṣalātih, wa qad thabata anna n-nabiyya ṣallā-llāhu ʿalayhi wa sallam sahā fī ṣalātihi akthara min marrah; li-anna s-sahwa min muqtaḍā ṭ-ṭabīʿati l-bashariyyah.</div><div class="bt-en">Forgetting and absent-mindedness are part of human nature. So a person praying may forget something in his prayer. It is firmly established that the Prophet ﷺ himself forgot in his prayer more than once, because forgetting is part of what human nature requires.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — "I am a human like you"</div><div class="h-ar">ولهذا قال ﷺ: «إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ، أَنْسَى كَمَا تَنْسَوْنَ، فَإِذَا نَسِيتُ فَذَكِّرُونِي»</div><div class="h-translit">Wa li-hādhā qāla ṣallā-llāhu ʿalayhi wa sallam: «Innamā ana basharun mithlukum, ansā kamā tansawn, fa-idhā nasītu fa-dhakkirūnī.»</div><div class="h-en">And for this reason he ﷺ said: <strong>"I am only a human being like you. I forget just as you forget. So when I forget, remind me."</strong></div><div class="h-source">أخرجه مسلم برقم (٥٧٢) · Narrated by Muslim, no. 572</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Did the Prophet ﷺ really forget?</span><div class="study-note-body">Yes, in small matters of the prayer, like how many rakʿahs he had prayed. He never forgot anything of the message Allah sent him to deliver.<br><br>His forgetting was a <strong>teaching moment</strong>. Because he forgot, he showed us exactly what to do when we forget. Without that, we would not know how to fix our own mistakes.</div></div>

<div class="activity" id="act1p1">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act1p1'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act1p1'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt">I reflect on the wisdom behind the Prophet ﷺ forgetting (in prayer).</div><div class="act-ar">أتأمّل الحكمة من وقوع السهو من النبي ﷺ.</div><div class="act-translit">Ataʾammalu l-ḥikmata min wuqūʿi s-sahwi mina n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Some wisdoms we can draw from the lesson:<br>1. <strong>To teach us the rulings of forgetfulness</strong>: through his forgetting, the Ummah learned how to do sujūd as-sahw.<br>2. <strong>To show he is a human being</strong> ("I am only a human like you"), so no one raises him above his rank.<br>3. <strong>To comfort us</strong>: if the best of creation forgot, then forgetting is not a sign that our prayer is worthless. We simply fix it the way he showed us.</div></div>
</div>

<div class="sec"><div class="sec-ar">تعريفه</div><div class="sec-translit">Taʿrīfuh</div><div class="sec-en">Its Definition</div></div>

<div class="defbox"><div class="defbox-tag">📌 Definition</div><div class="defbox-body"><div class="defbox-ar">السهو: هو النسيان ومعنى سجود السهو سجدتان يسجدهما المصلي آخر صلاته إذا حصل منه سهو بزيادة أو نقص أو شك في الصلاة.</div><div class="defbox-translit">As-sahw: huwa n-nisyān, wa maʿnā sujūdi s-sahwi sajdatāni yasjuduhumā l-muṣallī ākhira ṣalātihi idhā ḥaṣala minhu sahwun bi-ziyādatin aw naqṣin aw shakkin fi ṣ-ṣalāh.</div><div class="defbox-en"><strong>As-sahw</strong> means forgetting. <strong>Sujūd as-sahw</strong> means two prostrations that the person praying makes at the end of the prayer, if he forgot something by <strong>adding</strong>, <strong>leaving out</strong>, or <strong>doubting</strong> in the prayer.</div></div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">سَهْو · sahw</div><div class="study-note-body">From the root س-ه-و (s-h-w): <strong>to be heedless, to have the mind drift away</strong> from something. It is that moment when your mind wanders and you lose track.<br><br>The verb is <em>sahā</em> (سَهَا) = "he forgot / his mind slipped". You saw it above: <em>sahā fī ṣalātih</em>, "he forgot in his prayer".</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Three triggers to remember</span><div class="study-note-body">Sujūd as-sahw is for three situations:<br><strong>Ziyādah</strong> (زيادة) = adding something<br><strong>Naqṣ</strong> (نقص) = leaving something out<br><strong>Shakk</strong> (شك) = doubting<br><br>Memory hook: <em>Add, Drop, Doubt.</em></div></div>
`;}

function L1P2(){return `
<div class="sec"><div class="sec-ar">حُكمه</div><div class="sec-translit">Ḥukmuh</div><div class="sec-en">Its Ruling</div></div>

<div class="defbox"><div class="defbox-tag gold">⚖️ Ruling</div><div class="defbox-body"><div class="defbox-ar">يُشرع سجود السهو عند حدوث السهو في الصلاة، بزيادة، أو نقص، أو شك.</div><div class="defbox-translit">Yushraʿu sujūdu s-sahwi ʿinda ḥudūthi s-sahwi fi ṣ-ṣalāh, bi-ziyādah, aw naqṣ, aw shakk.</div><div class="defbox-en">Sujūd as-sahw is <strong>legislated</strong> (made part of the religion) when forgetfulness happens in the prayer, whether by adding, leaving out, or doubting.</div></div></div>

<div class="sec"><div class="sec-ar">الحكمة من مشروعيته</div><div class="sec-translit">Al-ḥikmatu min mashrūʿiyyatih</div><div class="sec-en">The Wisdom Behind It</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">جبر النقص الواقع في الصلاة.</div><div class="li-translit">Jabru n-naqṣi l-wāqiʿi fi ṣ-ṣalāh.</div><div class="li-en">To <strong>mend the shortfall</strong> that happened in the prayer.</div></li>
<li data-n="2"><div class="li-ar">إرغام الشيطان.</div><div class="li-translit">Irghāmu sh-shayṭān.</div><div class="li-en">To <strong>humiliate Shayṭān</strong> (to defeat him and rub his nose in the dust).</div></li>
</ol>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">إِرْغَام · irghām</div><div class="study-note-body">From the root ر-غ-م (r-gh-m). <em>Ar-ragham</em> means dust or soil. <em>Irghām</em> literally means "to rub someone's nose in the dust", to defeat and humble him.<br><br>Shayṭān tries to distract you so your prayer is spoiled. When you answer his trick with <em>more</em> prostration, he loses twice.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Think about what Allah could have said: "If you make a mistake, your prayer is ruined. Start again." Instead, He gave us a gentle repair: two prostrations.<br><br>And notice what the repair is. It is <strong>sujūd</strong>, the moment we are closest to our Lord. Our forgetting becomes a reason to bow lower and draw nearer.<br><br><em>Question to sit with:</em> When I make a mistake in my worship, do I give up in frustration, or do I fix it calmly the way Allah taught, trusting His mercy?</div></div>

<div class="sec"><div class="sec-ar">محله</div><div class="sec-translit">Maḥalluh</div><div class="sec-en">Its Place (Before or After the Salām)</div></div>

<div class="body-text"><div class="bt-label">Before or after salām?</div><div class="bt-ar">يجوز السجود للسهو قبل السلام أوبعده.<br>لكن الأفضل أن يكون السجود للسهو قبل السلام إلا في موضعين:</div><div class="bt-translit">Yajūzu s-sujūdu li-s-sahwi qabla s-salāmi aw baʿdah.<br>Lākinna l-afḍala an yakūna s-sujūdu li-s-sahwi qabla s-salāmi illā fī mawḍiʿayn:</div><div class="bt-en">It is allowed to do the prostration of forgetfulness <strong>before the salām or after it</strong>.<br>But it is <strong>better to do it before the salām</strong>, except in two situations:</div></div>

<div class="point"><span class="point-num">1</span><div class="point-ar">الأول: إذا سلم عن نقص ركعة فأكثر، فإن الأفضل أن يكون سجود السهو بعد إكمال الصلاة والسلام منها.</div><div class="point-translit">Al-awwal: idhā sallama ʿan naqṣi rakʿatin fa-akthar, fa-inna l-afḍala an yakūna sujūdu s-sahwi baʿda ikmāli ṣ-ṣalāti wa s-salāmi minhā.</div><div class="point-en"><strong>First:</strong> if he gave salām while still missing one rakʿah or more, then it is better that the prostration of forgetfulness comes <strong>after</strong> he completes the prayer and gives salām from it.</div></div>

<div class="point"><span class="point-num">2</span><div class="point-ar">الثاني: إذا شك في صلاته فلم يدر كم صلى ثلاثًا أم أربعًا في الرباعية، أو اثنتين أو ثلاثًا في المغرب، أو واحدة أو ثنتين في الفجر، لكنه غلب على ظنه أحد الأمرين وعمل بظنه: وهو النقص، أو التمام، فإنه يبني على غالب ظنه ويكون سجوده بعد السلام.</div><div class="point-translit">Ath-thānī: idhā shakka fī ṣalātihi fa-lam yadri kam ṣallā thalāthan am arbaʿan fi r-rubāʿiyyah, awi thnatayni aw thalāthan fi l-maghrib, aw wāḥidatan aw thintayni fi l-fajr, lākinnahu ghalaba ʿalā ẓannihi aḥadu l-amrayni wa ʿamila bi-ẓannih: wa huwa n-naqṣ, awi t-tamām, fa-innahu yabnī ʿalā ghālibi ẓannihi wa yakūnu sujūduhu baʿda s-salām.</div><div class="point-en"><strong>Second:</strong> if he doubts in his prayer and does not know how many he prayed (three or four in a four-rakʿah prayer, two or three in Maghrib, one or two in Fajr), but one of the two options feels <strong>more likely</strong> to him and he acts on that (whether it is the lesser number or the complete number), then he builds on what he most likely thinks, and his prostration comes <strong>after the salām</strong>.</div></div>

<div class="body-text"><div class="bt-label">Footnote (source)</div><div class="bt-ar">ينظر: «مجموع فتاوى ومقالات متنوعة» لسماحة الشيخ عبدالعزيز بن باز – رحمه الله – (١١/٢٦٧).</div><div class="bt-translit">Yunẓar: «Majmūʿu fatāwā wa maqālātin mutanawwiʿah» li-samāḥati sh-shaykh ʿAbdi l-ʿAzīz ibn Bāz – raḥimahu-llāh – (11/267).</div><div class="bt-en">See: <em>Majmūʿ Fatāwā wa Maqālāt Mutanawwiʿah</em> by His Eminence Shaykh ʿAbd al-ʿAzīz ibn Bāz (may Allah have mercy on him), vol. 11, p. 267.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Before or after? Quick rule</span><div class="study-note-body">Default: <strong>before salām</strong> (both are allowed, before is better).<br>Two exceptions, where <strong>after salām</strong> is better:<br>1. You gave salām too early, missing a whole rakʿah or more.<br>2. You doubted, and you went with what you <em>most likely</em> thought.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Don't panic about the timing</span><div class="study-note-body">The book says <strong>both are allowed</strong>. If you prostrate before salām in a case where "after" was better, your prayer is still fine. The "before / after" detail is about what is <em>better</em>, not about valid vs. invalid.</div></div>
`;}

function L1P3(){return `
<div class="sec"><div class="sec-ar">صفته</div><div class="sec-translit">Ṣifatuh</div><div class="sec-en">How It Is Done</div></div>

<div class="body-text"><div class="bt-label">Description</div><div class="bt-ar">سجود السهو كالسجود في الصلاة؛ في التكبير عند السجود، والرفع منه، وما يقال فيه حال السجود وبين السجدتين، ويسلِّم بعد السجدة الثانية من غير تشهد بعده.</div><div class="bt-translit">Sujūdu s-sahwi ka-s-sujūdi fi ṣ-ṣalāh; fi t-takbīri ʿinda s-sujūd, wa r-rafʿi minh, wa mā yuqālu fīhi ḥāla s-sujūdi wa bayna s-sajdatayn, wa yusallimu baʿda s-sajdati th-thāniyati min ghayri tashahhudin baʿdah.</div><div class="bt-en">The prostration of forgetfulness is <strong>just like the prostration in prayer</strong>: saying takbīr when going down, (saying takbīr when) rising from it, and saying the same words in prostration and between the two prostrations. Then he gives salām after the second prostration, <strong>without a tashahhud after it</strong>.</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">التكبير عند السجود</div><div class="li-translit">At-takbīru ʿinda s-sujūd</div><div class="li-en">Say "Allāhu akbar" and go down into the first prostration.</div></li>
<li data-n="2"><div class="li-ar">والرفع منه</div><div class="li-translit">Wa r-rafʿu minh</div><div class="li-en">Say "Allāhu akbar" and sit up, saying what you normally say between two prostrations.</div></li>
<li data-n="3"><div class="li-ar">وما يقال فيه حال السجود وبين السجدتين</div><div class="li-translit">Wa mā yuqālu fīhi ḥāla s-sujūdi wa bayna s-sajdatayn</div><div class="li-en">Say "Allāhu akbar", make the second prostration with the usual words, then rise with takbīr.</div></li>
<li data-n="4"><div class="li-ar">ويسلِّم بعد السجدة الثانية من غير تشهد بعده</div><div class="li-translit">Wa yusallimu baʿda s-sajdati th-thāniyah min ghayri tashahhudin baʿdah</div><div class="li-en">Give salām. No new tashahhud after these two prostrations.</div></li>
</ol>

<div class="study-note beginner"><span class="study-note-label">💡 Do I need to learn special words?</span><div class="study-note-body">No! The book says it is <strong>like the normal prostration</strong>. So you say the same things you already know: <em>"Subḥāna rabbiya l-aʿlā"</em> in sujūd, and <em>"Rabbi ghfir lī"</em> between the two prostrations. Nothing new to memorise.</div></div>

<div class="callout rust"><div class="callout-label">A reminder from the book</div><div class="callout-ar">على المسلم أن يكون حاضرَ القلب حال صلاته، خاشعًا فيها ما أمكنه، وعليه مدافعة الهواجس التي تشغله بسبب وسوسة الشيطان له.</div><div class="callout-translit">ʿAla l-muslimi an yakūna ḥāḍira l-qalbi ḥāla ṣalātih, khāshiʿan fīhā mā amkanah, wa ʿalayhi mudāfaʿatu l-hawājisi llatī tashghaluhu bi-sababi waswasati sh-shayṭāni lah.</div><div class="callout-en">A Muslim should keep his <strong>heart present</strong> during his prayer, humble and focused in it as much as he can. He must <strong>push away the stray thoughts</strong> that distract him because of Shayṭān's whispering.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Sujūd as-sahw is a repair, but the book reminds us that the real goal is a <strong>present heart</strong>. The fix is there for when we slip. It is not permission to drift.<br><br>Many forgetful moments come from a wandering mind. When a stray thought comes in prayer, gently bring yourself back to the words you are saying.<br><br><em>Question to sit with:</em> What usually pulls my heart away in prayer, and what is one small thing I can do before my next ṣalāh to come to it more present?</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Common mistake</span><div class="study-note-body">Some people add a full tashahhud again after sujūd as-sahw. The book says he gives salām after the second prostration <strong>without a tashahhud after it</strong>.</div></div>
`;}

function L2P1(){return `

<div class="body-text"><div class="bt-label">Example</div><div class="bt-ar">المثال: صلّى أحمد صلاة المغرب أربع ركعات سهوًا، ولم يتنبّه لذلك إلا في آخر صلاته.<br>من خلال هذا المثال تبيَّن أن السهو هنا كان بسبب زيادة ركعة في الصلاة.</div><div class="bt-translit">Al-mithāl: ṣallā Aḥmadu ṣalāta l-maghribi arbaʿa rakaʿātin sahwan, wa lam yatanabbah li-dhālika illā fī ākhiri ṣalātih.<br>Min khilāli hādha l-mithāli tabayyana anna s-sahwa hunā kāna bi-sababi ziyādati rakʿatin fi ṣ-ṣalāh.</div><div class="bt-en"><strong>Example:</strong> Aḥmad prayed Maghrib as <strong>four</strong> rakʿahs by mistake, and did not notice until the end of his prayer.<br>From this example it is clear that the forgetfulness here was caused by <strong>adding a rakʿah</strong> to the prayer.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Cause 1 in one line</span><div class="study-note-body"><strong>Added something by mistake?</strong> → Two prostrations for forgetfulness (the book says before salām).</div></div>

function L2P2(){return `
<div class="sec"><div class="sec-ar">السبب الثاني: النقص</div><div class="sec-translit">As-sababu th-thānī: an-naqṣ</div><div class="sec-en">The Second Cause: Leaving Something Out</div></div>

<div class="body-text"><div class="bt-label">Example</div><div class="bt-ar">المثال: صلى هشام صلاة الفجر؛ فنسي الركوع في الركعة الثانية، وسجد بعد القراءة.<br>من خلال هذا المثال تبيّن أن السهو هنا كان بسبب نقص ركن من أركان الصلاة وهو الركوع.</div><div class="bt-translit">Al-mithāl: ṣallā Hishāmun ṣalāta l-fajr; fa-nasiya r-rukūʿa fi r-rakʿati th-thāniyah, wa sajada baʿda l-qirāʾah.<br>Min khilāli hādha l-mithāli tabayyana anna s-sahwa hunā kāna bi-sababi naqṣi ruknin min arkāni ṣ-ṣalāti wa huwa r-rukūʿ.</div><div class="bt-en"><strong>Example:</strong> Hishām prayed Fajr. He forgot the rukūʿ in the second rakʿah and went into sujūd straight after the recitation.<br>From this example it is clear that the forgetfulness here was caused by <strong>leaving out a pillar</strong> of the prayer, namely the rukūʿ.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">رُكْن · rukn</div><div class="study-note-body">Root ر-ك-ن (r-k-n): a <strong>corner pillar</strong> of a building, the strongest side that holds it up. Plural: <em>arkān</em> (أركان).<br><br>A <em>rukn</em> of prayer is a part the prayer cannot stand without, like rukūʿ, sujūd, or reciting al-Fātiḥah. Don't mix it up with <em>rukūʿ</em> (bowing), which sounds similar.</div></div>

<div class="activity" id="act2p2">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act2p2'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act2p2'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt">I give other examples: 1 – Leaving out one of the two prostrations in a rakʿah by mistake. 2 – ……</div><div class="act-ar">أُمثِّل بأمثلة أخرى: ١ – ترك إحدى السجدتين في ركعةٍ سهوًا. ٢ – ......</div><div class="act-translit">Umaththilu bi-amthilatin ukhrā: 1 – tarku iḥda s-sajdatayni fī rakʿatin sahwan. 2 – ……</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Possible examples:<br>• Forgetting to <strong>recite al-Fātiḥah</strong> in a rakʿah (<span dir="rtl" lang="ar">نسيان قراءة الفاتحة</span>, from the summary chart).<br>• Forgetting the <strong>sitting between the two prostrations</strong> (as in the photo example on the next tab).</div></div>
</div>

<div class="body-text"><div class="bt-label">What follows from leaving out a pillar</div><div class="bt-ar">ويترتب على النقص بترك أحد الأركان سهوًا:<br>الرجوع إلى الركن المتروك والإتيان به وبما بعده، ويكمل صلاته، ويسجد للسهو.<br>أما إذا ذكره بعد ما شرع في قراءة ركعةٍ أخرى فإن الركعة التي نسي فيها الركن تبطل، وتقوم الركعة الثانية مقامها ويسجد للسهو.</div><div class="bt-translit">Wa yatarattabu ʿala n-naqṣi bi-tarki aḥadi l-arkāni sahwan:<br>Ar-rujūʿu ila r-rukni l-matrūki wa l-ityānu bihi wa bi-mā baʿdah, wa yukmilu ṣalātah, wa yasjudu li-s-sahw.<br>Ammā idhā dhakarahu baʿda mā sharaʿa fī qirāʾati rakʿatin ukhrā fa-inna r-rakʿata llatī nasiya fīha r-rukna tabṭul, wa taqūmu r-rakʿatu th-thāniyatu maqāmahā wa yasjudu li-s-sahw.</div><div class="bt-en">What results from leaving out a pillar by mistake:<br>• He <strong>goes back</strong> to the pillar he left out, does it, and does what comes after it. Then he completes his prayer and makes sujūd as-sahw.<br>• But if he remembers it <strong>after he has started reciting in the next rakʿah</strong>, then the rakʿah in which he forgot the pillar is <strong>cancelled</strong>, the next rakʿah takes its place, and he makes sujūd as-sahw.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why go back for a pillar?</span><div class="study-note-body">A pillar is like a wall holding up a house. Two prostrations cannot replace a missing wall. So you must <strong>actually do</strong> the missing pillar.<br><br>Apply it to Hishām: he forgot rukūʿ and went into sujūd. If he remembers while in sujūd, he gets up, does rukūʿ, then everything after it (rising, sujūd…), finishes, and makes sujūd as-sahw.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ The "point of no return"</span><div class="study-note-body">The turning point is <strong>starting the recitation of the next rakʿah</strong>. Before that point, go back. After that point, don't go back: the faulty rakʿah is dropped, and the one you are in counts in its place. Either way, finish with sujūd as-sahw.</div></div>
`;}

</div>

<div class="body-text"><div class="bt-label">What follows from leaving out a wājib</div><div class="bt-ar">ويترتب على النقص بترك أحد الواجبات سهوًا: أن يسجد سجدتين، جبرًا للخلل الحاصل في الصلاة وهو نقص أحد واجباتها.</div><div class="bt-translit">Wa yatarattabu ʿala n-naqṣi bi-tarki aḥadi l-wājibāti sahwan: an yasjuda sajdatayn, jabran li-l-khalali l-ḥāṣili fi ṣ-ṣalāti wa huwa naqṣu aḥadi wājibātihā.</div><div class="bt-en">What results from leaving out a wājib by mistake: he makes <strong>two prostrations</strong>, to mend the flaw that happened in the prayer, which is missing one of its obligatory acts.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth of ʿAbdullāh ibn Buḥaynah</div><div class="h-ar">ويدل على ذلك حديث عبدِالله بن بُحَيْنَةَ ﵁: «أَنَّ النَّبِيَّ ﷺ صَلَّى بِهِمْ الظُّهْرَ فَقَامَ فِي الرَّكْعَتَيْنِ الْأُولَيَيْنِ، وَلَمْ يَجْلِسْ. فَقَامَ النَّاسُ مَعَهُ، حَتَّى إذا قَضَى الصَّلَاةَ، وَانْتَظَرَ النَّاسُ تَسْلِيمَهُ: كَبَّرَ وَهُوَ جَالِسٌ. فَسَجَدَ سَجْدَتَيْنِ قَبْلَ أَنْ يُسَلِّمَ ثُمَّ سَلَّمَ»</div><div class="h-translit">Wa yadullu ʿalā dhālika ḥadīthu ʿAbdi-llāhi bni Buḥaynata raḍiya-llāhu ʿanh: «Anna n-nabiyya ṣallā-llāhu ʿalayhi wa sallama ṣallā bihimu ẓ-ẓuhra fa-qāma fi r-rakʿatayni l-ūlayayn, wa lam yajlis. Fa-qāma n-nāsu maʿah, ḥattā idhā qaḍa ṣ-ṣalāh, wa ntaẓara n-nāsu taslīmah: kabbara wa huwa jālis. Fa-sajada sajdatayni qabla an yusallima thumma sallam.»</div><div class="h-en">The evidence is the ḥadīth of ʿAbdullāh ibn Buḥaynah (may Allah be pleased with him): <strong>"The Prophet ﷺ led them in Ẓuhr. He stood up after the first two rakʿahs and did not sit. The people stood up with him. When he had finished the prayer, and the people were waiting for his salām, he said takbīr while sitting, made two prostrations before giving salām, and then gave salām."</strong></div><div class="h-source">أخرجه البخاري برقم (١٢٣٠)، ومسلم برقم (٥٧٠) · Narrated by al-Bukhārī, no. 1230, and Muslim, no. 570</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What's the difference between a rukn and a wājib?</span><div class="study-note-body">Both are required, but they are fixed differently when forgotten:<br>• <strong>Rukn (pillar)</strong> forgotten → you must <strong>do it</strong> (go back, or drop the rakʿah), <em>and</em> make sujūd as-sahw.<br>• <strong>Wājib (obligatory act)</strong> forgotten → the two prostrations of sujūd as-sahw <strong>are enough</strong> to repair it. No going back needed.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Picture the scene in this ḥadīth. The Prophet ﷺ forgets, and the whole congregation stands with him. Nobody breaks away. He simply makes two prostrations at the end, and the prayer is complete.<br><br>There is a quiet lesson in unity here. The followers stayed with their imam even in his mistake, and Allah's repair covered everyone.<br><br><em>Question to sit with:</em> Can I be gentle with others' mistakes, the way Allah is gentle with ours?</div></div>
`;}

function L2P5(){return `
<div class="sec"><div class="sec-ar">السبب الثالث: الشك</div><div class="sec-translit">As-sababu th-thālith: ash-shakk</div><div class="sec-en">The Third Cause: Doubt</div></div>

<div class="body-text"><div class="bt-label">Example</div><div class="bt-ar">المثال: صلّى عبدالله العشاء، وفي أثنائها شَكَّ هل صلّى ثلاث ركعات أم أربعًا.<br>من خلال هذا المثال تبيّن أن السهو هنا كان بسبب الشك في عدد الركعات.</div><div class="bt-translit">Al-mithāl: ṣallā ʿAbdu-llāhi l-ʿishāʾ, wa fī athnāʾihā shakka hal ṣallā thalātha rakaʿātin am arbaʿā.<br>Min khilāli hādha l-mithāli tabayyana anna s-sahwa hunā kāna bi-sababi sh-shakki fī ʿadadi r-rakaʿāt.</div><div class="bt-en"><strong>Example:</strong> ʿAbdullāh prayed ʿIshāʾ, and in the middle of it he doubted: had he prayed three rakʿahs or four?<br>From this example it is clear that the forgetfulness here was caused by <strong>doubt about the number of rakʿahs</strong>.</div></div>

<div class="activity" id="act2p5">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act2p5'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act2p5'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt">I give other examples: 1 – …… 2 – ……</div><div class="act-ar">أُمثّل بأمثلة أخرى: ١ – ...... ٢ – ......</div><div class="act-translit">Umaththilu bi-amthilatin ukhrā: 1 – …… 2 – ……</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Possible examples:<br>1. Doubting in Fajr: did I pray <strong>one or two</strong> rakʿahs?<br>2. Doubting whether you made <strong>one prostration or two</strong> in a rakʿah (this one appears in the activity table later).</div></div>
</div>

<div class="body-text"><div class="bt-label">What follows from doubt</div><div class="bt-ar">ويترتب على الشكِّ في الصلاة: أن يتحرَّى المصلّي الصواب:<br>أ– فإن ترجّح له شيء بقرينةٍ عمل به، وسجد للسهو.</div><div class="bt-translit">Wa yatarattabu ʿala sh-shakki fi ṣ-ṣalāh: an yataḥarra l-muṣalli ṣ-ṣawāb:<br>A – fa-in tarajjaḥa lahu shayʾun bi-qarīnatin ʿamila bih, wa sajada li-s-sahw.</div><div class="bt-en">What results from doubt in the prayer: the person praying <strong>tries hard to find what is correct</strong> (taḥarrī):<br>(a) If one option becomes <strong>more likely</strong> to him because of some sign, he acts on it and makes sujūd as-sahw.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth of Ibn Masʿūd — "let him aim for what is correct"</div><div class="h-ar">ويدلّ على ذلك حديث ابن مسعود ﵁: قال رسول الله ﷺ: «وإذا شك أحدكم في صلاته فَلْيَتَحَرَّ الصوابَ فليتمّ عليه ثم ليسلّم ثم ليسجد سجدتين»</div><div class="h-translit">Wa yadullu ʿalā dhālika ḥadīthu bni Masʿūdin raḍiya-llāhu ʿanh: qāla rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallam: «Wa idhā shakka aḥadukum fī ṣalātihi fal-yataḥarra ṣ-ṣawāba fal-yutimma ʿalayh, thumma li-yusallim, thumma l-yasjud sajdatayn.»</div><div class="h-en">The evidence is the ḥadīth of Ibn Masʿūd (may Allah be pleased with him): the Messenger of Allah ﷺ said: <strong>"And if one of you doubts in his prayer, let him aim for what is correct and complete (his prayer) on that basis, then give salām, then make two prostrations."</strong></div><div class="h-source">أخرجه البخاري برقم (٤٠١)، ومسلم برقم (٥٧٢) · Narrated by al-Bukhārī, no. 401, and Muslim, no. 572</div></div>

<div class="body-text"><div class="bt-label">Case (b)</div><div class="bt-ar">ب – ألا يترجح له شيء، فيبني على اليقين، وهو الأقل، ويسجد للسهو.</div><div class="bt-translit">B – allā yatarajjaḥa lahu shayʾ, fa-yabnī ʿala l-yaqīn, wa huwa l-aqall, wa yasjudu li-s-sahw.</div><div class="bt-en">(b) If <strong>nothing</strong> becomes more likely to him, he builds on <strong>certainty</strong>, which is the <strong>lesser number</strong>, and makes sujūd as-sahw.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth of Abū Saʿīd al-Khudrī — "throw away the doubt"</div><div class="h-ar">ويدلُّ على ذلك حديث أبي سعيد الخدري ﵁ قال: قال رسول الله ﷺ: «إذا شكَّ أحدكم في صلاته فلم يدرِ كم صلّى، أثلاثًا أم أربعًا؟ فليطرح الشكَّ وَلْيَبْنِ على ما استيقن، ثم يسجد سجدتين قبل أن يسلّم»</div><div class="h-translit">Wa yadullu ʿalā dhālika ḥadīthu Abī Saʿīdini l-Khudriyyi raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣallā-llāhu ʿalayhi wa sallam: «Idhā shakka aḥadukum fī ṣalātihi fa-lam yadri kam ṣallā, a-thalāthan am arbaʿā? Fal-yaṭraḥi sh-shakka wa l-yabni ʿalā ma stayqan, thumma yasjudu sajdatayni qabla an yusallim.»</div><div class="h-en">The evidence is the ḥadīth of Abū Saʿīd al-Khudrī (may Allah be pleased with him), who said: the Messenger of Allah ﷺ said: <strong>"If one of you doubts in his prayer and does not know how many he has prayed, three or four, let him throw away the doubt and build on what he is certain of, then make two prostrations before he gives salām."</strong></div><div class="h-source">أخرجه مسلم برقم (٥٧١) · Narrated by Muslim, no. 571</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What does "build on certainty" look like?</span><div class="study-note-body">You are in ʿIshāʾ and you can't tell: 3 or 4? Nothing tips the balance.<br>What are you <em>sure</em> of? At least <strong>3</strong>. So you take 3, pray one more rakʿah, and make sujūd as-sahw.<br><br>But if something helps you decide (for example, you clearly remember reciting a particular sūrah in what must have been the 4th), you act on that stronger likelihood.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Doubt — two roads</span><div class="study-note-body">First, <strong>try to work it out</strong> (taḥarrī).<br>• One side seems stronger → act on it + sujūd as-sahw (the book's Lesson 1 says after salām is better here).<br>• Still 50/50 → take the <strong>lower number</strong> + sujūd as-sahw (before salām, as in Abū Saʿīd's ḥadīth).</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">"Throw away the doubt and build on what you are certain of." These are words for the prayer, but they are also a gift for the heart.<br><br>Shayṭān loves to fill us with endless "what ifs", making us repeat our wuḍūʾ and prayers again and again. The Prophet ﷺ gave a clear exit: <strong>hold on to what is certain, let the doubt go</strong>, and leave the rest to Allah.<br><br><em>Question to sit with:</em> Where in my worship am I carrying doubts that the Sunnah has already told me to put down?</div></div>
`;}

<div class="body-text"><div class="bt-label">The general rule</div><div class="bt-ar">يجب على المأموم غير المسبوق أن يتابع إمامه في سجود السهو، أما إذا كان المأموم مسبوقًا وسها الإمام فله حالتان</div><div class="bt-translit">Yajibu ʿala l-maʾmūmi ghayri l-masbūqi an yutābiʿa imāmahu fī sujūdi s-sahw, ammā idhā kāna l-maʾmūmu masbūqan wa saha l-imāmu fa-lahu ḥālatān.</div><div class="bt-en">A follower who is <strong>not a latecomer</strong> must follow his imam in sujūd as-sahw. But if the follower is a <strong>latecomer (masbūq)</strong> and the imam forgets, he has two cases:</div></div>

<li><span dir="rtl" lang="ar">أن يكون سجود الإمام للسهو بعد السلام فإن أمكن المأموم السجود مع إمامه قبل أن يقوم لقضاء ما عليه فَعَل ذلك، أما إن قام لإكمال صلاته قبل سجود إمامه للسهو فقد انفصل عن الإمام بذلك فلا يسجد مع الإمام حين سجوده للسهو، ويسجد للسهو بعد قضائه ما عليه.</span><br><em>An yakūna sujūdu l-imāmi li-s-sahwi baʿda s-salām; fa-in amkana l-maʾmūma s-sujūdu maʿa imāmihi qabla an yaqūma li-qaḍāʾi mā ʿalayhi faʿala dhālik, ammā in qāma li-ikmāli ṣalātihi qabla sujūdi imāmihi li-s-sahwi fa-qadi nfaṣala ʿani l-imāmi bi-dhālik, fa-lā yasjudu maʿa l-imāmi ḥīna sujūdihi li-s-sahw, wa yasjudu li-s-sahwi baʿda qaḍāʾihi mā ʿalayh.</em><br>The imam's sujūd as-sahw is <strong>after salām</strong>. If the follower can prostrate with his imam before standing up to make up what he missed, he does so. But if he has already stood up to complete his prayer before the imam's sujūd as-sahw, he has separated from the imam by that. So he does not prostrate with the imam when the imam does sujūd as-sahw; instead he makes sujūd as-sahw <strong>after making up what he missed</strong>.</li>

<div class="hadith"><div class="hadith-label">Ḥadīth Qudsī — the unit cover</div><div class="h-ar">عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: قال الله تعالى: «وما يَزالُ عَبْدِي يَتَقَرّبُ إلَيّ بالنّوافِلِ حتّى أُحِبّهُ»</div><div class="h-translit">ʿAn Abī Hurayrata raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: qāla-llāhu taʿālā: «Wa mā yazālu ʿabdī yataqarrabu ilayya bi-n-nawāfili ḥattā uḥibbah.»</div><div class="h-en">Abū Hurayrah (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: Allah the Exalted said: <strong>"My servant keeps coming closer to Me through voluntary (extra) deeds until I love him."</strong></div><div class="h-source">أخرجه البخاري برقم (٦٥٠٢) · Narrated by al-Bukhārī, no. 6502</div></div>

<div class="sec"><div class="sec-ar">الدرس الثالث: صلاة التطوّع (١)</div><div class="sec-translit">Ad-darsu th-thālith: Ṣalātu t-taṭawwuʿ (1)</div><div class="sec-en">Lesson Three: Voluntary Prayer (1)</div></div>

<div class="body-text"><div class="bt-label">تمهيد · Introduction</div><div class="bt-ar">من رحمة الله تعالى بعباده أن شرع لهم ما يجبر النقص في عبادتهم، ومن ذلك التطوع بعبادةٍ من جنس العبادة التي وقع النقص منها.</div><div class="bt-translit">Min raḥmati-llāhi taʿālā bi-ʿibādihi an sharaʿa lahum mā yajburu n-naqṣa fī ʿibādatihim, wa min dhālika t-taṭawwuʿu bi-ʿibādatin min jinsi l-ʿibādati llatī waqaʿa n-naqṣu minhā.</div><div class="bt-en">From Allah’s mercy to His servants is that He gave them a way to <strong>repair what is missing</strong> in their worship. One example: doing an extra (voluntary) act of worship of the <strong>same kind</strong> as the worship that had a shortfall.</div></div>

<div class="sec"><div class="sec-ar">الحكمة من مشروعية التطوع</div><div class="sec-translit">Al-ḥikmatu min mashrūʿiyyati t-taṭawwuʿ</div><div class="sec-en">The Wisdom Behind Voluntary Worship</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Extra prayer completes the obligatory</div><div class="h-ar">عن تميم بن أوس الداري ﵁ قال: قال رسول الله ﷺ: «أول ما يحاسب به العبد صلاته، فإن كان أتمها كتبت له تامّة، وإن لم يكن أتمها قال الله عزوجل: انظروا هل تجدون لعبدي من تطوّع فتكملوا بها فريضته»</div><div class="h-translit">ʿAn Tamīmi bni Awsin ad-Dāriyyi raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Awwalu mā yuḥāsabu bihi l-ʿabdu ṣalātuh, fa-in kāna atammahā kutibat lahu tāmmah, wa in lam yakun atammahā qāla-llāhu ʿazza wa jall: unẓurū hal tajidūna li-ʿabdī min taṭawwuʿin fa-tukmilū bihā farīḍatah.»</div><div class="h-en">Tamīm ibn Aws ad-Dārī (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: <strong>"The first thing a servant will be taken to account for is his prayer. If he completed it, it is written for him as complete. If he did not complete it, Allah, Mighty and Majestic, says: ‘Look — do you find any voluntary prayer for My servant? Then complete his obligatory prayer with it.’"</strong></div><div class="h-source">أخرجه أبو داود برقم (٨٦٤)، وابن ماجه برقم (١٤٢٥)، وأحمد برقم (٩٤٩٤)، واللفظ له، وصححه الألباني في صحيح الجامع برقم (٢٥٧١) · Narrated by Abū Dāwūd (864), Ibn Mājah (1425) and Aḥmad (9494) — this wording is his; graded ṣaḥīḥ by al-Albānī in Ṣaḥīḥ al-Jāmiʿ (2571)</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What is this ḥadīth teaching?</span><div class="study-note-body">On the Day of Judgement, prayer is checked <strong>first</strong>. If your obligatory prayers had gaps (rushing, losing focus, small mistakes), Allah Himself asks: "Does My servant have any extra prayers?" — and those extras are used to <strong>fill the gaps</strong>.<br><br>So your sunnah prayers are like a savings account you’ll be very glad to have on that Day.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth Qudsī — Extra deeds bring Allah’s love</div><div class="h-ar">عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: قال الله تعالى: «وما يزال عبدي يتقرّب إليّ بالنوافل حتى أحبّه»</div><div class="h-translit">ʿAn Abī Hurayrata raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: qāla-llāhu taʿālā: «Wa mā yazālu ʿabdī yataqarrabu ilayya bi-n-nawāfili ḥattā uḥibbah.»</div><div class="h-en">Abū Hurayrah (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: Allah the Exalted said: <strong>"My servant keeps drawing near to Me with voluntary deeds until I love him."</strong></div><div class="h-source">أخرجه البخاري برقم (٦٥٠٢) · Narrated by al-Bukhārī, no. 6502</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Two wisdoms from two ḥadīths</span><div class="study-note-body">1. <strong>Repair:</strong> voluntary prayer completes what is missing in the obligatory prayer.<br>2. <strong>Closeness:</strong> voluntary prayer brings you nearer to Allah until He loves you.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — A house in Paradise</div><div class="h-ar">عن أم حبيبة رضي الله عنها قالت: قال رسول الله ﷺ: «من صلى في يومٍ وليلةٍ ثِنْتَيْ عشرة ركعة بُني له بيت في الجنة: أربعًا قبل الظهر، وركعتين بعدها، وركعتينٍ بعد المغرب، وركعتين بعد العشاء، وركعتين قبل الفجر»</div><div class="h-translit">ʿAn Ummi Ḥabībata raḍiya-llāhu ʿanhā qālat: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Man ṣallā fī yawmin wa laylatin thintay ʿashrata rakʿatan buniya lahu baytun fi l-jannah: arbaʿan qabla ẓ-ẓuhr, wa rakʿatayni baʿdahā, wa rakʿatayni baʿda l-maghrib, wa rakʿatayni baʿda l-ʿishāʾ, wa rakʿatayni qabla l-fajr.»</div><div class="h-en">Umm Ḥabībah (may Allah be pleased with her) said: the Messenger of Allah ﷺ said: <strong>"Whoever prays twelve rakʿahs in a day and night, a house will be built for him in Paradise: four before Ẓuhr and two after it, two after Maghrib, two after ʿIshāʾ, and two before Fajr."</strong></div><div class="h-source">أخرجه الترمذي برقم (٤١٥)، قال الترمذي: حديث حسن صحيح، وأصل الحديث في صحيح مسلم برقم (٧٢٨) · Narrated by at-Tirmidhī (415), who said: ḥasan ṣaḥīḥ; the core of the ḥadīth is in Ṣaḥīḥ Muslim (728)</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">رَوَاتِب · rawātib</div><div class="study-note-body">Singular <em>rātibah</em>, root ر-ت-ب (r-t-b) = <strong>to be fixed, set in order</strong>. (Remember <em>tartīb</em> — "order" — from wuḍūʾ!) The rawātib are the sunnahs <strong>fixed to the five daily prayers</strong>, coming before or after them.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Better than the whole world</div><div class="h-ar">وعن عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «ركعتا الفجر خير من الدنيا، وما فيها»</div><div class="h-translit">Wa ʿan ʿĀʾishata raḍiya-llāhu ʿanhā qālat: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Rakʿatā l-fajri khayrun mina d-dunyā wa mā fīhā.»</div><div class="h-en">ʿĀʾishah (may Allah be pleased with her) said: the Messenger of Allah ﷺ said: <strong>"The two rakʿahs of Fajr are better than this world and everything in it."</strong></div><div class="h-source">أخرجه مسلم برقم (٧٢٥) · Narrated by Muslim, no. 725</div></div>
