function L11P1(){return `
<div class="callout"><div class="callout-label">الوحدة الثامنة · Unit Eight</div><div class="callout-ar">الوحدة الثامنة: الجنائز</div><div class="callout-translit">Al-waḥdatu th-thāminah: Al-janāʾiz</div><div class="callout-en">Unit Eight: <strong>Funerals</strong></div>
<div class="callout-ar">قال تعالى: ﴿كُلُّ نَفْسٍ ذَآئِقَةُ ٱلْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ﴾</div><div class="callout-translit">Qāla taʿālā: Kullu nafsin dhāʾiqatu l-mawt, thumma ilaynā turjaʿūn.</div><div class="callout-en">Allah the Exalted said (meaning): <strong>"Every soul will taste death. Then to Us you will be returned."</strong></div></div>
<div class="v-ref">سورة العنكبوت: ٥٧ · Sūrat al-ʿAnkabūt 29:57</div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">This verse has two halves. The first is something every human knows: <em>everyone dies</em>. The second is what makes a believer different: <em>then to Us you will be returned</em>. Death is not an ending. It is a <strong>return home</strong> to the One who made us.<br><br>Studying funeral rulings can feel heavy. But think of it this way: you are learning how to honour a fellow Muslim on their journey back to Allah. One day, someone will do this for you.</div></div>

<div class="sec"><div class="sec-ar">تمهيد</div><div class="sec-translit">Tamhīd</div><div class="sec-en">Introduction</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">من كمال الشريعة شمولها لأحكام الحياة والممات، ومن ذلك الأحكام المتعلقة بالمسلم المتوفى.</div><div class="bt-translit">Min kamāli sh-sharīʿati shumūluhā li-aḥkāmi l-ḥayāti wa l-mamāt, wa min dhālika l-aḥkāmu l-mutaʿalliqatu bi-l-muslimi l-mutawaffā.</div><div class="bt-en">Part of the <strong>perfection of the Sharīʿah</strong> is that it covers the rulings of <strong>both life and death</strong>. That includes the rulings about a Muslim who has <strong>passed away</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why does Islam have funeral rules?</span><div class="study-note-body">Islam doesn’t leave you alone at any stage: how to be born (adhān in the baby’s ear), how to live (prayer, fasting…), and even how to be <strong>washed, wrapped, prayed over and buried</strong> when you die. Nothing is left to guesswork. That is what "kamāl ash-sharīʿah" (the perfection of the Sharīʿah) means.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">جَنَازَة · janāzah</div><div class="study-note-body">From root ج-ن-ز (j-n-z). <strong>Janāzah</strong> means the deceased person (especially on the bier) and also the funeral itself. Plural: <strong>janāʾiz</strong> (جنائز), the title of this unit. <em>Ṣalāt al-janāzah</em> = the funeral prayer.</div></div>

<div class="sec"><div class="sec-ar">تكفين الميت</div><div class="sec-translit">Takfīnu l-mayyit</div><div class="sec-en">Shrouding the Deceased</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">يغسل الميت ثم يكفن، وتغسيله وتكفينه فرض كفاية، في تكفين الميت ستر جميع بدنه، والأفضل أن يُكفن الرجل في ثلاث قطع يدرج فيها إدراجًا، والمرأة في خمس قطع إزار لأسفل البدن، وقميص لأعلاه، وخمار للرأس، وتلف في لفافتين، والسنة التكفين بقطعٍ بيضاء، يُلفُّ فيها الميت، ثم يعقد الكفَن حتى لا ينتشر، وَتُحَلُّ عنه العُقد في القبر.</div><div class="bt-translit">Yughassalu l-mayyitu thumma yukaffan, wa taghsīluhu wa takfīnuhu farḍu kifāyah. Fī takfīni l-mayyiti satru jamīʿi badanih, wa l-afḍalu an yukaffana r-rajulu fī thalāthi qiṭaʿin yudraju fīhā idrājā, wa l-marʾatu fī khamsi qiṭaʿ: izārun li-asfali l-badan, wa qamīṣun li-aʿlāh, wa khimārun li-r-raʾs, wa tulaffu fī lifāfatayn. Wa s-sunnatu t-takfīnu bi-qiṭaʿin bayḍāʾ, yulaffu fīha l-mayyit, thumma yuʿqadu l-kafanu ḥattā lā yantashir, wa tuḥallu ʿanhu l-ʿuqadu fi l-qabr.</div><div class="bt-en">The deceased is <strong>washed, then shrouded</strong>. Washing and shrouding him are a <strong>farḍ kifāyah</strong>. Shrouding means <strong>covering the whole body</strong>.<br>• It is best that a <strong>man</strong> is shrouded in <strong>three pieces</strong> of cloth, wrapped in them one over another.<br>• A <strong>woman</strong> is shrouded in <strong>five pieces</strong>: an <em>izār</em> (wrap) for the lower body, a <em>qamīṣ</em> (shirt) for the upper body, a <em>khimār</em> (head covering) for the head, and she is wrapped in <em>two</em> wrapping sheets.<br>The Sunnah is to use <strong>white</strong> cloth. The deceased is wrapped in it, then the shroud is <strong>tied</strong> so it does not come open, and the <strong>knots are untied in the grave</strong>.</div></div>

<div class="compare-grid">
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">الرجل</div><div class="ch-translit">ar-rajul · Man</div></div><div class="compare-card-body"><ul><li><span dir="rtl" lang="ar">ثلاث قطع</span>: three pieces</li><li><span dir="rtl" lang="ar">يدرج فيها إدراجًا</span>: wrapped in them, one over the other</li></ul></div></div>
<div class="compare-card"><div class="compare-card-head gold"><div class="ch-ar">المرأة</div><div class="ch-translit">al-marʾah · Woman</div></div><div class="compare-card-body"><ul><li><span dir="rtl" lang="ar">إزار لأسفل البدن</span>: izār for the lower body</li><li><span dir="rtl" lang="ar">قميص لأعلاه</span>: qamīṣ (shirt) for the upper body</li><li><span dir="rtl" lang="ar">خمار للرأس</span>: khimār for the head</li><li><span dir="rtl" lang="ar">لفافتين</span>: two wrapping sheets</li></ul><p style="margin-top:6px"><strong>= 5 pieces</strong></p></div></div>
</div>

<div class="study-note remember"><span class="study-note-label">⭐ Shrouding in short</span><div class="study-note-body">Order: <strong>wash → shroud</strong> (both farḍ kifāyah).<br>Man <strong>3</strong> · Woman <strong>5</strong>.<br>Colour: <strong>white</strong>.<br>Tie it closed → <strong>untie the knots in the grave</strong>.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Even in death, a Muslim woman is given a <strong>khimār</strong> and extra covering. The modesty she kept in life is honoured by the community after she leaves it. And everyone, rich or poor, leaves in the <strong>same simple white cloth</strong>. No brand names, no jewellery, no pockets.<br><br>Ask yourself: if I leave this world with only a white cloth, what do I want to be taking with me instead?</div></div>
`;}

function L11P2(){return `
<div class="sec"><div class="sec-ar">صفة الصلاة على الميت</div><div class="sec-translit">Ṣifatu ṣ-ṣalāti ʿala l-mayyit</div><div class="sec-en">How to Pray over the Deceased</div></div>

<div class="point"><span class="point-num">1</span><div class="point-ar">أولًا: يقف الإِمام عند رأس الرجل ووسط المرأة، ويقف المأمومون خلفه ويتراصون في الصفوف ويسوونها كبقية الصلوات.</div><div class="point-translit">Awwalan: yaqifu l-imāmu ʿinda raʾsi r-rajuli wa wasaṭi l-marʾah, wa yaqifu l-maʾmūmūna khalfahu wa yatarāṣṣūna fi ṣ-ṣufūfi wa yusawwūnahā ka-baqiyyati ṣ-ṣalawāt.</div><div class="point-en"><strong>First:</strong> the imām stands at the <strong>head of a man</strong> and the <strong>middle of a woman</strong>. The followers stand behind him, pack closely together in rows, and straighten the rows, as in other prayers.</div></div>

<div class="point"><span class="point-num">2</span><div class="point-ar">ثانيًا: يُكَبَّر في الصلاة على الميت أربع تكبيرات، وبيان ما يشرع في كل تكبيرة ما يلي:</div><div class="point-translit">Thāniyan: yukabbaru fi ṣ-ṣalāti ʿala l-mayyiti arbaʿu takbīrāt, wa bayānu mā yushraʿu fī kulli takbīratin mā yalī:</div><div class="point-en"><strong>Second:</strong> the funeral prayer has <strong>four takbīrs</strong>. Here is what is done after each one:</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 How is the funeral prayer different?</span><div class="study-note-body">It is a prayer done <strong>completely standing</strong>: no rukūʿ, no sujūd, no sitting. It is made of <strong>four takbīrs</strong>, and after each one you say something specific. Think of it as four "stations".</div></div>

<div class="defbox"><div class="defbox-tag">① التكبيرة الأولى · The 1st takbīr</div><div class="defbox-body">
<ul class="num-list">
<li data-n="1"><div class="li-ar">يكبر قائمًا، رافعًا يديه مع التكبير.</div><div class="li-translit">Yukabbiru qāʾiman, rāfiʿan yadayhi maʿa t-takbīr.</div><div class="li-en">He says takbīr <strong>standing</strong>, raising his hands with the takbīr.</div></li>
<li data-n="2"><div class="li-ar">يستعيذ ويبسمل، ولا يقرأ دعاء الاستفتاح.</div><div class="li-translit">Yastaʿīdhu wa yubasmil, wa lā yaqraʾu duʿāʾa l-istiftāḥ.</div><div class="li-en">He seeks refuge (aʿūdhu billāh) and says the basmalah, and does <strong>not</strong> recite the opening duʿāʾ.</div></li>
<li data-n="3"><div class="li-ar">يقرأ الفاتحة.</div><div class="li-translit">Yaqraʾu l-fātiḥah.</div><div class="li-en">He recites <strong>al-Fātiḥah</strong>.</div></li>
</ul></div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ No istiftāḥ here!</span><div class="study-note-body">In the ʿĪd prayer (last lesson) you <strong>do</strong> say duʿāʾ al-istiftāḥ. In the funeral prayer you <strong>don’t</strong>. You go straight to aʿūdhu billāh → bismillāh → al-Fātiḥah.</div></div>

<div class="defbox"><div class="defbox-tag gold">② التكبيرة الثانية · The 2nd takbīr</div><div class="defbox-body">
<ul class="num-list">
<li data-n="1"><div class="li-ar">يكبِّر التكبيرة الثانية قائمًا، رافعًا يديه مع التكبير.</div><div class="li-translit">Yukabbiru t-takbīrata th-thāniyata qāʾiman, rāfiʿan yadayhi maʿa t-takbīr.</div><div class="li-en">He says the second takbīr standing, raising his hands with the takbīr.</div></li>
<li data-n="2"><div class="li-ar">يصلِّي على النبي ﷺ، على الصفة السابقة في التشهد الأخير.</div><div class="li-translit">Yuṣallī ʿala n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam, ʿala ṣ-ṣifati s-sābiqati fi t-tashahhudi l-akhīr.</div><div class="li-en">He sends <strong>ṣalāh on the Prophet ﷺ</strong>, in the same form as in the <strong>final tashahhud</strong>.</div></li>
</ul></div></div>

<div class="activity" id="act11p2">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act11p2'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act11p2'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt">Write it (the ṣalāh on the Prophet ﷺ from the final tashahhud) from memory.</div><div class="act-ar">(اكتبها من حفظك)</div><div class="act-translit">(Uktubhā min ḥifẓik)</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box"><span dir="rtl" lang="ar">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ</span><br><em>Allāhumma ṣalli ʿalā Muḥammadin wa ʿalā āli Muḥammad, kamā ṣallayta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīm, innaka ḥamīdun majīd. Allāhumma bārik ʿalā Muḥammadin wa ʿalā āli Muḥammad, kamā bārakta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīm, innaka ḥamīdun majīd.</em><br>"O Allah, send prayers on Muḥammad and the family of Muḥammad, as You sent prayers on Ibrāhīm and the family of Ibrāhīm; You are Praiseworthy, Glorious. O Allah, bless Muḥammad and the family of Muḥammad, as You blessed Ibrāhīm and the family of Ibrāhīm; You are Praiseworthy, Glorious."<br><small>(This is the well-known wording from your Level 1 lessons on the tashahhud; check it with your teacher.)</small></div></div>
</div>
`;}

function L11P3(){return `
<div class="defbox"><div class="defbox-tag">③ التكبيرة الثالثة · The 3rd takbīr</div><div class="defbox-body">
<ul class="num-list">
<li data-n="1"><div class="li-ar">يكبِّر التكبيرة الثالثة قائمًا، رافعًا يديه مع التكبير.</div><div class="li-translit">Yukabbiru t-takbīrata th-thālithata qāʾiman, rāfiʿan yadayhi maʿa t-takbīr.</div><div class="li-en">He says the third takbīr standing, raising his hands with the takbīr.</div></li>
<li data-n="2"><div class="li-ar">يدعو للميت بالمغفرة، ولنفسه وللمسلمين، ومن الدعاء الوارد عن النبي ﷺ:</div><div class="li-translit">Yadʿū li-l-mayyiti bi-l-maghfirah, wa li-nafsihi wa li-l-muslimīn, wa mina d-duʿāʾi l-wāridi ʿani n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam:</div><div class="li-en">He <strong>supplicates for the deceased</strong> asking forgiveness, and for himself and for the Muslims. Among the duʿāʾs reported from the Prophet ﷺ are:</div></li>
</ul></div></div>

<div class="hadith"><div class="hadith-label">Funeral duʿāʾ 1 — for all of us</div><div class="h-ar">«اللَّهم اغفر لِحَيِّنا وميِّتنا، وصغيرنا وكبيرنا، وذَكَرنا وأنثانا، وشاهِدنا وغائِبنا، اللَّهم من أحييته منا فأحْيِهِ على الإِيمان، ومن توفَّيته منا فتوفَّهُ على الإِسلام، اللَّهم لا تَحْرِمنا أجره، ولا تضلَّنا بعده»</div><div class="h-translit">Allāhumma-ghfir li-ḥayyinā wa mayyitinā, wa ṣaghīrinā wa kabīrinā, wa dhakarinā wa unthānā, wa shāhidinā wa ghāʾibinā. Allāhumma man aḥyaytahu minnā fa-aḥyihi ʿala l-īmān, wa man tawaffaytahu minnā fa-tawaffahu ʿala l-islām. Allāhumma lā taḥrimnā ajrah, wa lā tuḍillanā baʿdah.</div><div class="h-en">"O Allah, forgive <strong>our living and our dead</strong>, our young and our old, our males and our females, those of us present and those of us absent. O Allah, whoever of us You keep alive, keep him alive <strong>upon īmān</strong>; and whoever of us You take, take him <strong>upon Islām</strong>. O Allah, do not deprive us of his reward, and do not let us go astray after him."</div><div class="h-source">أخرجه أبو داود برقم (٣٢٠١)، والترمذي برقم (١٠٢٤)، وقال: حديث حسن صحيح · Narrated by Abū Dāwūd, no. 3201, and at-Tirmidhī, no. 1024, who said: a ḥasan ṣaḥīḥ hadith</div></div>

<table class="styled-table"><thead><tr><th>Arabic</th><th>Say it</th><th>Meaning</th></tr></thead><tbody>
<tr><td><span dir="rtl" lang="ar">اللَّهم اغفر لِحَيِّنا وميِّتنا</span></td><td>Allāhumma-ghfir li-ḥayyinā wa mayyitinā</td><td>O Allah, forgive our living and our dead</td></tr>
<tr><td><span dir="rtl" lang="ar">وصغيرنا وكبيرنا</span></td><td>wa ṣaghīrinā wa kabīrinā</td><td>our young and our old</td></tr>
<tr><td><span dir="rtl" lang="ar">وذَكَرنا وأنثانا</span></td><td>wa dhakarinā wa unthānā</td><td>our males and our females</td></tr>
<tr><td><span dir="rtl" lang="ar">وشاهِدنا وغائِبنا</span></td><td>wa shāhidinā wa ghāʾibinā</td><td>those present and those absent</td></tr>
<tr><td><span dir="rtl" lang="ar">اللَّهم من أحييته منا فأحْيِهِ على الإِيمان</span></td><td>Allāhumma man aḥyaytahu minnā fa-aḥyihi ʿala l-īmān</td><td>whoever You keep alive, keep him alive upon īmān</td></tr>
<tr><td><span dir="rtl" lang="ar">ومن توفَّيته منا فتوفَّهُ على الإِسلام</span></td><td>wa man tawaffaytahu minnā fa-tawaffahu ʿala l-islām</td><td>whoever You take, take him upon Islām</td></tr>
<tr><td><span dir="rtl" lang="ar">اللَّهم لا تَحْرِمنا أجره</span></td><td>Allāhumma lā taḥrimnā ajrah</td><td>do not deprive us of his reward</td></tr>
<tr><td><span dir="rtl" lang="ar">ولا تضلَّنا بعده</span></td><td>wa lā tuḍillanā baʿdah</td><td>and do not let us go astray after him</td></tr>
</tbody></table>

<div class="study-note remember"><span class="study-note-label">⭐ Memory hook: pairs!</span><div class="study-note-body">The first part of duʿāʾ 1 is built of <strong>opposite pairs</strong>: living/dead · young/old · male/female · present/absent. Learn it as four pairs and you have it. The next part is a nice swap: <em>alive → <strong>īmān</strong></em>, <em>die → <strong>Islām</strong></em>.</div></div>

<div class="hadith"><div class="hadith-label">Funeral duʿāʾ 2 — for the deceased</div><div class="h-ar">«اللَّهم اغفر له وارحمه، وعافِهِ واعْفُ عنه، وأكْرِمْ نُزله، ووسِّعْ مُدخله، واغسله بالماء والثلج والبَرَد، ونقِّه من الخطايا كما نقَّيت الثوبَ الأبيضَ من الدَّنَس، وأبدله دارًا خيرًا من داره، وأهلاً خيرًا من أهله، وزوجًا خيرًا من زوجه، وأدخله الجنَّة، وأعذه من عذاب القبر، ومن عذاب النار»</div><div class="h-translit">Allāhumma-ghfir lahu wa-rḥamh, wa ʿāfihi wa-ʿfu ʿanh, wa akrim nuzulah, wa wassiʿ mudkhalah, wa-ghsilhu bi-l-māʾi wa th-thalji wa l-barad, wa naqqihi mina l-khaṭāyā kamā naqqayta th-thawba l-abyaḍa mina d-danas, wa abdilhu dāran khayran min dārih, wa ahlan khayran min ahlih, wa zawjan khayran min zawjih, wa adkhilhu l-jannah, wa aʿidhhu min ʿadhābi l-qabr, wa min ʿadhābi n-nār.</div><div class="h-en">"O Allah, <strong>forgive him and have mercy on him</strong>, keep him safe and pardon him, honour his arrival (hospitality), and make his entry (his grave) spacious. <strong>Wash him with water, snow and hail</strong>, and cleanse him of sins as You cleanse a <strong>white garment from dirt</strong>. Give him a home better than his home, a family better than his family, and a spouse better than his spouse. Admit him into <strong>Paradise</strong>, and protect him from the punishment of the grave and from the punishment of the Fire."</div><div class="h-source">أخرجه مسلم برقم (٩٦٣) · Narrated by Muslim, no. 963</div></div>

<table class="styled-table"><thead><tr><th>Arabic</th><th>Say it</th><th>Meaning</th></tr></thead><tbody>
<tr><td><span dir="rtl" lang="ar">اللَّهم اغفر له وارحمه</span></td><td>Allāhumma-ghfir lahu wa-rḥamh</td><td>O Allah, forgive him and have mercy on him</td></tr>
<tr><td><span dir="rtl" lang="ar">وعافِهِ واعْفُ عنه</span></td><td>wa ʿāfihi wa-ʿfu ʿanh</td><td>keep him safe and pardon him</td></tr>
<tr><td><span dir="rtl" lang="ar">وأكْرِمْ نُزله</span></td><td>wa akrim nuzulah</td><td>honour his arrival (as a guest)</td></tr>
<tr><td><span dir="rtl" lang="ar">ووسِّعْ مُدخله</span></td><td>wa wassiʿ mudkhalah</td><td>make his entrance (grave) wide</td></tr>
<tr><td><span dir="rtl" lang="ar">واغسله بالماء والثلج والبَرَد</span></td><td>wa-ghsilhu bi-l-māʾi wa th-thalji wa l-barad</td><td>wash him with water, snow and hail</td></tr>
<tr><td><span dir="rtl" lang="ar">ونقِّه من الخطايا كما نقَّيت الثوبَ الأبيضَ من الدَّنَس</span></td><td>wa naqqihi mina l-khaṭāyā kamā naqqayta th-thawba l-abyaḍa mina d-danas</td><td>cleanse him of sins as a white garment is cleansed of dirt</td></tr>
<tr><td><span dir="rtl" lang="ar">وأبدله دارًا خيرًا من داره</span></td><td>wa abdilhu dāran khayran min dārih</td><td>give him a home better than his home</td></tr>
<tr><td><span dir="rtl" lang="ar">وأهلاً خيرًا من أهله</span></td><td>wa ahlan khayran min ahlih</td><td>a family better than his family</td></tr>
<tr><td><span dir="rtl" lang="ar">وزوجًا خيرًا من زوجه</span></td><td>wa zawjan khayran min zawjih</td><td>a spouse better than his spouse</td></tr>
<tr><td><span dir="rtl" lang="ar">وأدخله الجنَّة</span></td><td>wa adkhilhu l-jannah</td><td>admit him into Paradise</td></tr>
<tr><td><span dir="rtl" lang="ar">وأعذه من عذاب القبر، ومن عذاب النار</span></td><td>wa aʿidhhu min ʿadhābi l-qabr, wa min ʿadhābi n-nār</td><td>protect him from the punishment of the grave and of the Fire</td></tr>
</tbody></table>

<div class="study-note beginner"><span class="study-note-label">💡 "Nuzul" and "mudkhal": what do they mean?</span><div class="study-note-body"><strong>Nuzul</strong> (نُزُل) is the food and welcome you prepare for a guest who arrives. We ask Allah to welcome the deceased like an honoured guest.<br><strong>Mudkhal</strong> (مُدْخَل) is "the place of entering". Here it is the grave: we ask Allah to make it wide and comfortable.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ "Lahu" = him</span><div class="study-note-body">The book prints duʿāʾ 2 with <strong>him</strong> (<em>lahu, warḥamhu, ʿanhu</em>…). When the deceased is a woman, the endings change to <strong>her</strong> (for example <em>lahā, warḥamhā, ʿanhā</em>). Practise this with your teacher so you get the grammar right.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">Look at duʿāʾ 1 again: before asking anything for the dead person, we ask for <em>"our living and our dead"</em>. Standing at a funeral, you are praying for <strong>yourself</strong> too: <em>let me live on īmān, let me die on Islām.</em><br><br>And in duʿāʾ 2 we ask Allah to wash the deceased "with water, snow and hail", the same image the Prophet ﷺ used in his own opening duʿāʾ for prayer. The coldest, purest things. Imagine people praying that over you one day, and live today so their prayers find you ready.</div></div>

<div class="defbox"><div class="defbox-tag gold">④ التكبيرة الرابعة · The 4th takbīr</div><div class="defbox-body">
<ul class="num-list">
<li data-n="1"><div class="li-ar">يكبِّر التكبيرة الرابعة قائمًا، رافعًا يديه مع التكبير.</div><div class="li-translit">Yukabbiru t-takbīrata r-rābiʿata qāʾiman, rāfiʿan yadayhi maʿa t-takbīr.</div><div class="li-en">He says the fourth takbīr standing, raising his hands with the takbīr.</div></li>
<li data-n="2"><div class="li-ar">يسكت بعدها سكتة قصيرة.</div><div class="li-translit">Yaskutu baʿdahā saktatan qaṣīrah.</div><div class="li-en">He is <strong>silent for a short pause</strong> after it.</div></li>
<li data-n="3"><div class="li-ar">يسلِّم تسليمة واحدة عن يمينه قائلاً: السلام عليكم ورحمة اللَّه.</div><div class="li-translit">Yusallimu taslīmatan wāḥidatan ʿan yamīnihi qāʾilan: as-salāmu ʿalaykum wa raḥmatu-llāh.</div><div class="li-en">He gives <strong>one salām to the right</strong>, saying: <strong>"As-salāmu ʿalaykum wa raḥmatu-llāh."</strong></div></li>
</ul></div></div>

<div class="study-note remember"><span class="study-note-label">⭐ The four stations</span><div class="study-note-body"><strong>1st takbīr:</strong> aʿūdhu + bismillāh + al-Fātiḥah<br><strong>2nd takbīr:</strong> ṣalāh on the Prophet ﷺ (Ibrāhīmiyyah)<br><strong>3rd takbīr:</strong> duʿāʾ for the deceased (and yourself, and the Muslims)<br><strong>4th takbīr:</strong> short silence → <strong>one</strong> salām to the right<br><br>Hook: <strong>Qurʾān → Prophet ﷺ → deceased → peace.</strong></div></div>
`;}

function L11P4(){return `
<div class="activity" id="act11p4">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act11p4'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act11p4'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt"><strong>تطبيق · Practice 1:</strong> My classmates and I memorise the duʿāʾs said in the funeral prayer.</div><div class="act-ar">١ / أحفظُ أنا وزملائي الأدعية التي تُقال في صلاة الجنازة.</div><div class="act-translit">1 / Aḥfaẓu anā wa zumalāʾī l-adʿiyata llatī tuqālu fī ṣalāti l-janāzah.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">The duʿāʾs to memorise:<br>• <strong>After the 2nd takbīr:</strong> the ṣalāh Ibrāhīmiyyah (Allāhumma ṣalli ʿalā Muḥammad…).<br>• <strong>After the 3rd takbīr:</strong> duʿāʾ 1 (Allāhumma-ghfir li-ḥayyinā wa mayyitinā…) and duʿāʾ 2 (Allāhumma-ghfir lahu wa-rḥamh…).<br>Tip: learn one line a day from the phrase tables on the previous tab.</div></div>
<div class="act-item"><div class="act-prompt"><strong>تطبيق · Practice 2:</strong> I practise the description of the funeral prayer under my teacher’s supervision, my classmates practise it too, and I write down my notes.</div><div class="act-ar">٢ / أطبِّقُ صفة الصلاة على الميت بإِشراف معلِّمي، ويطبِّقها زملائي، وأكتب ملحوظاتي:</div><div class="act-translit">2 / Uṭabbiqu ṣifata ṣ-ṣalāti ʿala l-mayyiti bi-ishrāfi muʿallimī, wa yuṭabbiquhā zumalāʾī, wa aktubu malḥūẓātī:</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Model notes:<br>1. Imām stands at the head of a man / middle of a woman; rows are tight and straight.<br>2. The whole prayer is standing: no rukūʿ, no sujūd.<br>3. Four takbīrs, hands raised each time.<br>4. 1st: aʿūdhu + bismillāh + al-Fātiḥah (no istiftāḥ). 2nd: ṣalāh on the Prophet ﷺ. 3rd: duʿāʾ for the deceased. 4th: short pause, then one salām to the right.<br>5. Recitation is quiet (isrār).</div></div>
</div>

<div class="sec"><div class="sec-ar">أركان صلاة الجنازة</div><div class="sec-translit">Arkānu ṣalāti l-janāzah</div><div class="sec-en">The Pillars of the Funeral Prayer</div></div>

<div class="point"><span class="point-num">1</span><div class="point-ar">القيام مع القدرة.</div><div class="point-translit">Al-qiyāmu maʿa l-qudrah.</div><div class="point-en"><strong>Standing</strong>, for whoever is able.</div></div>
<div class="point"><span class="point-num">2</span><div class="point-ar">التكبيرات الأربع.</div><div class="point-translit">At-takbīrātu l-arbaʿ.</div><div class="point-en">The <strong>four takbīrs</strong>.</div></div>
<div class="point"><span class="point-num">3</span><div class="point-ar">قراءة الفاتحة.</div><div class="point-translit">Qirāʾatu l-fātiḥah.</div><div class="point-en">Reciting <strong>al-Fātiḥah</strong>.</div></div>
<div class="point"><span class="point-num">4</span><div class="point-ar">الصلاة على النبي ﷺ.</div><div class="point-translit">Aṣ-ṣalātu ʿala n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam.</div><div class="point-en">Sending <strong>ṣalāh on the Prophet ﷺ</strong>.</div></div>
<div class="point"><span class="point-num">5</span><div class="point-ar">الدعاء للميت.</div><div class="point-translit">Ad-duʿāʾu li-l-mayyit.</div><div class="point-en"><strong>Supplicating for the deceased</strong>.</div></div>
<div class="point"><span class="point-num">6</span><div class="point-ar">الترتيب.</div><div class="point-translit">At-tartīb.</div><div class="point-en"><strong>Order</strong> (doing them in the right sequence).</div></div>
<div class="point"><span class="point-num">7</span><div class="point-ar">التسليم.</div><div class="point-translit">At-taslīm.</div><div class="point-en">The <strong>salām</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What makes something a "rukn" (pillar)?</span><div class="study-note-body">A <strong>rukn</strong> is a part the prayer cannot stand without. If one is missing, the prayer is not valid. Compare with <strong>sunnahs</strong> (next tab): they make the prayer better and more complete, but the prayer is still valid without them.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ 7 pillars = the 4 stations + 3</span><div class="study-note-body">Notice: pillars 2–5 and 7 are just the four stations you learned (takbīrs, Fātiḥah, ṣalāh on the Prophet ﷺ, duʿāʾ, salām). Add <strong>standing</strong> at the start and <strong>order</strong> holding it all together, and you have all <strong>seven</strong>.</div></div>
`;}

function L11P5(){return `
<div class="sec"><div class="sec-ar">سنن صلاة الجنازة</div><div class="sec-translit">Sunanu ṣalāti l-janāzah</div><div class="sec-en">The Sunnahs of the Funeral Prayer</div></div>

<ul class="num-list">
<li data-n="1"><div class="li-ar">رفع اليدين مع كل تكبيرة.</div><div class="li-translit">Rafʿu l-yadayni maʿa kulli takbīrah.</div><div class="li-en"><strong>Raising the hands</strong> with every takbīr.</div></li>
<li data-n="2"><div class="li-ar">الاستعاذة والبسملة قبل القراءة.</div><div class="li-translit">Al-istiʿādhatu wa l-basmalatu qabla l-qirāʾah.</div><div class="li-en">Seeking refuge and saying the <strong>basmalah before reciting</strong>.</div></li>
<li data-n="3"><div class="li-ar">الإِسرار بالقراءة.</div><div class="li-translit">Al-isrāru bi-l-qirāʾah.</div><div class="li-en">Reciting <strong>quietly</strong>.</div></li>
<li data-n="4"><div class="li-ar">الدعاء لنفسه والمسلمين.</div><div class="li-translit">Ad-duʿāʾu li-nafsihi wa l-muslimīn.</div><div class="li-en">Supplicating <strong>for oneself and the Muslims</strong>.</div></li>
<li data-n="5"><div class="li-ar">السكوت قليلاً بعد التكبيرة الرابعة وقبل التسليم.</div><div class="li-translit">As-sukūtu qalīlan baʿda t-takbīrati r-rābiʿati wa qabla t-taslīm.</div><div class="li-en">Being <strong>silent a little</strong> after the fourth takbīr, before the salām.</div></li>
<li data-n="6"><div class="li-ar">وضع اليد اليمنى على اليسرى على الصدر.</div><div class="li-translit">Waḍʿu l-yadi l-yumnā ʿala l-yusrā ʿala ṣ-ṣadr.</div><div class="li-en">Placing the <strong>right hand on the left, on the chest</strong>.</div></li>
<li data-n="7"><div class="li-ar">تكثير صفوف المصلِّين بأن تكون ثلاثة فأكثر.</div><div class="li-translit">Takthīru ṣufūfi l-muṣallīna bi-an takūna thalāthatan fa-akthar.</div><div class="li-en"><strong>Increasing the number of rows</strong> of those praying, so there are <strong>three or more</strong>.</div></li>
</ul>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Pillar or Sunnah?</span><div class="study-note-body">Duʿāʾ <strong>for the deceased</strong> = <strong>pillar</strong> (must). Duʿāʾ <strong>for yourself and the Muslims</strong> = <strong>Sunnah</strong> (recommended). Same with the salām: the salām itself is a pillar, but the little silence before it is a Sunnah. Don’t mix them up in the exam!</div></div>

<div class="sec"><div class="sec-ar">التعزية</div><div class="sec-translit">At-taʿziyah</div><div class="sec-en">Offering Condolences</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">يُستحب تعزية أهل الميّت؛ لقول النبي ﷺ: «مَا مِنْ مُؤْمِنٍ يُعَزِّي أَخَاهُ بِمُصِيبَةٍ، إِلَّا كَسَاهُ اللَّهُ سُبْحَانَهُ مِنْ حُلَلِ الْكَرَامَةِ يَوْمَ الْقِيَامَةِ» ولما في ذلك من تطييب نفوسهم، وتهوين المصيبة عليهم، كما يُسَنُّ حثُّهم على الصبر.</div><div class="bt-translit">Yustaḥabbu taʿziyatu ahli l-mayyit; li-qawli n-nabiyyi ṣallā-llāhu ʿalayhi wa sallam: «mā min muʾminin yuʿazzī akhāhu bi-muṣībatin, illā kasāhu-llāhu subḥānahu min ḥulali l-karāmati yawma l-qiyāmah», wa li-mā fī dhālika min taṭyībi nufūsihim, wa tahwīni l-muṣībati ʿalayhim, kamā yusannu ḥaththuhum ʿala ṣ-ṣabr.</div><div class="bt-en">It is <strong>recommended to console the family</strong> of the deceased, because the Prophet ﷺ said: <strong>"There is no believer who consoles his brother in a calamity, except that Allah (glorified is He) will clothe him with garments of honour on the Day of Resurrection."</strong> And because it comforts their hearts and makes the calamity easier for them. It is also Sunnah to <strong>encourage them to be patient</strong>.</div></div>
<div class="h-source">أخرجه ابن ماجه برقم (١٦٠١) وحسنه الألباني، والمراد بحلل الكرامة: أي الحلل الدالة على الكرامة عنده، أو من حلل أهل الكرامة. ينظر: شرح السندي على ابن ماجه ٢/٢٦٨ · Narrated by Ibn Mājah, no. 1601; al-Albānī graded it ḥasan. "Garments of honour" means garments showing honour in His sight, or garments of the people of honour. See as-Sindī’s commentary on Ibn Mājah 2/268</div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">تَعْزِيَة · taʿziyah</div><div class="study-note-body">From root ع-ز-ي (ʿ-z-y), "to console, to call to patience". <strong>Yuʿazzī</strong> (يُعَزِّي) = "he consoles". <strong>ʿAzāʾ</strong> (عَزَاء) = "consolation", as in <em>aḥsana-llāhu ʿazāʾak</em>. You will hear these words at every Muslim funeral.</div></div>

<div class="body-text"><div class="bt-label">📄 Text</div><div class="bt-ar">والتعزية تصح بكلِّ لفظ يؤدِّي الغرض، ومنه: عَظَّم اللَّه أجرك، أحسن اللَّه عزاءك، غفر اللَّه لميّتك، وإذا كان بلفظ وارد عن النبي ﷺ فهو أفضل، ومنه:</div><div class="bt-translit">Wa t-taʿziyatu taṣiḥḥu bi-kulli lafẓin yuʾaddī l-gharaḍ, wa minhu: ʿaẓẓama-llāhu ajrak, aḥsana-llāhu ʿazāʾak, ghafara-llāhu li-mayyitik. Wa idhā kāna bi-lafẓin wāridin ʿani n-nabiyyi ṣallā-llāhu ʿalayhi wa sallama fa-huwa afḍal, wa minhu:</div><div class="bt-en">Condolence is valid with <strong>any words that do the job</strong>, for example:<br>• <strong>ʿAẓẓama-llāhu ajrak</strong>: "May Allah make your reward great."<br>• <strong>Aḥsana-llāhu ʿazāʾak</strong>: "May Allah make your consolation beautiful."<br>• <strong>Ghafara-llāhu li-mayyitik</strong>: "May Allah forgive your deceased."<br>If it is with words <strong>reported from the Prophet ﷺ</strong>, that is <strong>better</strong>, for example:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — The Prophet’s ﷺ words of condolence</div><div class="h-ar">«إن لله ما أخذ، وله ما أعطى، وكل شيء عنده بأجل مسمّى، فاصبر واحتسب»</div><div class="h-translit">Inna li-llāhi mā akhadh, wa lahu mā aʿṭā, wa kullu shayʾin ʿindahu bi-ajalin musammā, fa-ṣbir wa-ḥtasib.</div><div class="h-en"><strong>"Indeed, to Allah belongs what He took, and to Him belongs what He gave, and everything with Him has an appointed term. So be patient and hope for the reward."</strong></div><div class="h-source">أخرجه البخاري برقم (١٢٨٤) ومسلم برقم (٩٢٣) · Narrated by al-Bukhārī, no. 1284, and Muslim, no. 923</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Ready-to-use phrases</span><div class="study-note-body">Short: <strong>ʿAẓẓama-llāhu ajrak</strong> / <strong>Aḥsana-llāhu ʿazāʾak</strong> / <strong>Ghafara-llāhu li-mayyitik</strong>.<br>Best (Sunnah): <strong>Inna li-llāhi mā akhadh, wa lahu mā aʿṭā, wa kullu shayʾin ʿindahu bi-ajalin musammā, fa-ṣbir wa-ḥtasib.</strong><br>(To a woman: <em>ajrik, ʿazāʾik, li-mayyitik</em>, and <em>fa-ṣbirī wa-ḥtasibī</em>.)</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection</span><div class="study-note-body">The Prophet’s ﷺ condolence starts with a truth that changes how loss feels: <em>"To Allah belongs what He took, and to Him belongs what He gave."</em> The person we loved was never ours. They were a <strong>gift on loan</strong>, and the Owner has taken back what is His, at a time He had already written.<br><br>And the reward for simply saying kind words to a grieving sister? <em>Garments of honour on the Day of Resurrection.</em> Who in your life is grieving right now? A short message or visit may be one of the heaviest deeds on your scale.</div></div>
`;}

<div class="q-item"><span class="q-num">1</span><div class="q-en">Compare the funeral prayer with the five daily prayers, mentioning the similarities and differences between them.</div><div class="q-ar">قارن بين صلاة الجنازة والصلوات الخمس بذكر أوجه الشبه والخلاف بينهما.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">
<strong>Similarities (أوجه الشبه):</strong><br>• Both start with takbīr and end with taslīm.<br>• Both include reciting al-Fātiḥah and sending ṣalāh on the Prophet ﷺ.<br>• Standing is a pillar in both, for whoever is able.<br>• Rows are packed and straightened behind the imām in both.<br>• Raising the hands with the takbīr; right hand on the left on the chest.<br><br>
<strong>Differences (أوجه الخلاف):</strong>

<tr><td>Farḍ kifāyah</td><td>Farḍ ʿayn</td></tr>
<tr><td>All standing: no rukūʿ, no sujūd, no sitting</td><td>Has rukūʿ, sujūd and sitting</td></tr>
<tr><td>Four takbīrs only</td><td>Rakʿahs (2, 3 or 4)</td></tr>

<tr><td>Recitation always quiet</td><td>Some prayers are aloud</td></tr>
<tr><td>Duʿāʾ for the deceased is a pillar</td><td>No such pillar</td></tr>
<tr><td>One salām to the right</td><td>Two salāms</td></tr>
<tr><td>Imām stands at the head of a man / middle of a woman</td><td>Imām stands in front of the rows</td></tr>
</tbody></table></div></div>

<div class="q-item"><span class="q-num">2</span><div class="q-en">How do you pray the funeral prayer?</div><div class="q-ar">كيف تصلي على الجنازة؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">1. The imām stands at the <strong>head of a man</strong> or the <strong>middle of a woman</strong>; the followers stand behind him in tight, straight rows (three rows or more is Sunnah).<br>2. <strong>1st takbīr</strong> (standing, hands raised): aʿūdhu billāh, bismillāh, then al-Fātiḥah, with no istiftāḥ.<br>3. <strong>2nd takbīr</strong>: ṣalāh on the Prophet ﷺ as in the final tashahhud.<br>4. <strong>3rd takbīr</strong>: duʿāʾ for the deceased, for myself and for the Muslims, e.g. "Allāhumma-ghfir li-ḥayyinā wa mayyitinā…" and "Allāhumma-ghfir lahu wa-rḥamh…".<br>5. <strong>4th takbīr</strong>: a short silence, then <strong>one salām to the right</strong>: "As-salāmu ʿalaykum wa raḥmatu-llāh."<br>All of it is done quietly and standing.</div></div>
</div>
