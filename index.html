function L3P4(){return `
<div class="sec"><div class="sec-ar">ثانيًا: صلاة الوتر</div><div class="sec-translit">Thāniyan: ṣalātu l-witr</div><div class="sec-en">Second: The Witr Prayer</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">وقتها: من بعد صلاة العشاء، ويستمر وقتها إلى طلوع الفجر.</div><div class="li-translit">Waqtuhā: min baʿdi ṣalāti l-ʿishāʾ, wa yastamirru waqtuhā ilā ṭulūʿi l-fajr.</div><div class="li-en"><strong>Its time:</strong> from after the ʿIshāʾ prayer, and it lasts until the break of dawn (Fajr).</div></li>
<li data-n="2"><div class="li-ar">عدد ركعاتها: أقلّها ركعة، وأكثرها إحدى عشرة ركعة.</div><div class="li-translit">ʿAdadu rakaʿātihā: aqalluhā rakʿah, wa aktharuhā iḥdā ʿashrata rakʿah.</div><div class="li-en"><strong>Number of rakʿahs:</strong> the least is one rakʿah, and the most is eleven.</div></li>
<li data-n="3"><div class="li-ar">حكمها: سنة مؤكّدة، فعن علي بن أبي طالب ﵁ قال: قال رسول الله ﷺ: «إن الله وتر يحب الوتر، فأوتروا يا أهل القرآن»</div><div class="li-translit">Ḥukmuhā: sunnatun muʾakkadah, fa-ʿan ʿAliyyi bni Abī Ṭālibin raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Inna-llāha witrun yuḥibbu l-witr, fa-awtirū yā ahla l-Qurʾān.»</div><div class="li-en"><strong>Its ruling:</strong> a strongly emphasised sunnah. ʿAlī ibn Abī Ṭālib (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: <strong>"Allah is Witr (One) and He loves witr (odd), so pray witr, O people of the Qurʾān."</strong><div class="h-source">أخرجه أحمد برقم (١٢٢٥)، وأبوداود برقم (١٤١٦)، والترمذي برقم (٤٥٣) · Narrated by Aḥmad (1225), Abū Dāwūd (1416) and at-Tirmidhī (453)</div></div></li>
<li data-n="4"><div class="li-ar">أفضل وقتها: الأفضل أن يصلي الإنسان الوتر في آخر الليل إن كان يثق من نفسه الاستيقاظ في آخره، وإلا صلى في أوله قبل أن ينام.</div><div class="li-translit">Afḍalu waqtihā: al-afḍalu an yuṣalliya l-insānu l-witra fī ākhiri l-layli in kāna yathiqu min nafsihi l-istīqāẓa fī ākhirih, wa illā ṣallā fī awwalihi qabla an yanām.</div><div class="li-en"><strong>Its best time:</strong> it is best to pray witr at the <strong>end of the night</strong> if you are confident you will wake up then; otherwise pray it at the <strong>beginning of the night before sleeping</strong>.</div></li>
</ol>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">وِتْر · witr</div><div class="study-note-body">Root و-ت-ر (w-t-r) = <strong>odd / single</strong> (the opposite of <em>shafʿ</em>, "even/pair"). Witr is the prayer that makes your night prayer end on an <strong>odd number</strong> — 1, 3, 5… up to 11. And Allah is <em>al-Witr</em>: the One, with no partner.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Which time should I pick?</span><div class="study-note-body">Ask yourself honestly: "Will I really wake up before Fajr?"<br>• <strong>Yes, I’m sure</strong> → pray witr in the last part of the night (best).<br>• <strong>Not sure</strong> → pray it after ʿIshāʾ, before bed. Safe and still rewarded.</div></div>

<div class="sec"><div class="sec-ar">القنوت في الوتر</div><div class="sec-translit">Al-qunūtu fi l-witr</div><div class="sec-en">Qunūt in Witr</div></div>

<div class="body-text"><div class="bt-ar">يستحب القنوت في الوتر، في الركعة الأخيرة، بعد الرفع من الركوع، فيرفع يديه ويدعو بما ورد، ومن ذلك:</div><div class="bt-translit">Yustaḥabbu l-qunūtu fi l-witr, fi r-rakʿati l-akhīrah, baʿda r-rafʿi mina r-rukūʿ, fa-yarfaʿu yadayhi wa yadʿū bi-mā warad, wa min dhālik:</div><div class="bt-en">Qunūt in witr is <strong>recommended</strong>: in the <strong>last rakʿah</strong>, <strong>after rising from rukūʿ</strong>. You raise your hands and supplicate with what has been reported, including:</div></div>

<div class="hadith"><div class="hadith-label">Duʿāʾ al-Qunūt</div><div class="h-ar">«اللّهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولني فيمن توليت، وبارك لي فيما أعطيت، وقني شر ما قضيت، إنك تقضي ولا يقضى عليك، وإنه لا يذل من والَيْت، ولا يعز من عاديت، تباركت ربنا وتعالَيْت»</div><div class="h-translit">Allāhumma-hdinī fīman hadayt, wa ʿāfinī fīman ʿāfayt, wa tawallanī fīman tawallayt, wa bārik lī fīmā aʿṭayt, wa qinī sharra mā qaḍayt, innaka taqḍī wa lā yuqḍā ʿalayk, wa innahu lā yadhillu man wālayt, wa lā yaʿizzu man ʿādayt, tabārakta rabbanā wa taʿālayt.</div><div class="h-en">"O Allah, guide me among those You have guided; grant me well-being among those You have granted well-being; take me into Your care among those You have taken into Your care; bless me in what You have given; and protect me from the evil of what You have decreed. For You decree, and none can decree over You. Whoever You befriend is never humiliated, and whoever You take as an enemy is never honoured. Blessed are You, our Lord, and Exalted."</div><div class="h-source">أخرجه أبوداود برقم (١٤٢٥)، والترمذي برقم (٤٦٤) وحسنه، والنسائي برقم (١٧٤٥)، وابن ماجه برقم (١١٧٨) · Narrated by Abū Dāwūd (1425), at-Tirmidhī (464, who graded it ḥasan), an-Nasāʾī (1745) and Ibn Mājah (1178)</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Learn it line by line</span><div class="study-note-body">The first five lines all follow one pattern — "do X for me among those You did X for":<br>1. <em>ihdinī</em> — guide me<br>2. <em>ʿāfinī</em> — give me well-being<br>3. <em>tawallanī</em> — take care of me<br>4. <em>bārik lī</em> — bless me<br>5. <em>qinī</em> — protect me<br>Memorise one line a day; in a week you have the whole duʿāʾ.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — "among those You have guided"</span><div class="study-note-body">In qunūt you don’t ask to be special or alone. You ask to be counted <strong>among</strong> the guided, <strong>among</strong> the protected — joining a caravan of believers Allah has already cared for. Then you end with total trust: "You decree, and none decrees over You."<br><br>What worry could you place inside that sentence tonight?</div></div>

<div class="act-item"><div class="act-prompt"><div class="act-ar">بعد أن أدّى صالح صلاة المغرب قام مباشرة وصلى الوتر خمس ركعات. أتأمل في هذا الموقف، ثم أكتب بالتعاون مع زملائي الخطأ الذي وقع فيه صالح.</div><div class="act-translit">Baʿda an addā Ṣāliḥun ṣalāta l-maghribi qāma mubāsharatan wa ṣallā l-witra khamsa rakaʿāt. Ataʾammalu fī hādhā l-mawqif, thumma aktubu bi-t-taʿāwuni maʿa zumalāʾī l-khaṭaʾa lladhī waqaʿa fīhi Ṣāliḥ.</div>After Ṣāliḥ prayed Maghrib, he immediately stood and prayed witr, five rakʿahs. I reflect on this situation, then with my classmates I write the mistake Ṣāliḥ made.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box"><strong>His mistake was the timing.</strong> The time of witr begins <strong>after the ʿIshāʾ prayer</strong> and lasts until dawn. Praying it straight after Maghrib is before its time.<br><br>The <strong>number</strong> was fine: five is within the range (least 1, most 11).<br><br>Correct: pray witr after ʿIshāʾ — at the end of the night if he trusts himself to wake, otherwise before sleeping.</div></div>
</div>
`;}

function L3P5(){return `
<div class="sec"><div class="sec-ar">ثالثًا: صلاة الضّحى</div><div class="sec-translit">Thālithan: ṣalātu ḍ-ḍuḥā</div><div class="sec-en">Third: The Ḍuḥā (Forenoon) Prayer</div></div>

<div class="body-text"><div class="bt-label">حكمها · Its ruling</div><div class="bt-ar">هي سنة؛ لحديث أبي هريرة ﵁ قال: «أوصاني خليلي بثلاث: صيام ثلاثة أيام من كل شهر، وركعتي الضحى، وأن أوتر قبل أن أنام»</div><div class="bt-translit">Hiya sunnah; li-ḥadīthi Abī Hurayrata raḍiya-llāhu ʿanhu qāl: «Awṣānī khalīlī bi-thalāth: ṣiyāmi thalāthati ayyāmin min kulli shahr, wa rakʿatayi ḍ-ḍuḥā, wa an ūtira qabla an anām.»</div><div class="bt-en">It is a <strong>sunnah</strong>, because of the ḥadīth of Abū Hurayrah (may Allah be pleased with him), who said: <strong>"My close friend (the Prophet ﷺ) advised me to do three things: fast three days of every month, pray the two rakʿahs of Ḍuḥā, and pray witr before I sleep."</strong><div class="h-source">أخرجه البخاري برقم (١١٧٨)، ومسلم برقم (٧٢١) · Narrated by al-Bukhārī (1178) and Muslim (721)</div></div></div>

<div class="body-text"><div class="bt-label">عدد ركعاتها · Number of rakʿahs</div><div class="bt-ar">أقلّها ركعتان، ولا حدّ لأكثرها.</div><div class="bt-translit">Aqalluhā rakʿatān, wa lā ḥadda li-aktharihā.</div><div class="bt-en">The least is <strong>two rakʿahs</strong>, and there is <strong>no limit</strong> to the most.</div></div>

<div class="body-text"><div class="bt-label">وقتها · Its time</div><div class="bt-ar">من ارتفاع الشمس قَدْر رمح، وهو ربع ساعة تقريبًا بعد طلوع الشمس، إلى قُبيل الزوال، وأفضل وقتها حين يبدأ اشتداد الحَرِّ، لقوله ﷺ: «صلاة الأوابين حين تَرْمَضُ الفِصال»</div><div class="bt-translit">Mini rtifāʿi sh-shamsi qadra rumḥ, wa huwa rubʿu sāʿatin taqrīban baʿda ṭulūʿi sh-shams, ilā qubayli z-zawāl, wa afḍalu waqtihā ḥīna yabdaʾu shtidādu l-ḥarr, li-qawlihi ṣalla-llāhu ʿalayhi wa sallam: «Ṣalātu l-awwābīna ḥīna tarmaḍu l-fiṣāl.»</div><div class="bt-en">From when the sun has risen <strong>the height of a spear</strong> — about <strong>a quarter of an hour after sunrise</strong> — until <strong>just before zawāl</strong> (the sun passing its highest point). Its best time is <strong>when the heat starts to get strong</strong>, because the Prophet ﷺ said: <strong>"The prayer of the awwābīn (those who often turn back to Allah) is when the young camels feel the burning heat."</strong><div class="h-source">أخرجه مسلم برقم (٧٤٨)، وترمَض: من الرمضاء وهي شدة الحر، والفصال: جمع فصيل وهو ولد الناقة إذا فصل عن أمه وقد يقال في البقر · Narrated by Muslim (748). <em>Tarmaḍ</em>: from <em>ramḍāʾ</em>, intense heat. <em>Fiṣāl</em>: plural of <em>faṣīl</em>, a young camel weaned from its mother (also said of cattle).</div></div></div>

<div class="study-note beginner"><span class="study-note-label">💡 When is Ḍuḥā in clock time?</span><div class="study-note-body">Check your prayer app for <strong>sunrise</strong> and <strong>Ẓuhr</strong>.<br>• Start: about 15 minutes after sunrise.<br>• End: shortly before Ẓuhr (about 10 minutes before — see Lesson 4).<br>• Best: mid-to-late morning, when the sand would be hot enough to make young camels lift their feet!</div></div>

<div class="sec"><div class="sec-ar">فضلها</div><div class="sec-translit">Faḍluhā</div><div class="sec-en">Its Virtue</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 1 — Charity for every joint</div><div class="h-ar">عن أبي ذَرٍّ ﵁ عن النبي ﷺ أَنَّهُ قال: «يُصْبِح على كل سُلَامَى من أَحَدِكُمْ صَدَقَةٌ، فَكُلُّ تَسْبيحَةٍ صَدَقَةٌ، وَكُلُّ تَحْمِيدَةٍ صَدَقَةٌ، وكُلُّ تَهْلِيلَة صَدَقَةٌ، وَكُلُّ تَكْبِيرَة صَدَقَةٌ، وَأَمْرٌ بِالْمَعْرُوفِ صَدَقَةٌ، وَنَهْيٌ عن الْمُنْكَرِ صَدَقَةٌ، وَيُجْزِئُ من ذلك رَكْعَتَانِ يَرْكَعُهُمَا من الضُّحَى»</div><div class="h-translit">ʿAn Abī Dharrin raḍiya-llāhu ʿanhu ʿani n-nabiyyi ṣalla-llāhu ʿalayhi wa sallam annahu qāl: «Yuṣbiḥu ʿalā kulli sulāmā min aḥadikum ṣadaqah, fa-kullu tasbīḥatin ṣadaqah, wa kullu taḥmīdatin ṣadaqah, wa kullu tahlīlatin ṣadaqah, wa kullu takbīratin ṣadaqah, wa amrun bi-l-maʿrūfi ṣadaqah, wa nahyun ʿani l-munkari ṣadaqah, wa yujziʾu min dhālika rakʿatāni yarkaʿuhumā mina ḍ-ḍuḥā.»</div><div class="h-en">Abū Dharr (may Allah be pleased with him) reported that the Prophet ﷺ said: <strong>"Every morning, a charity is due for every joint of each of you. Every <em>subḥān Allāh</em> is a charity, every <em>al-ḥamdu lillāh</em> is a charity, every <em>lā ilāha illā Allāh</em> is a charity, every <em>Allāhu akbar</em> is a charity, commanding good is a charity, and forbidding evil is a charity. And two rakʿahs prayed in the Ḍuḥā time are enough for all of that."</strong></div><div class="h-source">أخرجه مسلم برقم (٧٢٠) · Narrated by Muslim, no. 720<br>(٣) السُّلَامَى: المفاصل، وفي ابن آدم (٣٦٠) مَفْصِلاً · <em>Sulāmā</em>: the joints; the human body has 360 joints.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ 360 thank-yous in two rakʿahs</span><div class="study-note-body">You wake up with 360 joints that work — each one owes a "thank you" charity every single day. Two rakʿahs of Ḍuḥā <strong>cover all of them</strong>. That is why Ḍuḥā is sometimes called the daily "gratitude prayer" for your body.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 2 — Allah takes care of your day</div><div class="h-ar">عن أبي الدرداء ﵁ قال: قال رسول الله ﷺ: قال الله تعالى: «ابن آدم: اركع لي أربع ركعات من أول النهار أكفك آخره»</div><div class="h-translit">ʿAn Abi d-Dardāʾi raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: qāla-llāhu taʿālā: «Ibna Ādam: irkaʿ lī arbaʿa rakaʿātin min awwali n-nahāri akfika ākhirah.»</div><div class="h-en">Abu d-Dardāʾ (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: Allah the Exalted said: <strong>"Son of Adam, pray four rakʿahs for Me at the beginning of the day, and I will suffice you for the rest of it."</strong></div><div class="h-source">أخرجه الترمذي برقم: (٤٧٥)، وصححه الألباني في صحيح الترمذي · Narrated by at-Tirmidhī (475); graded ṣaḥīḥ by al-Albānī in Ṣaḥīḥ at-Tirmidhī</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — give Him your morning</span><div class="study-note-body">Mornings are when we feel busiest: work, chores, messages. Allah’s offer is simple: give Me a few minutes at the start, and I will <strong>take care of the rest</strong> of your day.<br><br>Your bones, your hours, your worries — all covered by a short prayer between sunrise and Ẓuhr. What is stopping you from trying it tomorrow?</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Don’t pray it right at sunrise</span><div class="study-note-body">Ḍuḥā does <strong>not</strong> start the moment the sun appears. Wait about 15 minutes until it has risen "a spear’s height". The time right at sunrise is one of the forbidden times (Lesson 4).</div></div>
`;}

<div class="q-item"><span class="q-num">1</span><div class="q-en">What is the prayer called that repairs the shortfall in the obligatory prayer?</div><div class="q-ar">ماذا تسمى الصلاة التي تجبر النقص الواقع في صلاة الفريضة؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>Ṣalāt at-taṭawwuʿ</strong> (voluntary prayer), also called <em>an-nawāfil</em>. Evidence: "Look — do you find any voluntary prayer for My servant? Then complete his obligatory prayer with it."</div></div>

<div class="q-item"><span class="q-num">5</span><div class="q-en">From your study of the Ḍuḥā prayer, explain: (a) its time; (b) the number of its rakʿahs.</div><div class="q-ar">من خلال دراستك لصلاة الضحى بين ما يأتي: أ- وقتها. ب- عدد ركعاتها.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>(a) Time:</strong> from when the sun has risen a spear’s height (about a quarter-hour after sunrise) until just before zawāl. The best time is when the heat becomes strong ("when the young camels feel the heat").<br><strong>(b) Rakʿahs:</strong> at least two, with no upper limit.</div></div>

function L4P1(){return `
<div class="sec"><div class="sec-ar">الدرس الرابع: صلاة التطوّع (٢)</div><div class="sec-translit">Ad-darsu r-rābiʿ: Ṣalātu t-taṭawwuʿ (2)</div><div class="sec-en">Lesson Four: Voluntary Prayer (2)</div></div>

<div class="body-text"><div class="bt-label">تمهيد · Introduction</div><div class="bt-ar">الصلوات التي يشرع التطوع بها كثيرة، مر بك في الدرس السابق ثلاث منها، وسنذكر في هذا الدرس بعض الصلوات التي يشرع التطوع بها.</div><div class="bt-translit">Aṣ-ṣalawātu llatī yushraʿu t-taṭawwuʿu bihā kathīrah, marra bika fi d-darsi s-sābiqi thalāthun minhā, wa sa-nadhkuru fī hādhā d-darsi baʿḍa ṣ-ṣalawāti llatī yushraʿu t-taṭawwuʿu bihā.</div><div class="bt-en">There are many voluntary prayers. You met three of them in the previous lesson (the rawātib, witr and Ḍuḥā). In this lesson we mention some more.</div></div>

<div class="sec"><div class="sec-ar">رابعًا: صلاة التراويح</div><div class="sec-translit">Rābiʿan: ṣalātu t-tarāwīḥ</div><div class="sec-en">Fourth: The Tarāwīḥ Prayer</div></div>

<div class="defbox"><div class="defbox-tag">📌 What is meant by it</div><div class="defbox-body"><div class="defbox-ar">المراد بها: هي صلاة الليل في رمضان جماعةً، سميت بذلك لأن الصحابة رضي الله عنهم كانوا يستريحون فيها بين كل أربع ركعات، لطول الصلاة.</div><div class="defbox-translit">Al-murādu bihā: hiya ṣalātu l-layli fī Ramaḍāna jamāʿah, summiyat bi-dhālika li-anna ṣ-ṣaḥābata raḍiya-llāhu ʿanhum kānū yastarīḥūna fīhā bayna kulli arbaʿi rakaʿāt, li-ṭūli ṣ-ṣalāh.</div><div class="defbox-en">Tarāwīḥ is <strong>the night prayer in Ramaḍān, prayed in congregation</strong>. It got this name because the Companions (may Allah be pleased with them) used to <strong>rest</strong> after every four rakʿahs, since the prayer was so long.</div></div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">تَرَاوِيح · tarāwīḥ</div><div class="study-note-body">Root ر-و-ح (r-w-ḥ) = <strong>rest, ease, relief</strong>. <em>Tarwīḥah</em> = one rest break; <em>tarāwīḥ</em> = many rest breaks. The same root gives <em>rāḥah</em> (comfort) and <em>istirāḥah</em> (taking a break). The prayer is literally named after the pauses the Companions took — because they stood so long!</div></div>

<div class="body-text"><div class="bt-label">حكمها · Its ruling</div><div class="bt-ar">التراويح سنة مؤكدة شرعها رسول الله ﷺ في شهر رمضان، حيث صلاها النبي ﷺ بأصحابه عدة ليالٍ، ثم ترك ذلك خوفاً من أن تفرض عليهم، وفعلها الصحابة رضي الله عنهم بعده عليه الصلاة والسلام.</div><div class="bt-translit">At-tarāwīḥu sunnatun muʾakkadah sharaʿahā rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam fī shahri Ramaḍān, ḥaythu ṣallāhā n-nabiyyu ṣalla-llāhu ʿalayhi wa sallam bi-aṣḥābihi ʿiddata layālin, thumma taraka dhālika khawfan min an tufraḍa ʿalayhim, wa faʿalahā ṣ-ṣaḥābatu raḍiya-llāhu ʿanhum baʿdahu ʿalayhi ṣ-ṣalātu wa s-salām.</div><div class="bt-en">Tarāwīḥ is a <strong>strongly emphasised sunnah</strong> that the Messenger of Allah ﷺ established in Ramaḍān. He led his Companions in it for several nights, then stopped, <strong>fearing it would be made obligatory on them</strong>. The Companions continued it after him ﷺ.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — he stopped out of love</span><div class="study-note-body">The Prophet ﷺ loved this prayer, yet he held back from it in congregation — not because it wasn’t good, but because he feared it would become a <strong>burden made compulsory</strong> on his ummah. That is mercy: thinking of the weakest person who would come after him.<br><br>When you stand in tarāwīḥ, remember you are standing in a prayer he kept <em>easy</em> for you on purpose.</div></div>

<div class="body-text"><div class="bt-label">عدد ركعاتها · Number of rakʿahs</div><div class="bt-ar">أقلها ركعة وأدنى الكمال ثلاث ركعات (الشفع والوتر) والسنة إحدى عشرة ركعة أو ثلاث عشرة ركعة ولا حدّ لأكثرها، سُئِلَ النبي ﷺ عن صلاة الليل فقال: «مَثْنَى مَثْنَى، فَإِذَا خَشِيَ أَحَدُكُمْ الصُّبْحَ صَلّى رَكْعَةً وَاحِدَةً تُوتِرُ لَهُ مَا قَدْ صَلّى»</div><div class="bt-translit">Aqalluhā rakʿah wa adnā l-kamāli thalāthu rakaʿāt (ash-shafʿu wa l-witr) wa s-sunnatu iḥdā ʿashrata rakʿatan aw thalātha ʿashrata rakʿah wa lā ḥadda li-aktharihā, suʾila n-nabiyyu ṣalla-llāhu ʿalayhi wa sallam ʿan ṣalāti l-layli fa-qāl: «Mathnā mathnā, fa-idhā khashiya aḥadukumu ṣ-ṣubḥa ṣallā rakʿatan wāḥidatan tūtiru lahu mā qad ṣallā.»</div><div class="bt-en">The least is <strong>one rakʿah</strong>; the lowest complete amount is <strong>three</strong> (shafʿ — two — and witr — one). The sunnah is <strong>eleven or thirteen</strong> rakʿahs, and there is <strong>no upper limit</strong>. The Prophet ﷺ was asked about the night prayer and said: <strong>"Two by two. Then when one of you fears the dawn is coming, he prays one rakʿah, which makes what he has prayed odd (witr)."</strong><div class="h-source">أخرجه البخاري برقم (٤٧٢)، ومسلم برقم (٧٤٩) · Narrated by al-Bukhārī (472) and Muslim (749)</div></div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What does "mathnā mathnā" look like?</span><div class="study-note-body">Pray <strong>2 rakʿahs, say salām</strong>; then 2 more, salām; and so on. At the end, pray <strong>1 rakʿah</strong> on its own as witr.<br>Example of 11: 2 + 2 + 2 + 2 + 2 + <strong>1</strong>.</div></div>
`;}

function L4P2(){return `
<div class="sec"><div class="sec-ar">فضلها</div><div class="sec-translit">Faḍluhā</div><div class="sec-en">The Virtue of Tarāwīḥ</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 1 — Past sins forgiven</div><div class="h-ar">عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: «من قام رمضان إيمانًا واحتسابًا غفر له ما تقدم من ذنبه»</div><div class="h-translit">ʿAn Abī Hurayrata raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Man qāma Ramaḍāna īmānan wa-ḥtisāban ghufira lahu mā taqaddama min dhanbih.»</div><div class="h-en">Abū Hurayrah (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: <strong>"Whoever stands (in prayer) in Ramaḍān out of faith and hoping for reward, his past sins will be forgiven."</strong></div><div class="h-source">أخرجه البخاري برقم (٣٧)، ومسلم برقم (٧٥٩) · Narrated by al-Bukhārī (37) and Muslim (759)</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">احْتِسَاب · iḥtisāb</div><div class="study-note-body">Root ح-س-ب (ḥ-s-b) = <strong>to count, reckon</strong>. <em>Iḥtisāb</em> means doing a deed while <strong>counting on Allah alone</strong> for its reward — not for people’s praise. Two conditions in this ḥadīth: <em>īmān</em> (believing in it) + <em>iḥtisāb</em> (seeking Allah’s reward).</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth 2 — A whole night’s reward</div><div class="h-ar">وعن أبي ذرّ ﵁ قال: قال رسول الله ﷺ: «من قام مع الإمام حتى ينصرف كتب له قيام ليلة»</div><div class="h-translit">Wa ʿan Abī Dharrin raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Man qāma maʿa l-imāmi ḥattā yanṣarifa kutiba lahu qiyāmu laylah.»</div><div class="h-en">Abū Dharr (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: <strong>"Whoever stands (in prayer) with the imām until he finishes, the reward of praying the whole night is written for him."</strong></div><div class="h-source">أخرجه أحمد برقم (٢١٤١٩)، وأبو داود برقم (١٣٧٥)، والنسائي برقم (١٦٠٥)، وصححه الألباني في صحيح النسائي · Narrated by Aḥmad (21419), Abū Dāwūd (1375) and an-Nasāʾī (1605); graded ṣaḥīḥ by al-Albānī in Ṣaḥīḥ an-Nasāʾī</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ "Until he finishes"</span><div class="study-note-body">The full-night reward is for staying with the imām <strong>until he ends</strong> the prayer (including the witr). Leaving halfway means missing that specific promise.</div></div>

function L4P3(){return `
<div class="sec"><div class="sec-ar">خامسًا: صلاة الاستخارة</div><div class="sec-translit">Khāmisan: ṣalātu l-istikhārah</div><div class="sec-en">Fifth: The Istikhārah Prayer (Seeking Allah’s Choice)</div></div>

<div class="body-text"><div class="bt-ar">يُسَنُّ للمسلم أن يصلي صلاة الاستخارة إذا أراد أن يقدم على أمر من الأمور التي تشتبه عليه، وعنده تردد فيها؛ لحديث جابر ﵁ قال:</div><div class="bt-translit">Yusannu li-l-muslimi an yuṣalliya ṣalāta l-istikhārati idhā arāda an yuqdima ʿalā amrin mina l-umūri llatī tashtabihu ʿalayh, wa ʿindahu taraddudun fīhā; li-ḥadīthi Jābirin raḍiya-llāhu ʿanhu qāl:</div><div class="bt-en">It is <strong>sunnah</strong> for a Muslim to pray istikhārah when he wants to go ahead with a matter that is <strong>unclear to him</strong> and he feels <strong>hesitant</strong> about it — because of the ḥadīth of Jābir (may Allah be pleased with him), who said:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth of Jābir — the full Duʿāʾ al-Istikhārah</div><div class="h-ar">«كان رسول الله ﷺ يعلّمنا الاستخارة في الأمور كلها كما يعلّمنا السورة من القرآن، يقول: إذا همّ أحدكم بالأمر فليركع ركعتين من غير الفريضة، ثم ليقل: اللّهم إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب، اللّهم إن كنت تعلم أن هذا الأمر (ثم يسمي حاجته) خير لي في ديني ومعاشي وعاقبة أمري أو قال: عاجل أمري وآجله، فاقدره ويسره لي ثم بارك لي فيه، وإن كنت تعلم أن هذا الأمر شر لي في ديني ومعاشي وعاقبة أمري، أو قال: في عاجل أمري وآجله، فاصرفه عني واصرفني عنه، واقدر لي الخير حيث كان، ثم أرضني به»</div><div class="h-translit">«Kāna rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam yuʿallimunā l-istikhārata fi l-umūri kullihā kamā yuʿallimunā s-sūrata mina l-Qurʾān, yaqūl: idhā hamma aḥadukum bi-l-amri fa-l-yarkaʿ rakʿatayni min ghayri l-farīḍah, thumma l-yaqul: Allāhumma innī astakhīruka bi-ʿilmik, wa astaqdiruka bi-qudratik, wa asʾaluka min faḍlika l-ʿaẓīm, fa-innaka taqdiru wa lā aqdir, wa taʿlamu wa lā aʿlam, wa anta ʿallāmu l-ghuyūb. Allāhumma in kunta taʿlamu anna hādhā l-amra (thumma yusammī ḥājatah) khayrun lī fī dīnī wa maʿāshī wa ʿāqibati amrī — aw qāla: ʿājili amrī wa ājilih — fa-qdurhu wa yassirhu lī thumma bārik lī fīh. Wa in kunta taʿlamu anna hādhā l-amra sharrun lī fī dīnī wa maʿāshī wa ʿāqibati amrī — aw qāla: fī ʿājili amrī wa ājilih — fa-ṣrifhu ʿannī wa-ṣrifnī ʿanh, wa-qdur liya l-khayra ḥaythu kān, thumma arḍinī bih.»</div><div class="h-en">"The Messenger of Allah ﷺ used to teach us istikhārah in <strong>all matters</strong>, just as he taught us a sūrah of the Qurʾān. He would say: ‘When one of you intends to do something, let him pray two rakʿahs other than the obligatory prayer, then say:<br><br><strong>O Allah, I ask You to choose for me by Your knowledge, and I ask You to give me ability by Your power, and I ask You from Your immense bounty. For You are able and I am not; You know and I do not; and You are the Knower of the unseen. O Allah, if You know that this matter</strong> (then he names what he needs) <strong>is good for me in my religion, my livelihood and the outcome of my affairs</strong> — or he said: <strong>my affairs now and later</strong> — <strong>then decree it for me, make it easy for me, and then bless me in it. And if You know that this matter is bad for me in my religion, my livelihood and the outcome of my affairs</strong> — or he said: <strong>my affairs now and later</strong> — <strong>then turn it away from me and turn me away from it, and decree for me what is good wherever it may be, then make me pleased with it.</strong>’"</div><div class="h-source">أخرجه البخاري رقم (٦٣٨٢) · Narrated by al-Bukhārī, no. 6382</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 How do I actually pray istikhārah?</span><div class="study-note-body">1. Pray <strong>two rakʿahs</strong> that are not the obligatory prayer.<br>2. After the prayer, say the duʿāʾ.<br>3. At "<em>anna hādhā l-amra</em>" ("that this matter"), <strong>name your matter</strong> — e.g. "this job", "this move".<br>4. Then go ahead with what seems right, trusting Allah to make it easy or turn it away.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ The three "I ask You"s</span><div class="study-note-body"><em>Astakhīruka bi-ʿilmik</em> — choose for me by <strong>Your knowledge</strong><br><em>Astaqdiruka bi-qudratik</em> — empower me by <strong>Your power</strong><br><em>Asʾaluka min faḍlik</em> — give me from <strong>Your bounty</strong><br>Then the reason: <strong>You can, I can’t; You know, I don’t.</strong></div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — "then make me pleased with it"</span><div class="study-note-body">The duʿāʾ doesn’t end with "give me what I want". It ends with <em>thumma arḍinī bih</em> — "then make me <strong>content</strong> with it". Sometimes the hardest part is not the decision but accepting where Allah leads.<br><br>Istikhārah hands the choice to the One who sees the end from the beginning — and asks Him to give your heart peace with whatever comes.</div></div>

</div>
`;}

</div>
`;}

function L4P5(){return `
<div class="sec"><div class="sec-ar">سابعًا: التطوّع المطلق</div><div class="sec-translit">Sābiʿan: at-taṭawwuʿu l-muṭlaq</div><div class="sec-en">Seventh: Unrestricted Voluntary Prayer</div></div>

<div class="body-text"><div class="bt-ar">وهو ما لم يقيّد بزمن ولا سبب، وصلاة التطوع المطلق مشروعة في كل وقت إلا في الأوقات المنهي عن الصلاة فيها.</div><div class="bt-translit">Wa huwa mā lam yuqayyad bi-zamanin wa lā sabab, wa ṣalātu t-taṭawwuʿi l-muṭlaqi mashrūʿatun fī kulli waqtin illā fi l-awqāti l-manhiyyi ʿani ṣ-ṣalāti fīhā.</div><div class="bt-en">It is voluntary prayer <strong>not tied to a time or a reason</strong>. It is allowed at <strong>any time</strong>, except during the times in which prayer is forbidden.</div></div>

<div class="hadith"><div class="hadith-label">Night prayer is best</div><div class="h-ar">وصلاة الليل أفضل من صلاة النهار؛ لقوله ﷺ: «أفضل الصلاة بعد الفريضة صلاة الليل»</div><div class="h-translit">Wa ṣalātu l-layli afḍalu min ṣalāti n-nahār; li-qawlihi ṣalla-llāhu ʿalayhi wa sallam: «Afḍalu ṣ-ṣalāti baʿda l-farīḍati ṣalātu l-layl.»</div><div class="h-en">Night prayer is better than day prayer, because the Prophet ﷺ said: <strong>"The best prayer after the obligatory prayer is the night prayer."</strong></div><div class="h-source">أخرجه مسلم برقم (١١٦٣) · Narrated by Muslim, no. 1163</div></div>

<div class="body-text"><div class="bt-ar">والثلث الأخير من الليل أفضل؛ لأنه وقت نزول الله جلّ جلاله إلى السماء الدنيا، فيكون أحرى لإجابة الدعاء.</div><div class="bt-translit">Wa th-thuluthu l-akhīru mina l-layli afḍal; li-annahu waqtu nuzūli-llāhi jalla jalāluhu ila s-samāʾi d-dunyā, fa-yakūnu aḥrā li-ijābati d-duʿāʾ.</div><div class="bt-en">And the <strong>last third of the night</strong> is best, because it is the time when Allah, Majestic is His majesty, descends to the lowest heaven — so it is <strong>more likely for duʿāʾ to be answered</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 How do I find "the last third"?</span><div class="study-note-body">Take the time from <strong>Maghrib to Fajr</strong> and split it into three. Example: Maghrib 6 pm, Fajr 6 am = 12 hours → each third is 4 hours → the last third starts at <strong>2 am</strong>. Even a few rakʿahs before Fajr count!</div></div>

<div class="sec"><div class="sec-ar">ثامنًا: سجود التلاوة</div><div class="sec-translit">Thāminan: sujūdu t-tilāwah</div><div class="sec-en">Eighth: The Prostration of Recitation</div></div>

<div class="body-text"><div class="bt-ar">سجود التلاوة سنة مؤكدة لمن قرأ بآية سجدة أثناء تلاوته للقرآن، سواء كان في الصلاة أو خارج الصلاة، في أي وقت من الأوقات، ولا يشترط له الطهارة، والطهارة أفضل.</div><div class="bt-translit">Sujūdu t-tilāwati sunnatun muʾakkadah li-man qaraʾa bi-āyati sajdatin athnāʾa tilāwatihi li-l-Qurʾān, sawāʾun kāna fi ṣ-ṣalāti aw khārija ṣ-ṣalāh, fī ayyi waqtin mina l-awqāt, wa lā yushtaraṭu lahu ṭ-ṭahārah, wa ṭ-ṭahāratu afḍal.</div><div class="bt-en">Sujūd at-tilāwah is a <strong>strongly emphasised sunnah</strong> for whoever recites a <strong>verse of prostration</strong> while reading the Qurʾān — whether inside or outside prayer, at any time. <strong>Purity (wuḍūʾ) is not a condition</strong> for it, but being pure is better.</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Shayṭān weeps</div><div class="h-ar">عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: «إذا قرأ ابنُ آدم السجدة فسجد اعتزل الشيطانُ يبكي يقول: يا ويله أُمِرَ ابنُ آدم بالسجود فسجد فله الجنة، وأُمرت بالسجود فأبيت فلي النار»</div><div class="h-translit">ʿAn Abī Hurayrata raḍiya-llāhu ʿanhu qāl: qāla rasūlu-llāhi ṣalla-llāhu ʿalayhi wa sallam: «Idhā qaraʾa bnu Ādama s-sajdata fa-sajada ʿtazala sh-shayṭānu yabkī yaqūl: yā waylah, umira bnu Ādama bi-s-sujūdi fa-sajada fa-lahu l-jannah, wa umirtu bi-s-sujūdi fa-abaytu fa-liya n-nār.»</div><div class="h-en">Abū Hurayrah (may Allah be pleased with him) said: the Messenger of Allah ﷺ said: <strong>"When the son of Adam recites a verse of prostration and prostrates, Shayṭān withdraws, weeping and saying: ‘Woe to him! The son of Adam was commanded to prostrate and he prostrated, so Paradise is his. I was commanded to prostrate and I refused, so the Fire is mine.’"</strong></div><div class="h-source">أخرجه مسلم برقم (٨١) · Narrated by Muslim, no. 81</div></div>

<div class="sec"><div class="sec-ar">صفته</div><div class="sec-translit">Ṣifatuh</div><div class="sec-en">How It Is Done</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">إذا كان في صلاة أو في غير صلاة وقرأ آية سجدة فإنه يكبر ويسجد.</div><div class="li-translit">Idhā kāna fī ṣalātin aw fī ghayri ṣalātin wa qaraʾa āyata sajdatin fa-innahu yukabbiru wa yasjud.</div><div class="li-en">Whether in prayer or not, if he recites a verse of prostration, he says <strong>Allāhu akbar</strong> and prostrates.</div></li>
<li data-n="2"><div class="li-ar">يقول في هذا السجود ما يقال في سجود الصلاة، أويقول ما ورد، ومن ذلك:</div><div class="li-translit">Yaqūlu fī hādhā s-sujūdi mā yuqālu fī sujūdi ṣ-ṣalāh, aw yaqūlu mā warad, wa min dhālik:</div><div class="li-en">In this prostration he says what is said in the prostration of prayer, or what has been reported, including:</div>
<ol class="num-list">
<li data-n="أ"><div class="li-ar">«سجد وجهي لله الذي خلقه، وشقّ سمعه وبصره، بحوله وقوته»</div><div class="li-translit">Sajada wajhī lillāhi lladhī khalaqah, wa shaqqa samʿahu wa baṣarah, bi-ḥawlihi wa quwwatih.</div><div class="li-en">"My face has prostrated to Allah who created it and brought forth its hearing and sight, by His might and His power."<div class="h-source">أخرجه الترمذي برقم (٥٨٠) وقال: حديث حسن صحيح، وأبو داود برقم (١٤١٤) · Narrated by at-Tirmidhī (580), who said: ḥasan ṣaḥīḥ; and Abū Dāwūd (1414)</div></div></li>
<li data-n="ب"><div class="li-ar">«اللّهم اكتب لي بها عندك أجراً، وضع عني بها وزراً، واجعلها لي عندك ذخراً، وتقبّلها مني كما تقبلتها من عبدك داود»</div><div class="li-translit">Allāhumma-ktub lī bihā ʿindaka ajran, wa ḍaʿ ʿannī bihā wizran, wa-jʿalhā lī ʿindaka dhukhran, wa taqabbalhā minnī kamā taqabbaltahā min ʿabdika Dāwūd.</div><div class="li-en">"O Allah, write for me a reward with You because of it, remove a sin from me because of it, store it up for me with You as a treasure, and accept it from me as You accepted it from Your servant Dāwūd."<div class="h-source">أخرجه الترمذي برقم (٣٤٢٤) وابن ماجه برقم (١٠٥٣) وحسنه النووي في خلاصة الأحكام ٢/ ٦٢٣ · Narrated by at-Tirmidhī (3424) and Ibn Mājah (1053); graded ḥasan by an-Nawawī in Khulāṣat al-Aḥkām 2/623</div></div></li>
<li data-n="ج"><div class="li-ar">«اللّهم لك سجدت وبك آمنت ولك أسلمت، سجد وجهي للذي خلقه وصوره، وشق سمعه وبصره، تبارك الله أحسن الخالقين»</div><div class="li-translit">Allāhumma laka sajadtu wa bika āmantu wa laka aslamt, sajada wajhī lilladhī khalaqahu wa ṣawwarah, wa shaqqa samʿahu wa baṣarah, tabāraka-llāhu aḥsanu l-khāliqīn.</div><div class="li-en">"O Allah, to You I have prostrated, in You I have believed, and to You I have submitted. My face has prostrated to the One who created it and shaped it, and brought forth its hearing and sight. Blessed is Allah, the Best of creators."<div class="h-source">أخرجه مسلم برقم (٧٧١) · Narrated by Muslim, no. 771</div></div></li>
</ol></li>
<li data-n="3"><div class="li-ar">ويكبر إذا رفع من السجود إذا كان في صلاة، أما إن كان في غير صلاة فلا يكبر عند الرفع.</div><div class="li-translit">Wa yukabbiru idhā rafaʿa mina s-sujūdi idhā kāna fī ṣalāh, ammā in kāna fī ghayri ṣalātin fa-lā yukabbiru ʿinda r-rafʿ.</div><div class="li-en">He says <strong>Allāhu akbar when rising</strong> from the prostration <strong>if he is in prayer</strong>. If he is <strong>not in prayer</strong>, he does <strong>not</strong> say takbīr when rising.</div></li>
</ol>

<div class="sec"><div class="sec-ar">سجود المستمع</div><div class="sec-translit">Sujūdu l-mustamiʿ</div><div class="sec-en">Prostration of the Listener</div></div>

<div class="body-text"><div class="bt-ar">يُشرع سجود التلاوة في حق المستمع وهو الذي يقصد الاستماع للقراءة (إذا سجد القارئ وكان قريبا منه سجد معه)، أما السامع الذي لم يقصد الاستماع فلا يشرع له السجود.</div><div class="bt-translit">Yushraʿu sujūdu t-tilāwati fī ḥaqqi l-mustamiʿ wa huwa lladhī yaqṣidu l-istimāʿa li-l-qirāʾah (idhā sajada l-qāriʾu wa kāna qarīban minhu sajada maʿah), ammā s-sāmiʿu lladhī lam yaqṣidi l-istimāʿa fa-lā yushraʿu lahu s-sujūd.</div><div class="bt-en">Sujūd at-tilāwah is prescribed for the <strong>listener (mustamiʿ)</strong> — the one who <strong>intends to listen</strong> to the recitation (if the reciter prostrates and he is near him, he prostrates with him). As for the <strong>hearer (sāmiʿ)</strong> who did not intend to listen, prostration is <strong>not</strong> prescribed for him.</div></div>

<div class="compare-grid">
<div class="compare-card"><div class="compare-card-head gold"><div class="ch-ar">المستمع</div><div class="ch-translit">Al-mustamiʿ — the listener</div></div><div class="compare-card-body"><ul><li>Sits and <strong>intends</strong> to listen.</li><li>Prostrates <strong>with the reciter</strong> ✓</li></ul></div></div>
<div class="compare-card"><div class="compare-card-head rust"><div class="ch-ar">السامع</div><div class="ch-translit">As-sāmiʿ — the hearer</div></div><div class="compare-card-body"><ul><li>Just happens to hear, no intention.</li><li>Prostration <strong>not prescribed</strong> ✗</li></ul></div></div>
</div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Takbīr when rising — only in prayer</span><div class="study-note-body">Outside prayer: takbīr going down, then just rise — <strong>no takbīr</strong> on rising. Inside prayer: takbīr going down <strong>and</strong> takbīr rising, like a normal sajdah.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — the sajdah Iblīs refused</span><div class="study-note-body">Every verse of prostration replays the oldest test: Allah commanded, Iblīs refused out of pride, and Ādam’s children bow. When you go down in sujūd at-tilāwah, you are choosing the side of humility — and Shayṭān weeps.<br><br>Your face — the most honoured part of you — on the ground, saying: "My face prostrates to the One who created it." What pride could you leave on the floor with it?</div></div>
`;}

function L4P6(){return `
<div class="sec"><div class="sec-ar">تاسعًا: سجود الشكر</div><div class="sec-translit">Tāsiʿan: sujūdu sh-shukr</div><div class="sec-en">Ninth: The Prostration of Thankfulness</div></div>

<div class="body-text"><div class="bt-ar">يُستحبُّ للمؤمن إذا وقع له أمر يُفرِحُه، أو دفع اللّه عنه مصيبةً أن يسجد لله شكرًا على هذه النعمة التي أنعم اللّه بها عليه، ودليل ذلك حديث أبي بَكْرة ﵁ عن النبي ﷺ: «أنه كان إذا أتاه أمر يسرّه خرّ ساجدًا شكرًا لله تبارك وتعالى»، ولا تشترط الطهارة لسجود الشكر، والطهارة أفضل.</div><div class="bt-translit">Yustaḥabbu li-l-muʾmini idhā waqaʿa lahu amrun yufriḥuh, aw dafaʿa-llāhu ʿanhu muṣībatan an yasjuda lillāhi shukran ʿalā hādhihi n-niʿmati llatī anʿama-llāhu bihā ʿalayh, wa dalīlu dhālika ḥadīthu Abī Bakrata raḍiya-llāhu ʿanhu ʿani n-nabiyyi ṣalla-llāhu ʿalayhi wa sallam: «annahu kāna idhā atāhu amrun yasurruhu kharra sājidan shukran lillāhi tabāraka wa taʿālā», wa lā tushtaraṭu ṭ-ṭahāratu li-sujūdi sh-shukr, wa ṭ-ṭahāratu afḍal.</div><div class="bt-en">It is <strong>recommended</strong> for the believer, when something happens that makes him happy, or Allah <strong>turns away a calamity</strong> from him, to <strong>prostrate to Allah in thanks</strong> for this blessing. The evidence is the ḥadīth of Abū Bakrah (may Allah be pleased with him) about the Prophet ﷺ: <strong>"Whenever something came to him that pleased him, he would fall down in prostration, thanking Allah, Blessed and Exalted."</strong> Purity is <strong>not a condition</strong> for the prostration of thanks, but it is better.<div class="h-source">أخرجه أبو داود برقم (٢٧٧٤)، والترمذي برقم (١٥٧٨)، وصححه الألباني: في صحيح سنن أبي داود · Narrated by Abū Dāwūd (2774) and at-Tirmidhī (1578); graded ṣaḥīḥ by al-Albānī in Ṣaḥīḥ Sunan Abī Dāwūd</div></div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word tip</span><div class="study-note-title">شُكْر · shukr</div><div class="study-note-body">Root ش-ك-ر (sh-k-r) = <strong>to thank, to show gratitude</strong>. <em>Ash-Shakūr</em> is one of Allah’s names: the One who appreciates and rewards even small deeds. Sujūd ash-shukr = a body-language "thank You".</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — gratitude for what <em>didn’t</em> happen</span><div class="study-note-body">Notice the book mentions two triggers: good news <strong>and</strong> a calamity that Allah <strong>turned away</strong>. We often thank Allah for what we got, but forget to thank Him for the accident that didn’t happen, the illness that passed, the loss we were spared.<br><br>Think of one thing Allah kept away from you this year. Have you thanked Him for it?</div></div>

<div class="sec"><div class="sec-ar">الأوقات المنهي عن الصلاة فيها</div><div class="sec-translit">Al-awqātu l-manhiyyu ʿani ṣ-ṣalāti fīhā</div><div class="sec-en">The Times in Which Prayer Is Forbidden</div></div>

<div class="body-text"><div class="bt-ar">الأصل جواز الصلاة في جميع الأوقات متى ما أراد المسلم ذلك، ولكن جاء الشرع بتحريم الصلاة في بعض الأوقات وهي كالآتي:</div><div class="bt-translit">Al-aṣlu jawāzu ṣ-ṣalāti fī jamīʿi l-awqāti matā mā arāda l-muslimu dhālik, wa lākin jāʾa sh-sharʿu bi-taḥrīmi ṣ-ṣalāti fī baʿḍi l-awqāti wa hiya ka-l-ātī:</div><div class="bt-en">The <strong>basic rule</strong> is that prayer is allowed at all times, whenever the Muslim wishes. But the Sharīʿah <strong>forbade</strong> praying at certain times, which are as follows:</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">من طلوع الفجر إلى طلوع الشمس وارتفاعها قدر رمح في رأي العين، وذلك نحو ربع ساعة تقريبًا بعد طلوعها.</div><div class="li-translit">Min ṭulūʿi l-fajri ilā ṭulūʿi sh-shamsi wa-rtifāʿihā qadra rumḥin fī raʾyi l-ʿayn, wa dhālika naḥwa rubʿi sāʿatin taqrīban baʿda ṭulūʿihā.</div><div class="li-en">From <strong>dawn (ṭulūʿ al-fajr)</strong> until the sun rises and climbs a spear’s height as it looks to the eye — about a <strong>quarter of an hour after sunrise</strong>.</div></li>
<li data-n="2"><div class="li-ar">عند توسّط الشمس في السماء حتى تزول، وهو قبل وقت الظهر بعشر دقائق تقريبًا.</div><div class="li-translit">ʿInda tawassuṭi sh-shamsi fi s-samāʾi ḥattā tazūl, wa huwa qabla waqti ẓ-ẓuhri bi-ʿashri daqāʾiqa taqrīban.</div><div class="li-en">When the sun is at the <strong>middle of the sky</strong> until it passes the zenith — about <strong>ten minutes before Ẓuhr</strong>.</div></li>
<li data-n="3"><div class="li-ar">من صلاة العصر حتى تغرب الشمس.</div><div class="li-translit">Min ṣalāti l-ʿaṣri ḥattā taghruba sh-shams.</div><div class="li-en">From <strong>after the ʿAṣr prayer</strong> until the sun sets.</div></li>
</ol>

<div class="study-note remember"><span class="study-note-label">⭐ Three "no-prayer" windows</span><div class="study-note-body">🌅 <strong>Morning:</strong> Fajr time → ~15 min after sunrise<br>☀️ <strong>Midday:</strong> ~10 min before Ẓuhr<br>🌇 <strong>Evening:</strong> after praying ʿAṣr → sunset<br>(This is about <em>voluntary</em> prayers — see the exceptions below.)</div></div>

<div class="sec"><div class="sec-ar">الحكمة من النهي عن الصلاة في أوقات النهي</div><div class="sec-translit">Al-ḥikmatu mina n-nahyi ʿani ṣ-ṣalāti fī awqāti n-nahy</div><div class="sec-en">The Wisdom Behind the Prohibition</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">أن جهنم تُسْجَر في وقت زوال الشمس، لقوله ﷺ: «فَإِنّها حِينَئِذٍ تُسْجَرُ جَهَنّمُ»</div><div class="li-translit">Anna jahannama tusjaru fī waqti zawāli sh-shams, li-qawlihi ṣalla-llāhu ʿalayhi wa sallam: «Fa-innahā ḥīnaʾidhin tusjaru jahannam.»</div><div class="li-en">Hell is <strong>stoked (made to blaze)</strong> at the time of the sun’s zenith, because the Prophet ﷺ said: <strong>"For at that time Hell is stoked."</strong><div class="h-source">أخرجه مسلم برقم (٨٣٢) · Narrated by Muslim, no. 832</div></div></li>
<li data-n="2"><div class="li-ar">البعد عن مشابهة المشركين الذين يسجدون للشمس عند طلوعها وعند غروبها لقوله ﷺ: «صلِّ صلاةَ الصُّبح ثُمَّ أقْصِرْ عن الصلاة حتى تَطلُعَ الشمسُ حتى ترتَفِعَ، فإنَّها تَطلُعُ بين قَرْنَي شيطانٍ، وحينَئِذٍ يَسجُدُ لها الكُفَّارُ»</div><div class="li-translit">Al-buʿdu ʿan mushābahati l-mushrikīna lladhīna yasjudūna li-sh-shamsi ʿinda ṭulūʿihā wa ʿinda ghurūbihā li-qawlihi ṣalla-llāhu ʿalayhi wa sallam: «Ṣalli ṣalāta ṣ-ṣubḥi thumma aqṣir ʿani ṣ-ṣalāti ḥattā taṭluʿa sh-shamsu ḥattā tartafiʿ, fa-innahā taṭluʿu bayna qarnay shayṭān, wa ḥīnaʾidhin yasjudu lahā l-kuffār.»</div><div class="li-en">To stay <strong>far from resembling the idolaters</strong>, who prostrate to the sun when it rises and when it sets — because the Prophet ﷺ said: <strong>"Pray the morning prayer, then refrain from praying until the sun rises and climbs high, for it rises between the two horns of a devil, and at that time the disbelievers prostrate to it."</strong><div class="h-source">أخرجه مسلم برقم (٨٣٢) · Narrated by Muslim, no. 832</div></div></li>
</ol>

<div class="study-note beginner"><span class="study-note-label">💡 Why would timing matter?</span><div class="study-note-body">Sun-worshippers bowed at sunrise and sunset. Islam keeps the Muslim’s sujūd <strong>clearly different</strong>: we prostrate only to the Creator of the sun, never at the very moment others bow to the sun. Tawḥīd shows even in <em>when</em> we pray.</div></div>

<div class="sec"><div class="sec-ar">الصلوات الجائزة في أوقات النهي</div><div class="sec-translit">Aṣ-ṣalawātu l-jāʾizatu fī awqāti n-nahy</div><div class="sec-en">Prayers Allowed During the Forbidden Times</div></div>

<ol class="num-list">

</div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — rain after despair</span><div class="study-note-body">Notice the words <em>"after they had lost hope."</em> Allah sometimes lets us reach the end of our own strength, so that we feel how much we need Him. Then He answers. The rain is called <strong>His mercy</strong> here. This whole unit is about two moments when people feel small (no rain, a darkened sun or moon) and what Allah asks us to do in them: turn back to Him.<br><br>Question to sit with: <em>When was the last time I felt I had "run out" of options? Did I turn to Allah first, or last?</em></div></div>

<div class="sec"><div class="sec-ar">الدرس الخامس: صلاة الاستسقاء</div><div class="sec-translit">Ad-darsu l-khāmis: Ṣalātu l-istisqāʾ</div><div class="sec-en">Lesson Five: The Prayer for Rain</div></div>

<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act5p1'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act5p1'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt"><strong>Introduction (tamhīd):</strong> Write a suitable expression for each picture. (The book shows two photos: dry, cracked ground, and a green road in heavy rain.)</div><div class="act-ar">تمهيد: اكتب تعبيرًا مناسبًا لكل صورة:</div><div class="act-translit">Tamhīd: uktub taʿbīran munāsiban li-kulli ṣūrah.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Model answers:<br>• Dry cracked land: <span dir="rtl" lang="ar">أرض جدباء لا نبات بها بسبب انقطاع المطر.</span> (A barren land with no plants because the rain stopped.)<br>• Green road in the rain: <span dir="rtl" lang="ar">نزل المطر رحمة من الله فاخضرت الأرض.</span> (Rain came down as a mercy from Allah and the land turned green.)</div></div>
</div>

<div class="body-text"><div class="bt-label">Introduction</div><div class="bt-ar">لا بدّ للمسلم دائمًا من الشعور بافتقاره إلى الله جل وعلا وحاجته إليه، ولا يغترّ بما تيسر من وسائل لتوفير الماء، هي في حقيقتها فيض من نعم الله تعالى، وليتذكر أن عدم نزول الأمطار إنما هو ابتلاء من الله تعالى لعباده ليرجعوا إليه، وذلك بعمل الصالحات والتوبة من الذنوب والمعاصي، وبخاصة منع الزكاة.</div><div class="bt-translit">Lā budda li-l-muslimi dāʾiman mina sh-shuʿūri bi-ftiqārihi ilā llāhi jalla wa ʿalā wa ḥājatihi ilayh, wa lā yaghtarra bi-mā tayassara min wasāʾila li-tawfīri l-māʾ, hiya fī ḥaqīqatihā fayḍun min niʿami llāhi taʿālā, wa l-yatadhakkar anna ʿadama nuzūli l-amṭāri innamā huwa btilāʾun mina llāhi taʿālā li-ʿibādihi li-yarjiʿū ilayh, wa dhālika bi-ʿamali ṣ-ṣāliḥāti wa t-tawbati mina dh-dhunūbi wa l-maʿāṣī, wa bi-khāṣṣatin manʿu z-zakāh.</div><div class="bt-en">A Muslim must always feel how much he <strong>needs Allah</strong> (Majestic and High is He). He should not be fooled by the easy ways we now have to get water — in truth, these are an overflow of Allah’s blessings. And he should remember that when rain does not come, it is a <strong>test from Allah</strong> for His servants, so that they <strong>return to Him</strong> — by doing good deeds and repenting from sins and disobedience, <strong>especially withholding zakāh</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why would a drought be connected to our sins?</span><div class="study-note-body">The book is teaching a heart lesson: water from a tap or a desalination plant can make us forget that every drop is a gift. When rain stops, it is a <strong>wake-up call</strong> — not to panic, but to come back to Allah. The way back is simple: do good, say sorry to Allah for sins, and pay what you owe (like zakāh). The book singles out <em>withholding zakāh</em> because it means holding back from people what Allah has given you.</div></div>

<div class="sec"><div class="sec-ar">تعريف الاستسقاء</div><div class="sec-translit">Taʿrīfu l-istisqāʾ</div><div class="sec-en">Definition of Istisqāʾ</div></div>

<div class="defbox"><div class="defbox-tag">📌 Definition</div><div class="defbox-body"><div class="defbox-ar">الاستسقاء: طلب السّقيا من الله تعالى بإنزال المطر عند الجدب.</div><div class="defbox-translit">Al-istisqāʾ: ṭalabu s-suqyā mina llāhi taʿālā bi-inzāli l-maṭari ʿinda l-jadb.</div><div class="defbox-en"><strong>Istisqāʾ</strong> is <strong>asking Allah for water</strong> — that He send down rain — at a time of <strong>drought</strong>.</div></div></div>

<div class="body-text"><div class="bt-label">Footnote (1)</div><div class="bt-ar">الجدب ضد الخصب، يقال أرض جدباء وجمعها أجادب، وهي الأرض التي لا نبات بها. انظر لسان العرب: ١/٢٥٦، مادة (جدب).</div><div class="bt-translit">Al-jadbu ḍiddu l-khiṣb, yuqālu arḍun jadbāʾ wa jamʿuhā ajādib, wa hiya l-arḍu llatī lā nabāta bihā. Unẓur Lisāna l-ʿArab: 1/256, māddat (j-d-b).</div><div class="bt-en"><strong>Jadb</strong> (drought) is the opposite of <strong>khiṣb</strong> (fertility). One says <em>arḍun jadbāʾ</em> ("a barren land"), plural <em>ajādib</em>: land with no plants on it. See <em>Lisān al-ʿArab</em> 1/256, entry j-d-b.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">اسْتِسْقَاء · istisqāʾ</div><div class="study-note-body">Root <strong>س-ق-ي (s-q-y)</strong> = <strong>to give water / to give a drink</strong>. You already know <em>saqā</em> (he gave water) and <em>suqyā</em> (watering).<br><br>The pattern <strong>istafʿala</strong> (اِسْتَفْعَلَ) often means <em>"to ask for"</em>: <em>ghafara</em> (forgive) → <em>istighfār</em> (asking forgiveness). So <em>saqā</em> (give water) → <strong>istisqāʾ</strong> = <em>asking to be given water</em>. One root, one pattern, and the meaning unlocks itself!</div></div>

<div class="body-text"><div class="bt-label">Three ways of asking for rain</div><div class="bt-ar">وقد جاء الدعاء بطلب الغيث من الله على ثلاث صفات هي:</div><div class="bt-translit">Wa qad jāʾa d-duʿāʾu bi-ṭalabi l-ghaythi mina llāhi ʿalā thalāthi ṣifātin hiya:</div><div class="bt-en">Making duʿāʾ to ask Allah for rain has come in <strong>three forms</strong>:</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">الصلاة جماعة مع الخطبة والدعاء بصفة خاصة وهي أكملها. وهذه الكيفية هي «صلاة الاستسقاء» وهي موضوع هذا الدرس.</div><div class="li-translit">Aṣ-ṣalātu jamāʿatan maʿa l-khuṭbati wa d-duʿāʾi bi-ṣifatin khāṣṣah, wa hiya akmaluhā. Wa hādhihi l-kayfiyyatu hiya «ṣalātu l-istisqāʾ» wa hiya mawḍūʿu hādhā d-dars.</div><div class="li-en">Praying <strong>in congregation</strong> with a <strong>sermon</strong> and duʿāʾ in a special way — this is the <strong>most complete</strong> form. This is "the Prayer for Rain," the topic of this lesson.</div></li>
<li data-n="2"><div class="li-ar">الدعاء في خُطبة الجمعة كما فعل النبي ﷺ.</div><div class="li-translit">Ad-duʿāʾu fī khuṭbati l-jumuʿah kamā faʿala n-nabiyyu ﷺ.</div><div class="li-en">Making duʿāʾ during the <strong>Friday sermon</strong>, as the Prophet ﷺ did.</div></li>
<li data-n="3"><div class="li-ar">الدعاء في أي وقت بطلب السُّقيا.</div><div class="li-translit">Ad-duʿāʾu fī ayyi waqtin bi-ṭalabi s-suqyā.</div><div class="li-en">Making duʿāʾ <strong>at any time</strong>, asking for rain.</div></li>
</ol>

<div class="study-note remember"><span class="study-note-label">⭐ Memory hook: 1 – 2 – 3</span><div class="study-note-body">1️⃣ <strong>Special prayer</strong> (full version) → 2️⃣ <strong>Jumuʿah sermon</strong> → 3️⃣ <strong>Any time, on your own</strong>. You personally can always do #3 — raise your hands and ask Allah for rain, today.</div></div>
`;}

function L5P2(){return `
<div class="sec"><div class="sec-ar">وقت مشروعية صلاة الاستسقاء</div><div class="sec-translit">Waqtu mashrūʿiyyati ṣalāti l-istisqāʾ</div><div class="sec-en">When the Prayer for Rain Is Prescribed</div></div>

<div class="body-text"><div class="bt-ar">تشرع صلاة الاستسقاء إذا حُبس المطر وحصل الضرر من انقطاعه.</div><div class="bt-translit">Tushraʿu ṣalātu l-istisqāʾi idhā ḥubisa l-maṭaru wa ḥaṣala ḍ-ḍararu min inqiṭāʿih.</div><div class="bt-en">The Prayer for Rain is prescribed when <strong>rain is held back</strong> and <strong>harm results</strong> from it stopping.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 So, two conditions?</span><div class="study-note-body">Yes: (1) the rain has stopped coming, and (2) people are being harmed by it — crops dying, wells drying, animals suffering. It is not prayed just because it hasn’t rained for a few days.</div></div>

<div class="sec"><div class="sec-ar">حكمها</div><div class="sec-translit">Ḥukmuhā</div><div class="sec-en">Its Ruling</div></div>

<div class="body-text"><div class="bt-ar">صلاة الاستسقاء سُنّة مؤكدة عند وجود سببها؛ لفعل النبي ﷺ كما في حديث عبدالله بن زيد ﵁ قال:</div><div class="bt-translit">Ṣalātu l-istisqāʾi sunnatun muʾakkadatun ʿinda wujūdi sababihā; li-fiʿli n-nabiyyi ﷺ kamā fī ḥadīthi ʿAbdi llāhi bni Zaydin raḍiya llāhu ʿanhu qāla:</div><div class="bt-en">The Prayer for Rain is a <strong>sunnah muʾakkadah</strong> (strongly emphasised sunnah) when its cause exists, because the Prophet ﷺ did it, as in the ḥadīth of ʿAbdullāh ibn Zayd (may Allah be pleased with him), who said:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — The Prophet ﷺ prays for rain</div><div class="h-ar">«خرج النبي ﷺ إلى المُصَلَّى فاستسقى، واستقبل القبلة، وقَلَبَ رِدَاءَهُ، وصلى ركعتين»</div><div class="h-translit">Kharaja n-nabiyyu ﷺ ilā l-muṣallā fa-stasqā, wa-staqbala l-qiblah, wa qalaba ridāʾahu, wa ṣallā rakʿatayn.</div><div class="h-en">"The Prophet ﷺ went out to the <strong>muṣallā</strong> (open prayer ground) and asked for rain. He faced the qiblah, <strong>turned his cloak inside out</strong>, and prayed <strong>two rakʿahs</strong>."</div><div class="h-source">أخرجه البخاري برقم (١٠١٢)، ومسلم برقم (٨٩٤) · Narrated by al-Bukhārī, no. 1012, and Muslim, no. 894</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Four actions in one ḥadīth</span><div class="study-note-body">Went out → <strong>asked</strong> for rain → <strong>faced qiblah</strong> → <strong>flipped his cloak</strong> → <strong>prayed 2 rakʿahs</strong>. Almost the whole lesson is inside this one sentence!</div></div>

<div class="sec"><div class="sec-ar">وقتها</div><div class="sec-translit">Waqtuhā</div><div class="sec-en">Its Time</div></div>

<div class="body-text"><div class="bt-ar">من ارتفاع الشمس قدر رمح، وذلك بعد طلوع الشمس بربع ساعة تقريبًا، إلى قبيل الزوال.</div><div class="bt-translit">Min irtifāʿi sh-shamsi qadra rumḥ, wa dhālika baʿda ṭulūʿi sh-shamsi bi-rubʿi sāʿatin taqrīban, ilā qubayli z-zawāl.</div><div class="bt-en">From when the sun has risen <strong>the height of a spear</strong> — about <strong>a quarter of an hour after sunrise</strong> — until <strong>just before zawāl</strong> (when the sun passes its highest point, just before ẓuhr).</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Does this time sound familiar?</span><div class="study-note-body">It is the same window as the <strong>ʿĪd prayer</strong> and the <strong>ḍuḥā</strong> time: morning, after the sun is clearly up, before midday. "The height of a spear" is how the Arabs measured the sun just above the horizon.</div></div>

<div class="sec"><div class="sec-ar">موضعها</div><div class="sec-translit">Mawḍiʿuhā</div><div class="sec-en">Its Place</div></div>

<div class="body-text"><div class="bt-ar">السُّنّة أن تُؤدّى في المصلّى؛ لفعل الرسول ﷺ، وإن صُلِّيت في المسجد فلا بأس.</div><div class="bt-translit">As-sunnatu an tuʾaddā fī l-muṣallā; li-fiʿli r-rasūli ﷺ, wa in ṣulliyat fī l-masjidi fa-lā baʾs.</div><div class="bt-en">The sunnah is to pray it in the <strong>muṣallā</strong> (open prayer ground), because the Messenger ﷺ did so. But if it is prayed in the <strong>masjid</strong>, there is <strong>no harm</strong>.</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Don’t mix these up</span><div class="study-note-body"><strong>Muṣallā</strong> (مُصَلَّى) here = an open outdoor prayer ground, like the one used for ʿĪd. It is not the same as a prayer mat or a small prayer room. Praying outside is the sunnah, but the masjid is still valid.</div></div>
`;}

function L5P3(){return `
<div class="sec"><div class="sec-ar">صفتها</div><div class="sec-translit">Ṣifatuhā</div><div class="sec-en">How It Is Performed</div></div>

<div class="point"><div class="point-num">1</div><div class="point-ar">أولاً: الصلاة: وهي ركعتان بلا أذان ولا إقامة، يجهر فيهما بالقراءة، يكبر في الركعة الأولى تكبيرة الإحرام، ثم يقرأ دعاء الاستفتاح، ثم يكبر ست تكبيرات، يرفع يديه مع كل تكبيرة، ويحمد الله ويثني عليه، ويصلي على النبي ﷺ بين التكبيرات، ثم يتعوذ ويبسمل، ويشرع في القراءة.</div><div class="point-translit">Awwalan: aṣ-ṣalāh: wa hiya rakʿatāni bi-lā adhānin wa lā iqāmah, yajharu fīhimā bi-l-qirāʾah, yukabbiru fī r-rakʿati l-ūlā takbīrata l-iḥrām, thumma yaqraʾu duʿāʾa l-istiftāḥ, thumma yukabbiru sitta takbīrāt, yarfaʿu yadayhi maʿa kulli takbīrah, wa yaḥmadu llāha wa yuthnī ʿalayh, wa yuṣallī ʿalā n-nabiyyi ﷺ bayna t-takbīrāt, thumma yataʿawwadhu wa yubasmil, wa yashraʿu fī l-qirāʾah.</div><div class="point-en"><strong>First: the prayer.</strong> It is <strong>two rakʿahs</strong>, with <strong>no adhān and no iqāmah</strong>. The recitation is <strong>aloud</strong>. In the first rakʿah he says the opening takbīr (takbīrat al-iḥrām), then reads the opening duʿāʾ (istiftāḥ), then says <strong>six takbīrs</strong>, raising his hands with each one. Between the takbīrs he praises Allah, glorifies Him, and sends ṣalāh on the Prophet ﷺ. Then he seeks refuge (aʿūdhu billāh), says bismillāh, and begins reciting.</div></div>

<div class="point"><div class="point-num">2</div><div class="point-ar">ويكبر في الركعة الثانية -بعد تكبيرة الانتقال- خمس تكبيرات، ثم يستعيذ ويبسمل ويشرع في القراءة.</div><div class="point-translit">Wa yukabbiru fī r-rakʿati th-thāniyah — baʿda takbīrati l-intiqāl — khamsa takbīrāt, thumma yastaʿīdhu wa yubasmilu wa yashraʿu fī l-qirāʾah.</div><div class="point-en">In the <strong>second rakʿah</strong> — after the takbīr for standing up — he says <strong>five takbīrs</strong>, then seeks refuge, says bismillāh, and begins reciting.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Wait — isn’t this just like ʿĪd prayer?</span><div class="study-note-body">Exactly! The prayer itself looks like the ʿĪd prayer: two rakʿahs, aloud, no adhān or iqāmah, <strong>6 extra takbīrs</strong> in the first rakʿah (after the opening takbīr and istiftāḥ) and <strong>5 extra takbīrs</strong> in the second (after the takbīr of standing up). If you have learned ʿĪd, you have mostly learned this.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Count it on your fingers</span><div class="study-note-body">Rakʿah 1: takbīrat al-iḥrām → istiftāḥ → <strong>6</strong> takbīrs → aʿūdhu / bismillāh → recite.<br>Rakʿah 2: takbīr of standing → <strong>5</strong> takbīrs → aʿūdhu / bismillāh → recite.<br>Between each takbīr: praise Allah + ṣalāh on the Prophet ﷺ.</div></div>

<div class="point"><div class="point-num">3</div><div class="point-ar">ثانيًا: الخطبة: وهي خطبة واحدة بعد الصلاة يُكثر فيها من الاستغفار وتلاوة الآيات التي تأمر به.</div><div class="point-translit">Thāniyan: al-khuṭbah: wa hiya khuṭbatun wāḥidatun baʿda ṣ-ṣalāh, yukthiru fīhā mina l-istighfāri wa tilāwati l-āyāti llatī taʾmuru bih.</div><div class="point-en"><strong>Second: the sermon.</strong> It is <strong>one sermon</strong> (not two), given <strong>after the prayer</strong>. In it, the imam asks Allah’s forgiveness a lot and recites the verses that command seeking forgiveness.</div></div>

<div class="body-text"><div class="bt-label">Footnote (2)</div><div class="bt-ar">قال الشيخ ابن باز رحمه الله تعالى (مجموع فتاوى ومقالات سماحته ١٣/٦١-٦٢): ثبت عنه ﷺ ما يدل على أنه خطب قبل الصلاة وخطب بعد الصلاة، وقال أيضاً: فكل منهما ثابت، وكل منهما موسع بحمد الله، من خطب ثم صلى فلا بأس، ومن صلى ثم خطب فلا بأس، كل هذا جاء عنه عليه الصلاة والسلام، والأمر في ذلك واسع والحمد لله. وقال الشيخ ابن عثيمين رحمه الله تعالى (مجموع فتاوي ابن عثيمين ١٦/٣٥٥): هي خطبة واحدة؛ إما قبل الصلاة وإما بعد الصلاة. فالأمر كله جائز.</div><div class="bt-translit">Qāla sh-Shaykhu bnu Bāzin raḥimahu llāhu taʿālā (Majmūʿu Fatāwā wa Maqālāti Samāḥatihi 13/61–62): thabata ʿanhu ﷺ mā yadullu ʿalā annahu khaṭaba qabla ṣ-ṣalāti wa khaṭaba baʿda ṣ-ṣalāh. Wa qāla ayḍan: fa-kullun minhumā thābit, wa kullun minhumā muwassaʿun bi-ḥamdi llāh; man khaṭaba thumma ṣallā fa-lā baʾs, wa man ṣallā thumma khaṭaba fa-lā baʾs, kullu hādhā jāʾa ʿanhu ʿalayhi ṣ-ṣalātu wa s-salām, wa l-amru fī dhālika wāsiʿun wa l-ḥamdu lillāh. Wa qāla sh-Shaykhu bnu ʿUthaymīna raḥimahu llāhu taʿālā (Majmūʿu Fatāwī bni ʿUthaymīn 16/355): hiya khuṭbatun wāḥidah; immā qabla ṣ-ṣalāti wa immā baʿda ṣ-ṣalāh. Fa-l-amru kulluhu jāʾiz.</div><div class="bt-en">Shaykh Ibn Bāz (may Allah have mercy on him) said (<em>Majmūʿ Fatāwā wa Maqālāt</em> 13/61–62): "It is established from the Prophet ﷺ that he gave the sermon <strong>before</strong> the prayer, and also <strong>after</strong> the prayer." He also said: "Both are established, and both are allowed, praise be to Allah. Whoever gives the sermon and then prays — no harm. Whoever prays and then gives the sermon — no harm. All of this came from him (upon him be peace and blessings). The matter is broad, praise be to Allah." Shaykh Ibn ʿUthaymīn (may Allah have mercy on him) said (<em>Majmūʿ Fatāwā Ibn ʿUthaymīn</em> 16/355): "It is <strong>one sermon</strong>, either before the prayer or after it. All of it is permissible."</div></div>

<div class="study-note watch-out"><span class="study-note-label">⚠️ Before or after the prayer?</span><div class="study-note-body">The main text says the sermon is <strong>after</strong> the prayer. The footnote adds that the scholars Ibn Bāz and Ibn ʿUthaymīn said <strong>both orders</strong> are reported from the Prophet ﷺ, so either is fine. If your local imam does it the other way, he is not wrong. What stays fixed: it is <strong>one</strong> sermon, full of istighfār.</div></div>

<div class="study-note reflect"><span class="study-note-label">🤲 Deep reflection — why so much istighfār?</span><div class="study-note-body">You might expect a rain sermon to be all about asking for rain. Instead, the book says it is filled with <strong>asking forgiveness</strong>. Why? Because the introduction told us that drought is a test meant to bring us back to Allah. The door back is <em>istighfār</em>. Before asking Allah to fix the outside world (the sky), we ask Him to fix the inside world (our hearts).<br><br>Try this: next time you need something badly, start your duʿāʾ with sincere <em>astaghfirullāh</em> before you ask.</div></div>
`;}

function L5P4(){return `
<div class="sec"><div class="sec-ar">سننها</div><div class="sec-translit">Sunanuhā</div><div class="sec-en">Its Sunnahs</div></div>

<ol class="num-list">
<li data-n="1"><div class="li-ar">أن تتضمن الخطبة موعظةً وتذكيرًا للناس بما يُليّن قلوبهم.</div><div class="li-translit">An tataḍammana l-khuṭbatu mawʿiẓatan wa tadhkīran li-n-nāsi bi-mā yulayyinu qulūbahum.</div><div class="li-en">The sermon should include <strong>admonition</strong> and <strong>reminders</strong> for people — things that <strong>soften their hearts</strong>.</div></li>
</ol>

<div class="activity" id="act5p4">
<div class="section-badge">نَشَاط · Activity</div>
<div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('act5p4'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('act5p4'))">Hide All</button></div>
<div class="act-item"><div class="act-prompt">Among the things people should be reminded of in the sermon are: (a) … (b) … (c) …</div><div class="act-ar">ومن الأمور التي ينبغي التذكير بها في الخطبة: أ- ... ب- ... ج- ...</div><div class="act-translit">Wa mina l-umūri llatī yanbaghī t-tadhkīru bihā fī l-khuṭbah: alif… bāʾ… jīm…</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box">Model answer (from this lesson’s introduction):<br>أ- <span dir="rtl" lang="ar">التوبة من الذنوب والمعاصي والإكثار من الاستغفار.</span> — Repenting from sins and seeking forgiveness a lot.<br>ب- <span dir="rtl" lang="ar">أداء الزكاة وعدم منعها، والصدقة.</span> — Paying zakāh and not withholding it; giving charity.<br>ج- <span dir="rtl" lang="ar">الافتقار إلى الله والرجوع إليه بعمل الصالحات، وأن عدم نزول المطر ابتلاء.</span> — Feeling our need for Allah and returning to Him with good deeds; that lack of rain is a test.</div></div>
</div>

<ol class="num-list">
<li data-n="2"><div class="li-ar">تعيين يوم للخروج إليها، ليكون الناس على استعداد لذلك.</div><div class="li-translit">Taʿyīnu yawmin li-l-khurūji ilayhā, li-yakūna n-nāsu ʿalā istiʿdādin li-dhālik.</div><div class="li-en"><strong>Setting a day</strong> for going out to it, so that people can get ready.</div></li>
<li data-n="3"><div class="li-ar">الخروج إليها بخضوع وخشوع وتضرُّع وتذلُّل، مع إظهار الافتقار إلى الله.</div><div class="li-translit">Al-khurūju ilayhā bi-khuḍūʿin wa khushūʿin wa taḍarruʿin wa tadhallul, maʿa iẓhāri l-iftiqāri ilā llāh.</div><div class="li-en">Going out to it with <strong>submission, humility, earnest pleading and lowliness</strong>, showing one’s <strong>need for Allah</strong>.</div></li>
</ol>

<div class="body-text"><div class="bt-ar">قال ابن عباس ﵄ في وصف خروج النبي ﷺ للاستسقاء:</div><div class="bt-translit">Qāla bnu ʿAbbāsin raḍiya llāhu ʿanhumā fī waṣfi khurūji n-nabiyyi ﷺ li-l-istisqāʾ:</div><div class="bt-en">Ibn ʿAbbās (may Allah be pleased with him and his father) said, describing how the Prophet ﷺ went out for the Prayer for Rain:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — How he ﷺ went out</div><div class="h-ar">«خرج رسول الله ﷺ مُتَبَذِّلاً، متواضعًا، متضرِّعًا حتى أتى المُصَلَّى»</div><div class="h-translit">Kharaja rasūlu llāhi ﷺ mutabadhdhilan, mutawāḍiʿan, mutaḍarriʿan ḥattā atā l-muṣallā.</div><div class="h-en">"The Messenger of Allah ﷺ went out <strong>in plain, simple clothing</strong>, <strong>humble</strong>, <strong>pleading earnestly</strong>, until he reached the muṣallā."</div><div class="h-source">أخرجه أبو داود برقم (١١٦٥)، والترمذي برقم (٥٥٨)، وقال: حسن صحيح، وصححه ابن خزيمة: ٢/٣٣١، وابن حبان: ٧/١١٢ · Narrated by Abū Dāwūd, no. 1165, and at-Tirmidhī, no. 558 (he said: ḥasan ṣaḥīḥ); graded authentic by Ibn Khuzaymah (2/331) and Ibn Ḥibbān (7/112)</div></div>

<div class="body-text"><div class="bt-label">Footnote (1)</div><div class="bt-ar">التبذل: ترك التزيُّن والتَّهيؤ بالهيئة الحسنَة الجميلة على جهة التواضع، انظر النهاية في غريب الحديث والأثر: ١/١١١.</div><div class="bt-translit">At-tabadhdhul: tarku t-tazayyuni wa t-tahayyuʾi bi-l-hayʾati l-ḥasanati l-jamīlati ʿalā jihati t-tawāḍuʿ. Unẓur an-Nihāyata fī Gharībi l-Ḥadīthi wa l-Athar: 1/111.</div><div class="bt-en"><strong>Tabadhdhul</strong> means <strong>not adorning yourself</strong> or dressing up in a fine, beautiful appearance — out of humility. See <em>an-Nihāyah fī Gharīb al-Ḥadīth wa l-Athar</em> 1/111.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why plain clothes here, but best clothes for ʿĪd?</span><div class="study-note-body">ʿĪd is a day of <strong>joy and thanks</strong>, so we beautify ourselves. The Prayer for Rain is a moment of <strong>need and humility</strong> — like a poor person standing at a generous door. So the Prophet ﷺ dressed simply. Each occasion has its own "outfit" for the heart and the body.</div></div>

<ol class="num-list">
<li data-n="4"><div class="li-ar">الإكثار في خطبة الاستسقاء من الاستغفار والدعاء، ويُكثر من الأدعية المأثورة مع رفع اليدين والإلحاح فيه.</div><div class="li-translit">Al-ikthāru fī khuṭbati l-istisqāʾi mina l-istighfāri wa d-duʿāʾ, wa yukthiru mina l-adʿiyati l-maʾthūrati maʿa rafʿi l-yadayni wa l-ilḥāḥi fīh.</div><div class="li-en">Doing <strong>a lot of istighfār and duʿāʾ</strong> in the sermon, using many of the <strong>duʿāʾs reported</strong> from the Prophet ﷺ, <strong>raising the hands</strong>, and <strong>asking again and again</strong> (persisting) in it.</div></li>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word of the day</span><div class="study-note-title">كُسُوف / خُسُوف · kusūf / khusūf</div><div class="study-note-body"><strong>ك-س-ف (k-s-f)</strong> = to become dark, to lose its shine → <strong>kusūf</strong>. <strong>خ-س-ف (kh-s-f)</strong> = to sink, to be swallowed, to fade → <strong>khusūf</strong>.<br><br>Memory trick: the words differ by one letter. <strong>K</strong>usūf → sun (by day). <strong>Kh</strong>usūf → moon (by night). The book uses them this way. In ḥadīth the two words are sometimes used for either one, so don’t worry if you see them swapped.</div></div>

<div class="sec"><div class="sec-ar">حكم صلاة الكسوف والخسوف</div><div class="sec-translit">Ḥukmu ṣalāti l-kusūfi wa l-khusūf</div><div class="sec-en">The Ruling of the Eclipse Prayer</div></div>

<div class="body-text"><div class="bt-ar">سُنَّة مؤكدة؛ دلَّ على ذلك فعل الرسول ﷺ، حيث صلَّاها لمَّا كسفت الشمس على عهده ﷺ، كما دل عليها أمره، حيث قال ﷺ:</div><div class="bt-translit">Sunnatun muʾakkadah; dalla ʿalā dhālika fiʿlu r-rasūli ﷺ, ḥaythu ṣallāhā lammā kasafati sh-shamsu ʿalā ʿahdihi ﷺ, kamā dalla ʿalayhā amruh, ḥaythu qāla ﷺ:</div><div class="bt-en">It is a <strong>sunnah muʾakkadah</strong> (strongly emphasised sunnah). The evidence is the Messenger’s ﷺ <strong>action</strong> — he prayed it when the sun eclipsed in his lifetime — and also his <strong>command</strong>, for he ﷺ said:</div></div>

<div class="hadith"><div class="hadith-label">Ḥadīth — Two signs of Allah</div><div class="h-ar">«إن الشمس والقمر آيتان من آيات الله، لا ينخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فادعوا الله وكبّروا وصلّوا وتصدّقوا»</div><div class="h-translit">Inna sh-shamsa wa l-qamara āyatāni min āyāti llāh, lā yankhasifāni li-mawti aḥadin wa lā li-ḥayātih, fa-idhā raʾaytum dhālika fa-dʿū llāha wa kabbirū wa ṣallū wa taṣaddaqū.</div><div class="h-en">"The sun and the moon are <strong>two signs among the signs of Allah</strong>. They do not eclipse for the death of anyone, nor for anyone’s birth. So when you see that, <strong>call upon Allah, say takbīr, pray, and give charity</strong>."</div><div class="h-source">أخرجه البخاري برقم (١٠٤٤)، ومسلم برقم (٩٠١) · Narrated by al-Bukhārī, no. 1044, and Muslim, no. 901</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why did the Prophet ﷺ say "not for anyone’s death"?</span><div class="study-note-body">On the day the sun eclipsed in Madinah, the Prophet’s ﷺ young son Ibrāhīm had just died, and some people said the sun eclipsed because of his death. The Prophet ﷺ could have let them believe it. Instead he <strong>corrected</strong> them: eclipses are signs of Allah’s power, not reactions to human events. Honesty, even in grief.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ 4 things to do in an eclipse</span><div class="study-note-body"><strong>D-T-P-C</strong>: <strong>D</strong>uʿāʾ (ادعوا) · <strong>T</strong>akbīr (كبّروا) · <strong>P</strong>ray (صلّوا) · <strong>C</strong>harity (تصدّقوا).</div></div>

<div class="body-text"><div class="bt-ar">وقد أجمع العلماء على مشروعيتها، حيث يشرع للمسلم إذا رأى الكسوف أو الخسوف أن يبادر إلى ترك ماهو مشغول به، والاتجاه إلى المسجد ليشارك المسلمين الصلاة والتضرع لله تعالى.</div><div class="bt-translit">Wa qad ajmaʿa l-ʿulamāʾu ʿalā mashrūʿiyyatihā, ḥaythu yushraʿu li-l-muslimi idhā raʾā l-kusūfa awi l-khusūfa an yubādira ilā tarki mā huwa mashghūlun bih, wa l-ittijāhi ilā l-masjidi li-yushārika l-muslimīna ṣ-ṣalāta wa t-taḍarruʿa lillāhi taʿālā.</div><div class="bt-en">The scholars have <strong>agreed unanimously (ijmāʿ)</strong> that it is prescribed. When a Muslim sees a solar or lunar eclipse, he should <strong>hurry to leave whatever he is busy with</strong> and go to the masjid, to join the Muslims in prayer and in humbly pleading to Allah the Exalted.</div></div>
